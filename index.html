<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10131b">
  <title>Cuộc gọi từ phòng 404</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&family=DM+Mono:wght@400;500&display=swap');

    :root {
      --bg: #10131b;
      --bg-deep: #090b11;
      --panel: #202634;
      --panel-2: #283042;
      --panel-soft: #171c27;
      --shadow-purple: #403454;
      --red: #ed6a73;
      --red-soft: #ed6a7322;
      --mint: #72e0c3;
      --mint-soft: #72e0c31c;
      --gold: #f0c779;
      --gold-soft: #f0c7791d;
      --text: #f5f1e8;
      --muted: #bac2d2;
      --dim: #7f899c;
      --line: #ffffff18;
      --line-bright: #ffffff2c;
      --radius: 18px;
      --serif: Georgia, 'Times New Roman', serif;
    }

    * { box-sizing: border-box; }
    html { min-width: 320px; background: var(--bg-deep); }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at 50% -10%, #40345444, transparent 42%),
        radial-gradient(circle at 8% 36%, #72e0c30c, transparent 25%),
        linear-gradient(140deg, var(--bg-deep), var(--bg) 45%, #121827);
      font-family: 'Be Vietnam Pro', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      overflow-x: hidden;
    }
    body.reduced-motion *, body.reduced-motion *::before, body.reduced-motion *::after {
      animation-duration: .001ms !important;
      animation-iteration-count: 1 !important;
      scroll-behavior: auto !important;
      transition-duration: .001ms !important;
    }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible {
      outline: 3px solid var(--mint);
      outline-offset: 2px;
    }
    ::selection { background: var(--gold); color: var(--bg-deep); }

    .noise, .grain, .fog { pointer-events: none; position: fixed; inset: 0; z-index: 0; }
    .noise { opacity: .06; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.5'/%3E%3C/svg%3E"); }
    .grain { opacity: .07; background: repeating-linear-gradient(0deg, transparent 0 3px, #ffffff03 3px 4px); mix-blend-mode: screen; }
    .fog { top: auto; height: 22vh; background: linear-gradient(0deg, #bac2d20e, transparent); filter: blur(18px); animation: fog-drift 18s ease-in-out infinite alternate; }
    @keyframes fog-drift { from { transform: translateX(-3%); opacity: .5; } to { transform: translateX(3%); opacity: .8; } }

    .app-shell { position: relative; z-index: 1; min-height: 100vh; }
    .wrap { width: min(1500px, calc(100% - 36px)); margin: 0 auto; }
    .topbar {
      min-height: 72px; display: flex; align-items: center; justify-content: space-between; gap: 18px;
      border-bottom: 1px solid var(--line); background: #0c1019cc; backdrop-filter: blur(14px); padding: 15px 30px;
      position: sticky; top: 0; z-index: 10;
    }
    .brand { display: flex; gap: 12px; align-items: center; min-width: 0; }
    .brand-mark { width: 42px; height: 42px; display: grid; place-items: center; border: 1px solid var(--gold); color: var(--gold); border-radius: 12px; font-family: var(--serif); font-size: 20px; box-shadow: 0 0 26px #f0c7791c; }
    .brand-copy { min-width: 0; }
    .brand-copy b { display: block; font-size: 13px; letter-spacing: .16em; white-space: nowrap; }
    .brand-copy span { display: block; color: var(--dim); font-size: 11px; margin-top: 2px; letter-spacing: .03em; }
    .top-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: center; gap: 8px; }
    .eyebrow { color: var(--gold); font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: .15em; text-transform: uppercase; }
    .pill { display: inline-flex; align-items: center; gap: 7px; border-radius: 999px; border: 1px solid var(--line); background: #ffffff08; padding: 7px 10px; color: var(--muted); font-size: 11px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); box-shadow: 0 0 8px currentColor; }
    .dot.mint { background: var(--mint); color: var(--mint); }
    .dot.red { background: var(--red); color: var(--red); }
    .dot.gold { background: var(--gold); color: var(--gold); }

    .page { padding: 34px 0 70px; }
    .card {
      background: linear-gradient(145deg, #202634eF, #161b27F4);
      border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 24px 70px #0000002b; overflow: hidden;
    }
    .card.pad { padding: 22px; }
    .card-title { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
    .card-title h2, .card-title h3 { margin: 3px 0 0; line-height: 1.16; }
    .card-title h2 { font-size: clamp(22px, 2.2vw, 33px); }
    .card-title h3 { font-size: 17px; }
    .subtle { color: var(--muted); font-size: 13px; line-height: 1.6; }
    .muted { color: var(--muted); }
    .dim { color: var(--dim); }
    .red { color: var(--red); }
    .mint { color: var(--mint); }
    .gold { color: var(--gold); }
    .mono { font-family: 'DM Mono', monospace; }
    .serif { font-family: var(--serif); }

    .btn {
      border: 1px solid var(--line-bright); border-radius: 12px; padding: 11px 15px; color: var(--text); background: #ffffff0a; font-weight: 800; font-size: 12px;
      transition: transform .18s ease, filter .18s ease, border-color .18s ease, background .18s ease; display: inline-flex; gap: 8px; align-items: center; justify-content: center;
    }
    .btn:hover { transform: translateY(-2px); filter: brightness(1.1); border-color: #ffffff55; }
    .btn.primary { color: #0d241f; background: var(--mint); border-color: var(--mint); }
    .btn.gold { color: #3b2b0c; background: var(--gold); border-color: var(--gold); }
    .btn.danger { color: #fff3f3; background: var(--red); border-color: var(--red); }
    .btn.ghost { background: transparent; }
    .btn.sm { padding: 8px 10px; font-size: 11px; }
    .btn:disabled, .btn.disabled { cursor: not-allowed; opacity: .42; transform: none; filter: none; }

    /* Landing */
    .landing { min-height: calc(100vh - 72px); display: grid; place-items: center; padding: 44px 0; }
    .landing-grid { width: 100%; display: grid; grid-template-columns: minmax(0, 1.02fr) minmax(390px, .98fr); gap: 30px; align-items: center; }
    .hero-copy { padding: 28px 0; }
    .hero-copy .eyebrow { font-size: 11px; }
    .hero-title { font-family: var(--serif); font-size: clamp(54px, 7vw, 104px); line-height: .93; font-weight: 700; margin: 20px 0 22px; letter-spacing: -.05em; max-width: 760px; }
    .hero-title em { color: var(--gold); font-style: normal; }
    .hero-lede { font-size: clamp(15px, 1.6vw, 19px); line-height: 1.65; color: var(--muted); max-width: 620px; }
    .hero-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 28px; }
    .hero-foot { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 32px; }
    .hero-stat { border-left: 1px solid var(--gold); padding-left: 10px; min-width: 105px; }
    .hero-stat b { display: block; font-family: var(--serif); color: var(--gold); font-size: 21px; }
    .hero-stat span { font-size: 10px; color: var(--dim); text-transform: uppercase; letter-spacing: .08em; }

    .hotel-scene { min-height: 570px; position: relative; border: 1px solid var(--line); border-radius: 25px; overflow: hidden; background: linear-gradient(170deg, #2d2d46 0%, #202338 44%, #11151e 100%); box-shadow: 0 35px 110px #0008; isolation: isolate; }
    .hotel-scene::before { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at 70% 31%, #f0c77927 0 4%, transparent 27%), linear-gradient(105deg, transparent 20%, #090b11aa 70%); z-index: -1; }
    .window { position: absolute; left: 8%; top: 10%; width: 37%; height: 45%; border: 12px solid #171822; border-bottom-width: 18px; background: radial-gradient(circle at 45% 43%, #c6d7e8 0 2%, transparent 3%), radial-gradient(circle at 60% 35%, #c6d7e8 0 1.5%, transparent 2%), linear-gradient(160deg, #2d4668, #101828 70%); box-shadow: inset 0 0 38px #000, 0 0 0 2px #f0c77922; }
    .window::before, .window::after { content: ''; position: absolute; background: #171822; }
    .window::before { top: 0; bottom: 0; width: 6px; left: 50%; transform: translateX(-50%); }
    .window::after { left: 0; right: 0; height: 6px; top: 50%; transform: translateY(-50%); }
    .curtain { position: absolute; top: 4%; height: 58%; width: 15%; background: linear-gradient(90deg, #403454, #171827); filter: drop-shadow(12px 8px 8px #0007); }
    .curtain.left { left: 2%; clip-path: polygon(0 0, 100% 4%, 86% 100%, 0 92%); }
    .curtain.right { left: 37%; clip-path: polygon(0 4%, 100% 0, 100% 92%, 14% 100%); }
    .ceiling-light { position: absolute; left: 50%; top: 3%; width: 28px; height: 98px; transform: translateX(-50%); border-radius: 0 0 25px 25px; background: #0a0c12; }
    .ceiling-light::after { content: ''; position: absolute; left: 50%; bottom: -17px; width: 58px; height: 34px; transform: translateX(-50%); border-radius: 50%; background: #f0c7799c; box-shadow: 0 0 50px 20px #f0c77940; }
    .wall-sign { position: absolute; right: 10%; top: 14%; width: 34%; padding: 16px 14px; border: 1px solid #f0c77955; background: #10131bb8; color: var(--gold); text-align: center; font-family: var(--serif); letter-spacing: .13em; box-shadow: inset 0 0 20px #0008, 0 10px 20px #0005; }
    .wall-sign b { display: block; font-size: clamp(19px, 2.6vw, 29px); }
    .wall-sign span { font-family: 'DM Mono', monospace; font-size: 9px; letter-spacing: .23em; color: var(--muted); }
    .desk { position: absolute; left: 8%; right: -3%; bottom: 14%; height: 19%; background: linear-gradient(180deg, #4d3d36, #1f1717); transform: perspective(420px) rotateX(10deg); border-top: 4px solid #f0c77928; box-shadow: 0 28px 38px #0009; }
    .desk::after { content: ''; position: absolute; left: 8%; right: 0; bottom: -150px; height: 160px; background: repeating-linear-gradient(90deg, #20191b 0 12%, #312224 12% 24%); }
    .key-rack { position: absolute; left: 16%; bottom: 25%; width: 31%; height: 19%; border: 6px solid #8c6940; background: #302a27; box-shadow: 0 10px 18px #0007; transform: perspective(400px) rotateX(16deg); }
    .key-rack::before { content: 'ROOM KEYS'; position: absolute; inset: 9px; border: 1px solid #f0c77944; color: #f0c77988; text-align: center; padding-top: 11px; font: 10px 'DM Mono'; letter-spacing: .18em; }
    .keys { position: absolute; inset: 28px 14px 12px; display: flex; justify-content: space-around; align-items: flex-end; }
    .keys i { width: 5px; height: 58px; background: #f0c779; display: block; border-radius: 4px; position: relative; opacity: .9; }
    .keys i::before { content: ''; position: absolute; width: 18px; height: 18px; border: 3px solid #f0c779; border-radius: 50%; top: -10px; left: 50%; transform: translateX(-50%); }
    .rotary { position: absolute; right: 16%; bottom: 23%; width: 40%; max-width: 245px; filter: drop-shadow(0 20px 18px #0009); animation: phone-float 5s ease-in-out infinite; }
    @keyframes phone-float { 50% { transform: translateY(-8px) rotate(1deg); } }
    .scene-fog { position: absolute; left: -10%; right: -10%; bottom: 5%; height: 20%; background: radial-gradient(ellipse, #bac2d218, transparent 68%); filter: blur(17px); }
    .ghost-shadow { position: absolute; right: 3%; top: 40%; width: 18%; height: 32%; border-radius: 50% 50% 20% 20%; background: #090b1188; filter: blur(4px); opacity: .55; animation: ghost-walk 8s ease-in-out infinite; }
    .ghost-shadow::before, .ghost-shadow::after { content: ''; position: absolute; top: 28%; width: 10px; height: 10px; border-radius: 50%; background: #f0c77988; box-shadow: 0 0 15px #f0c779; }
    .ghost-shadow::before { left: 32%; } .ghost-shadow::after { right: 32%; }
    @keyframes ghost-walk { 50% { transform: translateX(-24px); opacity: .28; } }

    .section-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 26px; }
    .feature { padding: 17px; border: 1px solid var(--line); border-radius: 15px; background: #ffffff06; }
    .feature-num { color: var(--gold); font: 13px 'DM Mono'; }
    .feature b { display: block; margin-top: 10px; font-size: 13px; }
    .feature p { color: var(--muted); font-size: 12px; line-height: 1.55; margin: 7px 0 0; }

    /* Shared game surfaces */
    .page-heading { display: flex; justify-content: space-between; align-items: end; gap: 20px; margin-bottom: 20px; }
    .page-heading h1 { margin: 7px 0 0; font-family: var(--serif); font-size: clamp(32px, 4vw, 57px); line-height: 1; }
    .page-heading p { max-width: 560px; margin: 0; }
    .layout-3 { display: grid; grid-template-columns: 245px minmax(0, 1fr) 290px; gap: 14px; align-items: start; }
    .layout-2 { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 14px; align-items: start; }
    .stack { display: grid; gap: 14px; }
    .panel-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 16px 18px; border-bottom: 1px solid var(--line); }
    .panel-head h3 { margin: 0; font-size: 14px; }
    .panel-body { padding: 17px; }
    .form-row { display: grid; gap: 7px; margin-bottom: 14px; }
    .form-row label { color: var(--muted); font-size: 11px; font-weight: 700; }
    .input, .select { width: 100%; padding: 11px 12px; color: var(--text); background: #0d1119; border: 1px solid var(--line-bright); border-radius: 10px; }
    .input::placeholder { color: var(--dim); }
    .code-box { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px; border-radius: 12px; border: 1px solid #f0c77945; background: var(--gold-soft); }
    .code-box b { color: var(--gold); font: 22px 'DM Mono'; letter-spacing: .13em; }
    .divider { height: 1px; background: var(--line); margin: 15px 0; }
    .control-list { display: grid; gap: 8px; }
    .control-list .btn { width: 100%; justify-content: flex-start; }
    .status-box { border-radius: 12px; padding: 11px 12px; border: 1px solid var(--line); background: #ffffff06; display: flex; align-items: center; gap: 9px; font-size: 11px; }
    .status-box b { display: block; font-size: 12px; }
    .status-box span { color: var(--muted); }

    /* Illustrations */
    .phone-svg { width: 100%; height: auto; display: block; }
    .mini-phone-wrap { display: grid; place-items: center; min-height: 240px; padding: 22px; background: radial-gradient(circle, #f0c77912, transparent 60%); }
    .mini-phone { width: min(100%, 250px); }
    .keys-art { position: relative; height: 160px; border: 1px solid #f0c77933; background: linear-gradient(135deg, #2a2525, #14151b); border-radius: 12px; overflow: hidden; }
    .keys-art::before { content: '404'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #f0c77944; font: 70px var(--serif); }
    .key-line { position: absolute; top: 22px; bottom: 28px; width: 4px; border-radius: 5px; background: var(--gold); box-shadow: 0 0 9px #f0c77955; }
    .key-line::before { content: ''; position: absolute; top: -9px; left: 50%; width: 18px; height: 18px; transform: translateX(-50%); border: 3px solid var(--gold); border-radius: 50%; }
    .key-line:nth-child(1) { left: 16%; height: 90px; } .key-line:nth-child(2) { left: 31%; height: 116px; } .key-line:nth-child(3) { left: 50%; height: 76px; } .key-line:nth-child(4) { left: 68%; height: 130px; } .key-line:nth-child(5) { left: 84%; height: 100px; }

    /* Lobby */
    .lobby-grid { display: grid; grid-template-columns: 330px minmax(0, 1fr); gap: 14px; }
    .qr-card { display: grid; gap: 15px; align-content: start; }
    .qr { width: 190px; aspect-ratio: 1; margin: 0 auto; padding: 12px; background: #f5f1e8; display: grid; grid-template-columns: repeat(13, 1fr); gap: 2px; border-radius: 6px; }
    .qr i { background: #10131b; border-radius: 1px; }
    .qr i:nth-child(3n+2) { background: #403454; }
    .qr i:nth-child(5n+1) { background: #10131b; }
    .lobby-tools { display: grid; gap: 8px; }
    .team-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 9px; }
    .team-card { min-width: 0; padding: 12px; border-radius: 13px; border: 1px solid var(--line); background: #ffffff06; position: relative; }
    .team-card.approved { border-color: #72e0c344; }
    .team-card.offline { opacity: .68; }
    .team-avatar { width: 38px; height: 38px; display: grid; place-items: center; border: 1px solid #f0c77955; border-radius: 10px; color: var(--gold); background: #f0c7790e; font-weight: 900; font-family: var(--serif); }
    .team-card b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 9px; font-size: 12px; }
    .team-card small { display: flex; align-items: center; gap: 5px; color: var(--muted); font-size: 10px; margin-top: 5px; }
    .tiny-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--dim); }
    .approved .tiny-dot { background: var(--mint); }
    .team-card .team-edit { position: absolute; top: 8px; right: 8px; color: var(--dim); border: 0; background: transparent; font-size: 12px; }

    /* Stage */
    .stage-screen { position: relative; min-height: 650px; border: 1px solid #f0c77933; border-radius: 20px; overflow: hidden; background: linear-gradient(160deg, #2c2a40, #151925 60%, #0c1016); box-shadow: 0 30px 80px #0008; }
    .stage-screen.chapter-1 { background: linear-gradient(160deg, #342d3d, #151a27 58%, #0d1118); }
    .stage-screen.chapter-2 { background: linear-gradient(160deg, #26384a, #151b2a 58%, #0c1118); }
    .stage-screen.chapter-3 { background: linear-gradient(160deg, #403448, #161825 58%, #0c1118); }
    .stage-screen::before { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at 74% 23%, #f0c7791c, transparent 28%), linear-gradient(100deg, #0000 40%, #0007); pointer-events: none; }
    .stage-top { position: relative; z-index: 1; display: flex; justify-content: space-between; gap: 12px; padding: 18px 20px; }
    .stage-top h2 { margin: 5px 0 0; font-size: clamp(18px, 2.4vw, 30px); }
    .stage-top .round-no { font: 12px 'DM Mono'; color: var(--muted); }
    .stage-scene-art { position: absolute; inset: 0; opacity: .55; pointer-events: none; }
    .stage-scene-art::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 35%; background: linear-gradient(0deg, #090b11, transparent); }
    .scene-door { position: absolute; right: 8%; top: 22%; width: 27%; height: 54%; border: 8px solid #16131c; border-radius: 8px 8px 0 0; background: linear-gradient(90deg, #493850, #151822); box-shadow: -28px 20px 34px #0008; }
    .scene-door::before { content: '404'; position: absolute; inset: 22% 14%; border: 2px solid #f0c77977; display: grid; place-items: center; color: #f0c779; font: clamp(35px, 6vw, 76px) var(--serif); background: #090b1145; }
    .scene-door::after { content: ''; position: absolute; right: 12%; top: 52%; width: 10px; height: 10px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 14px var(--gold); }
    .scene-file { position: absolute; left: 11%; bottom: 20%; width: 42%; height: 28%; background: #362e2d; border: 5px solid #9a744b; transform: perspective(500px) rotateX(16deg) rotateZ(-4deg); box-shadow: 0 18px 23px #0009; }
    .scene-file::before { content: 'NIGHT LOG / ARCHIVE'; position: absolute; inset: 17%; border: 1px solid #f0c77955; color: #f0c77988; padding: 12px; font: 10px 'DM Mono'; letter-spacing: .12em; }
    .stage-ambient { position: absolute; left: 0; right: 0; bottom: 0; height: 20%; background: radial-gradient(ellipse at 34% 40%, #bac2d20e, transparent 58%); filter: blur(15px); }
    .stage-content { position: relative; z-index: 2; display: grid; place-items: center; min-height: 515px; padding: 34px 8%; text-align: center; }
    .stage-center { width: min(950px, 100%); }
    .signal-copy { font-family: var(--serif); font-size: clamp(27px, 5vw, 65px); line-height: 1.02; letter-spacing: -.03em; margin: 12px auto; }
    .signal-copy.mint { text-shadow: 0 0 30px #72e0c366; }
    .signal-copy.red { text-shadow: 0 0 30px #ed6a7355; }
    .signal-copy.gold { text-shadow: 0 0 30px #f0c77955; }
    .stage-kicker { color: var(--muted); font-size: 12px; letter-spacing: .06em; }
    .stage-phone { width: min(260px, 55vw); margin: 20px auto; animation: stage-phone 4s ease-in-out infinite; }
    @keyframes stage-phone { 50% { transform: rotate(-2deg) translateY(-8px); } }
    .winner-card { padding: 20px 27px; border: 1px solid #72e0c366; background: #72e0c312; border-radius: 16px; margin: 18px auto; width: fit-content; max-width: 100%; }
    .winner-card b { display: block; color: var(--mint); font: clamp(29px, 5vw, 70px) var(--serif); overflow-wrap: anywhere; }
    .question-panel { text-align: left; width: min(930px, 100%); margin: auto; padding: clamp(18px, 3vw, 32px); background: #10131beF; border: 1px solid #ffffff22; border-radius: 18px; box-shadow: 0 20px 55px #0007; }
    .question-panel .question-top { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; align-items: center; }
    .question-type { padding: 7px 10px; color: var(--gold); background: var(--gold-soft); border: 1px solid #f0c77945; border-radius: 99px; font: 10px 'DM Mono'; text-transform: uppercase; }
    .question-panel h2 { margin: 18px 0; font-size: clamp(22px, 3.3vw, 43px); line-height: 1.22; }
    .public-options { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .public-option { min-height: 58px; display: flex; align-items: center; gap: 10px; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: #ffffff07; font-size: clamp(13px, 1.3vw, 19px); }
    .option-key { width: 28px; height: 28px; flex: 0 0 28px; display: grid; place-items: center; color: var(--gold); border: 1px solid #f0c77966; border-radius: 8px; font-weight: 900; }
    .evidence-box { padding: 15px; border-left: 3px solid var(--gold); background: #f0c7790d; color: var(--muted); line-height: 1.6; font-size: 14px; }
    .stage-bottom { position: relative; z-index: 4; padding: 13px; border-top: 1px solid var(--line); background: #090b11aa; }
    .score-strip { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 7px; }
    .score-strip .score-chip:nth-child(n+9) { grid-row: 2; }
    .score-chip { min-width: 0; padding: 8px 9px; border: 1px solid var(--line); border-radius: 10px; background: #ffffff06; }
    .score-chip.active { border-color: var(--mint); background: #72e0c31c; box-shadow: 0 0 18px #72e0c31a; }
    .score-chip .chip-line { display: flex; justify-content: space-between; gap: 5px; align-items: center; }
    .score-chip b { font: 10px 'DM Mono'; color: var(--gold); }
    .score-chip strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 4px; font-size: 10px; }
    .score-chip small { color: var(--muted); font-size: 10px; }

    .stage-controls { display: grid; gap: 9px; }
    .action-main { padding: 15px; border-radius: 13px; background: var(--mint-soft); border: 1px solid #72e0c344; }
    .action-main b { display: block; margin-bottom: 3px; }
    .action-main p { color: var(--muted); font-size: 11px; line-height: 1.5; margin: 0 0 11px; }
    .phase-progress { height: 7px; border-radius: 99px; background: #ffffff0d; overflow: hidden; margin-top: 8px; }
    .phase-progress i { display: block; height: 100%; background: var(--mint); width: 0; transition: width .25s linear; }
    .countdown { font: 44px 'DM Mono'; color: var(--gold); text-align: center; margin: 12px 0; }
    .log-list { max-height: 240px; overflow: auto; display: grid; gap: 7px; }
    .log-item { padding: 8px 9px; border: 1px solid var(--line); border-radius: 9px; color: var(--muted); font-size: 10px; line-height: 1.4; }
    .log-item time { color: var(--dim); font-family: 'DM Mono'; display: block; margin-bottom: 3px; }

    /* Host */
    .host-preview { min-height: 420px; background: #090b11; border-radius: 14px; overflow: hidden; }
    .host-preview .stage-screen { min-height: 420px; border: 0; border-radius: 0; box-shadow: none; }
    .host-preview .stage-content { min-height: 325px; padding: 22px 5%; }
    .host-preview .stage-phone { width: min(160px, 34vw); margin: 8px auto; }
    .host-preview .signal-copy { font-size: clamp(23px, 3.5vw, 42px); }
    .host-preview .question-panel { padding: 17px; }
    .host-preview .question-panel h2 { font-size: clamp(16px, 2.2vw, 26px); margin: 11px 0; }
    .host-preview .public-option { min-height: 38px; font-size: 12px; padding: 8px; }
    .host-preview .score-strip { display: none; }
    .host-control-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
    .host-control-grid .btn { width: 100%; }
    .team-status-list { display: grid; gap: 6px; max-height: 480px; overflow: auto; }
    .team-row { display: grid; grid-template-columns: 30px minmax(0,1fr) auto; align-items: center; gap: 8px; padding: 8px; border-radius: 10px; background: #ffffff06; border: 1px solid var(--line); }
    .team-row.active { border-color: var(--mint); background: var(--mint-soft); }
    .team-row .num { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 8px; background: var(--gold-soft); color: var(--gold); font: 11px 'DM Mono'; }
    .team-row b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; }
    .team-row small { color: var(--muted); font-size: 9px; }
    .team-row .row-points { color: var(--gold); font: 11px 'DM Mono'; }

    /* Answer controls */
    .answer-controls { display: grid; gap: 12px; }
    .answer-help { padding: 10px 12px; border-radius: 10px; background: #f0c7790d; border: 1px solid #f0c7792e; color: var(--muted); font-size: 11px; line-height: 1.5; }
    .choice-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .choice-btn { text-align: left; color: var(--text); background: #ffffff07; border: 1px solid var(--line); border-radius: 10px; padding: 10px; font-size: 11px; }
    .choice-btn:hover { border-color: #ffffff55; }
    .choice-btn.selected { border-color: var(--mint); background: var(--mint-soft); }
    .toggle-line, .criterion-line { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px; border-radius: 10px; background: #ffffff06; border: 1px solid var(--line); font-size: 11px; }
    .toggle-buttons { display: flex; gap: 5px; flex: 0 0 auto; }
    .mini-toggle { min-width: 42px; border: 1px solid var(--line-bright); border-radius: 8px; padding: 7px; color: var(--muted); background: #ffffff08; font: 11px 'DM Mono'; }
    .mini-toggle.selected { background: var(--gold); color: #251b08; border-color: var(--gold); }
    .order-list, .pair-list { display: grid; gap: 7px; }
    .order-btn { display: grid; grid-template-columns: 30px 1fr auto; gap: 8px; align-items: center; text-align: left; color: var(--text); background: #ffffff07; border: 1px solid var(--line); border-radius: 9px; padding: 9px; font-size: 11px; }
    .order-btn.selected { border-color: var(--mint); background: var(--mint-soft); }
    .order-pos { width: 24px; height: 24px; display: grid; place-items: center; color: var(--gold); border: 1px solid #f0c77955; border-radius: 7px; font: 10px 'DM Mono'; }
    .pair-row { display: grid; grid-template-columns: 1fr 90px; gap: 7px; align-items: center; font-size: 11px; }
    .pair-row select { padding: 8px; color: var(--text); border-radius: 8px; border: 1px solid var(--line-bright); background: #0d1119; font-size: 11px; }
    .criteria { display: grid; gap: 7px; }
    .criterion-line input { accent-color: var(--mint); width: 16px; height: 16px; }
    .draft-response { padding: 12px; border-radius: 10px; background: #00000020; border: 1px dashed #ffffff2b; color: var(--muted); font-size: 11px; line-height: 1.5; }
    .draft-response b { color: var(--text); }

    /* Team phone */
    .team-view { max-width: 740px; margin: 0 auto; }
    .team-selector { display: flex; gap: 7px; flex-wrap: wrap; margin: 13px 0; }
    .team-select-chip { color: var(--muted); border: 1px solid var(--line); border-radius: 999px; background: #ffffff06; padding: 7px 10px; font-size: 10px; }
    .team-select-chip.active { color: var(--mint); border-color: var(--mint); background: var(--mint-soft); }
    .phone-shell { width: min(100%, 430px); margin: 25px auto; padding: 11px; border: 1px solid #ffffff25; border-radius: 37px; background: #080b11; box-shadow: 0 24px 80px #0008; }
    .phone-screen { min-height: 690px; display: flex; flex-direction: column; border-radius: 29px; overflow: hidden; border: 1px solid #ffffff1c; background: linear-gradient(170deg, #202b37, #10151d 60%, #171826); }
    .phone-notch { width: 130px; height: 22px; margin: 0 auto; background: #080b11; border-radius: 0 0 16px 16px; }
    .phone-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 20px 23px 12px; }
    .phone-head h2 { margin: 3px 0 0; font-size: 22px; }
    .phone-status { margin: 0 23px; padding: 10px 12px; border-radius: 12px; background: #ffffff08; border: 1px solid var(--line); font-size: 11px; color: var(--muted); }
    .phone-status b { color: var(--text); display: block; margin-bottom: 3px; }
    .phone-stage { flex: 1; display: grid; align-content: center; gap: 22px; padding: 30px 23px; text-align: center; }
    .phone-signal { font: 29px var(--serif); line-height: 1.1; }
    .buzz-button { width: min(74vw, 270px); aspect-ratio: 1; margin: 0 auto; border-radius: 50%; border: 13px solid #d65d67; background: radial-gradient(circle at 34% 24%, #ffabb0, #ed6a73 42%, #a63d52); color: white; box-shadow: inset 0 -11px 0 #8c2f44, 0 0 0 10px #ed6a7314, 0 18px 40px #0009; font: 900 23px var(--serif); transition: transform .12s ease, filter .12s ease; }
    .buzz-button:not(:disabled):hover { transform: scale(1.03); filter: brightness(1.08); }
    .buzz-button:active { transform: scale(.97); }
    .buzz-button.ready { background: radial-gradient(circle at 34% 24%, #b1ffe7, #72e0c3 42%, #258d7a); border-color: #5bc9ae; box-shadow: inset 0 -11px 0 #227362, 0 0 0 10px #72e0c314, 0 18px 40px #0009; color: #09231e; }
    .buzz-button.wait { background: radial-gradient(circle at 34% 24%, #ff9da3, #ed6a73 42%, #a63d52); }
    .buzz-button:disabled { cursor: not-allowed; opacity: .52; }
    .phone-score { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 23px 23px; }
    .phone-stat { padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: #ffffff07; }
    .phone-stat small { color: var(--muted); display: block; font-size: 10px; }
    .phone-stat b { display: block; margin-top: 4px; color: var(--gold); font: 22px 'DM Mono'; }
    .connection { display: flex; align-items: center; justify-content: center; gap: 7px; padding: 10px; color: var(--muted); font-size: 10px; }

    /* Scoreboard */
    .scoreboard { position: fixed; inset: 0; z-index: 40; padding: 30px; display: grid; place-items: center; background: #090b11ed; backdrop-filter: blur(18px); }
    .scoreboard-inner { width: min(1180px, 100%); max-height: calc(100vh - 60px); overflow: auto; padding: 28px; border-radius: 23px; border: 1px solid #f0c7794d; background: linear-gradient(145deg, #292c3d, #141821); box-shadow: 0 35px 110px #000b; }
    .scoreboard-title { display: flex; justify-content: space-between; gap: 15px; align-items: end; margin-bottom: 20px; }
    .scoreboard-title h2 { margin: 6px 0 0; font: clamp(35px, 5vw, 72px) var(--serif); line-height: .9; }
    .rank-table { display: grid; gap: 7px; }
    .rank-row { display: grid; grid-template-columns: 55px minmax(0, 1fr) 100px 85px 130px; gap: 10px; align-items: center; padding: 13px 15px; border-radius: 12px; border: 1px solid var(--line); background: #ffffff06; }
    .rank-row.top { border-color: #f0c77966; background: var(--gold-soft); }
    .rank-no { color: var(--gold); font: 24px var(--serif); }
    .rank-row strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rank-row small { color: var(--muted); font-size: 10px; }
    .rank-points { color: var(--gold); font: 19px 'DM Mono'; }
    .rank-cells { color: var(--muted); font-size: 11px; }
    .podium-note { padding: 12px; border-radius: 10px; margin-top: 14px; color: var(--muted); background: #72e0c30d; border: 1px solid #72e0c32b; font-size: 11px; }

    /* Empty / finish */
    .empty-state { min-height: 350px; display: grid; place-items: center; text-align: center; padding: 30px; }
    .empty-state h2 { font: 42px var(--serif); margin: 15px 0 8px; }
    .finish-art { height: 190px; position: relative; border-radius: 16px; background: radial-gradient(circle at 50% 60%, #f0c77955, transparent 35%), linear-gradient(160deg, #473e58, #15212b); overflow: hidden; }
    .finish-door { position: absolute; left: 50%; bottom: 0; width: 160px; height: 155px; transform: translateX(-50%); border: 7px solid #17151e; background: linear-gradient(90deg, #3d3347, #c4a87555); box-shadow: 0 0 42px #f0c77988; }
    .finish-door::before { content: '404'; position: absolute; inset: 22%; display: grid; place-items: center; color: #f0c779; font: 44px var(--serif); border: 1px solid #f0c77977; }
    .finish-door::after { content: ''; position: absolute; top: 53%; right: 15px; width: 9px; height: 9px; background: var(--gold); border-radius: 50%; box-shadow: 0 0 16px var(--gold); }
    .finish-actions { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin-top: 17px; }

    /* Toast */
    .toast-region { position: fixed; right: 18px; bottom: 18px; z-index: 60; display: grid; gap: 8px; width: min(360px, calc(100% - 36px)); }
    .toast { padding: 13px 14px; border-radius: 12px; border: 1px solid var(--line-bright); background: #202634f5; box-shadow: 0 15px 35px #0008; font-size: 12px; animation: toast-in .25s ease; }
    .toast b { display: block; color: var(--gold); margin-bottom: 3px; }
    @keyframes toast-in { from { opacity: 0; transform: translateY(8px); } }

    @media (max-width: 1180px) {
      .layout-3 { grid-template-columns: 220px minmax(0, 1fr); }
      .layout-3 > aside:last-child { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; align-items: start; }
      .layout-3 > aside:last-child .card:last-child { grid-column: 1 / -1; }
    }
    @media (max-width: 900px) {
      .topbar { padding: 13px 18px; }
      .hero-title { font-size: clamp(52px, 12vw, 80px); }
      .landing-grid, .lobby-grid, .layout-2 { grid-template-columns: 1fr; }
      .hotel-scene { min-height: 490px; }
      .lobby-grid .qr-card { grid-row: 2; }
      .layout-3 { grid-template-columns: 1fr; }
      .layout-3 > aside:last-child { grid-column: auto; grid-template-columns: 1fr; }
      .stage-screen { min-height: 600px; }
    }
    @media (max-width: 620px) {
      .wrap { width: min(100% - 24px, 1500px); }
      .brand-copy span { display: none; }
      .top-actions .pill { display: none; }
      .page { padding-top: 22px; }
      .section-grid { grid-template-columns: 1fr; }
      .team-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .score-strip { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .score-strip .score-chip:nth-child(n+9) { grid-row: auto; }
      .public-options, .choice-grid { grid-template-columns: 1fr; }
      .rank-row { grid-template-columns: 42px minmax(0, 1fr) 75px; }
      .rank-row > :nth-child(4), .rank-row > :nth-child(5) { display: none; }
      .scoreboard { padding: 12px; }
      .scoreboard-inner { max-height: calc(100vh - 24px); padding: 18px; }
      .scoreboard-title { align-items: start; }
      .hotel-scene { min-height: 390px; }
      .window { top: 11%; height: 37%; }
      .desk { bottom: 12%; }
      .rotary { bottom: 19%; right: 8%; }
      .key-rack { bottom: 22%; left: 8%; }
      .wall-sign { top: 11%; right: 8%; }
    }

    /* Inline decorative phone */
    .phone-illustration { width: 100%; height: auto; }
  </style>
</head>

    const questions = [
      { id:'D01', type:'A', typeName:'Chìa khóa đúng', duration:20, prompt:'Sau bước Ghi nhận, nhóm điều tra phải làm gì?', options:['Kết luận ngay.','Đối chiếu một nguồn độc lập.','Xóa hồ sơ gốc.','Chọn lời kể gây chú ý nhất.'], correct:'B', explanation:'Quy trình yêu cầu đối chiếu với một nguồn độc lập trước khi kết luận.', cue:'Tờ giấy đầu tiên trong hồ sơ đang tự lật.' },

    function makeTeams() {
      return teamNames.map((name, i) => ({ id: i + 1, number: i + 1, name, avatar: ['M','B','M','K','G','Đ','K','H','R','Đ','B','B','N','G','C'][i], online: i < 9, approved: i < 9, early: false, holds: 0, answered: 0, full: 0 }));
    }
    function initialState() {
      return { version: 1, sessionId: 'session-404-demo', title: 'Cuộc gọi từ phòng 404', joinCode: '404404', phase: 'lobby', currentIndex: 0, winnerTeamId: null, earlyTeams: [], deadline: null, signalName: 'ĐƯỜNG DÂY ĐANG IM LẶNG', soundEnabled: false, reducedMotion: false, teams: makeTeams(), results: [], adjustments: [], audit: [{ type:'session', text:'Tạo phiên demo 15 đội', at: Date.now() }], draft: emptyDraft(), noWinner: false, introPlayed: false };
    }
    function emptyDraft() { return { selected: null, statements: [null, null], order: [], pairs: {}, criteria: [], text: '' }; }
    let state = loadState();
    let currentRole = getRole();
    let selectedTeamId = Number(new URLSearchParams(location.hash.split('?')[1] || '').get('team')) || 1;
    let tickTimer = null;
    let channel = null;
    let activeAudio = [];

    try { channel = new BroadcastChannel(CHANNEL_NAME); channel.onmessage = e => receiveState(e.data); } catch (_) { channel = null; }
    window.addEventListener('storage', e => { if (e.key === STORE_KEY && e.newValue) receiveState(JSON.parse(e.newValue)); });
    window.addEventListener('hashchange', () => { currentRole = getRole(); selectedTeamId = getSelectedTeam(); render(); });
    window.addEventListener('keydown', e => {
      if (e.key === 'Escape' && state.phase === 'scoreboard') { mutate(s => { s.phase = s.previousPhase || 'resolved'; s.previousPhase = null; }); }
      if (e.key === 'Enter' && currentRole === 'host' && !['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)) {
        const primary = document.querySelector('[data-primary="true"]'); if (primary && !primary.disabled) primary.click();
      }
    });

    function loadState() {
      try { const saved = JSON.parse(localStorage.getItem(STORE_KEY)); return saved && saved.teams && saved.teams.length === 15 ? saved : initialState(); } catch (_) { return initialState(); }
    }
    function saveState() { localStorage.setItem(STORE_KEY, JSON.stringify(state)); if (channel) channel.postMessage(state); }
    function receiveState(next) {
      if (!next || next.version < state.version) return;
      const previous = state;
      state = next; saveLocalOnly(); render(); updateLiveBits();
      playTransitionCue(previous, next);
    }
    function saveLocalOnly() { localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
    function mutate(fn, message = '') {
      const next = structuredClone(state); fn(next); next.version = (state.version || 0) + 1; if (message) next.audit = [{ type:'action', text: message, at: Date.now() }, ...(next.audit || [])].slice(0, 80); state = next; saveState(); render(); toast(message || 'Đã cập nhật trạng thái.');
    }
    function mutateSilent(fn) { const next = structuredClone(state); fn(next); next.version = (state.version || 0) + 1; state = next; saveState(); render(); }
    function getRole() { const route = (location.hash.split('?')[0] || '#/').replace('#/',''); return ['host','stage','team'].includes(route) ? route : 'home'; }
    function getSelectedTeam() { return Number(new URLSearchParams(location.hash.split('?')[1] || '').get('team')) || selectedTeamId || 1; }
    function navigate(route) { location.hash = route; }
    function team(id) { return state.teams.find(t => t.id === Number(id)); }
    function currentQuestion() { return questions[state.currentIndex] || questions[0]; }
    function chapterIndex() { return Math.min(2, Math.floor(state.currentIndex / 5)); }
    function scoreFor(id) { const resultPoints = state.results.filter(r => r.teamId === id).reduce((sum, r) => sum + r.points, 0); const adjustment = state.adjustments.filter(a => a.teamId === id).reduce((sum, a) => sum + a.amount, 0); return resultPoints + adjustment; }
    function rankings() {
      const sorted = state.teams.map(t => ({ ...t, score: scoreFor(t.id) })).sort((a,b) => b.score - a.score || a.number - b.number);
      let previous = null; let rank = 0;
      return sorted.map((t, i) => { if (previous === null || t.score < previous) rank = i + 1; previous = t.score; return { ...t, rank }; });
    }
    function resultForRound() { return state.results.find(r => r.questionId === currentQuestion().id && r.teamId === state.winnerTeamId); }
    function fmtTime(ms) { return `${Math.max(0, Math.ceil(ms / 1000))}s`; }
    function esc(value) { return String(value ?? '').replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch])); }
    function phaseText() { return phaseLabels[state.phase] || state.phase; }
    function scoreRank(id) { return rankings().find(r => r.id === Number(id))?.rank || 1; }
    function showTime() { return state.deadline ? fmtTime(state.deadline - Date.now()) : ''; }

    function render() {
      document.body.classList.toggle('reduced-motion', !!state.reducedMotion);

      updateLiveBits();
      if (!tickTimer) tickTimer = setInterval(tick, 250);
    }

      let action = { title:'Đang ở sảnh chờ', desc:'Duyệt đội và bắt đầu phần luật trước khi vào câu 01.', label:'Bắt đầu phần luật', action:'go-rules', style:'gold' };
      if (state.phase === 'rules') action = { title:'Kiểm tra luật', desc:'Cho các đội xem ba bước: chờ 404 → bắt máy → trả lời trực tiếp.', label:'Chạy lượt thử', action:'go-practice', style:'primary' };

      else if (state.phase === 'ready') action = { title:`Câu ${String(state.currentIndex+1).padStart(2,'0')} sẵn sàng`, desc:'Kiểm tra bộ câu, sau đó phát đếm ngược 3–2–1.', label:'Phát tín hiệu', action:'arm-round', style:'gold' };
      else if (state.phase === 'armed') action = { title:'Đang đếm ngược', desc:'Hệ thống tự mở giai đoạn chờ tín hiệu khi đếm xong.', label:'Bỏ qua đếm ngược', action:'skip-armed', style:'gold' };
      else if (state.phase === 'waiting') action = { title:'Có thể có tín hiệu giả', desc:'Các đội chưa được bấm. Tín hiệu thật sẽ mở sau khoảng chờ.', label:'Mở tín hiệu thật ngay', action:'open-buzz', style:'primary' };
      else if (state.phase === 'buzz-open') action = { title:'Cửa nhận quyền đang mở', desc:`Còn <strong data-live="deadline">${showTime()}</strong>. Hệ thống sẽ tự đóng nếu không có đội bắt máy.`, label:'Đóng quyền / không có winner', action:'close-buzz', style:'danger' };
      else if (state.phase === 'winner-locked') action = { title:`Đội ${String(state.winnerTeamId).padStart(2,'0')} đã kết nối`, desc:'Khóa quyền đã ghi nhận. Mở đề sau animation ống nghe.', label:'Hiện câu hỏi', action:'show-question', style:'primary' };
      else if (state.phase === 'preview') action = { title:state.noWinner ? 'Câu không có winner' : `Đội ${String(state.winnerTeamId).padStart(2,'0')} đang chuẩn bị`, desc:state.noWinner ? 'Không có điểm. Mở lời giải mẫu để cùng ôn tập.' : `Thời gian trả lời: ${q.duration} giây · tối đa 10 điểm.`, label:state.noWinner ? 'Mở lời giải / kết thúc câu' : 'Bắt đầu đồng hồ trả lời', action:state.noWinner ? 'resolve-no-winner' : 'start-answering', style:state.noWinner ? 'gold':'primary' };
      else if (state.phase === 'answering') action = { title:'Đội đang trả lời', desc:`Đồng hồ còn <strong data-live="deadline">${showTime()}</strong>. Nhấn ghi nhận ngay khi đội chốt bằng lời.`, label:'Ghi nhận câu trả lời', action:'record-answer', style:'primary' };
      else if (state.phase === 'recorded') action = { title:'Câu trả lời đã khóa', desc:'Kiểm tra bản nhập/rubric. Điểm chưa cộng cho tới khi xác nhận chấm.', label:'Chấm và công bố', action:'grade-answer', style:'gold' };
      else if (state.phase === 'resolved') action = { title:'Kết quả đã chốt', desc:'Giải thích đáp án, sau đó chuyển sang câu tiếp theo hoặc mở BXH.', label:state.currentIndex >= 14 ? 'Kết thúc phiên' : 'Sang câu tiếp theo', action:state.currentIndex >= 14 ? 'finish-game':'next-question', style:'primary' };
      else if (state.phase === 'no-winner') action = { title:'Không có kết nối hợp lệ', desc:'Mở đề và lời giải ngắn để ôn tập, không cộng điểm.', label:'Mở câu hỏi', action:'show-question', style:'gold' };
      return `<section class="card"><div class="panel-head"><h3>Hành động chính</h3><span class="eyebrow">Enter</span></div><div class="panel-body"><div class="action-main"><b>${action.title}</b><p>${action.desc}</p><button class="btn ${action.style}" data-action="${action.action}" data-primary="true">${action.label}</button></div>${['armed','waiting','buzz-open','answering'].includes(state.phase) ? `<div class="phase-progress"><i data-progress></i></div><div class="countdown" data-live="deadline">${showTime()}</div>` : ''}</div></section>${state.phase === 'resolved' ? `<section class="card"><div class="panel-head"><h3>Điều khiển nhanh</h3></div><div class="panel-body"><div class="host-control-grid"><button class="btn sm" data-action="show-scoreboard">BXH</button><button class="btn sm" data-action="void-round">Hủy câu</button></div></div></section>` : ''}`;
    }

    function hostHistoryCard() {
      const recent = state.audit.slice(0, 6);
      return `<section class="card"><div class="panel-head"><h3>Lịch sử thao tác</h3><span class="eyebrow">audit</span></div><div class="panel-body"><div class="log-list">${recent.length ? recent.map(log => `<div class="log-item"><time>${new Date(log.at).toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}</time>${esc(log.text)}</div>`).join('') : '<div class="subtle">Chưa có thao tác.</div>'}</div>${state.phase === 'resolved' && state.winnerTeamId ? `<div class="divider"></div><div class="form-row"><label>Sửa điểm chênh lệch</label><input class="input" type="number" data-adjustment placeholder="Ví dụ: 2 hoặc -2"></div><div class="form-row"><label>Lý do bắt buộc</label><input class="input" data-adjustment-reason placeholder="Nhập lý do điều chỉnh"></div><button class="btn sm ghost" data-action="adjust-score">Lưu bản điều chỉnh</button>` : ''}</div></section>`;
    }

    function hostAnswerPanel(q) {
      const canAnswer = ['preview','answering','recorded','resolved'].includes(state.phase) && !state.noWinner;
      return `<section class="card"><div class="panel-head"><h3>Nhập & chấm câu trả lời</h3><span class="pill">${esc(q.type)} · ${q.duration}s · 10đ</span></div><div class="panel-body">${canAnswer ? answerControls(q) : `<div class="empty-state" style="min-height:170px;padding:14px"><div><div class="eyebrow">Chưa mở vùng chấm</div><p class="subtle">Khi một đội bắt máy thành công, câu hỏi và vùng chấm sẽ xuất hiện ở đây.</p></div></div>`}</div></section>`;
    }

    function stagePage() {
      if (state.phase === 'finished') return finishedPage(false);
      return `${pageHeading('Màn hình sân khấu', 'Cửa sổ này dành cho máy chiếu. Không hiển thị đáp án/rubric MC.', 'SÂN KHẤU / STAGE')}<div class="layout-2"><section class="stack"><div class="card" style="padding:10px">${stageMarkup(false)}</div></section><aside class="stack">${stageControlCard()}${stageRulesCard()}</aside></div>`;
    }
    function stageControlCard() {
      const sound = state.soundEnabled;
      return `<section class="card"><div class="panel-head"><h3>Trạng thái sân khấu</h3><span class="pill"><i class="dot ${sound ? 'mint':'red'}"></i>${sound ? 'âm thanh bật':'âm thanh tắt'}</span></div><div class="panel-body"><div class="status-box"><i class="dot mint"></i><div><b>Đồng bộ phiên</b><span>Live snapshot · v${state.version}</span></div></div><div class="divider"></div><button class="btn ${sound ? 'ghost':'primary'}" data-action="stage-sound" style="width:100%">${sound ? 'Tắt âm thanh sân khấu' : 'Bật âm thanh sân khấu'}</button><button class="btn ghost" data-action="show-scoreboard" style="width:100%;margin-top:8px">Mở bảng xếp hạng</button><div class="subtle" style="margin-top:12px">Âm thanh chỉ phát tại cửa sổ sân khấu. Tín hiệu quan trọng luôn có chữ tương đương.</div></div></section>`;
    }
    function stageRulesCard() {
      return `<section class="card"><div class="panel-head"><h3>Ba hồi câu chuyện</h3></div><div class="panel-body"><div class="control-list"><div class="status-box"><span class="gold mono">I</span><div><b>Nhận tín hiệu</b><span>Câu 01–05 · quầy lễ tân</span></div></div><div class="status-box"><span class="mint mono">II</span><div><b>Lần theo dấu vết</b><span>Câu 06–10 · hành lang</span></div></div><div class="status-box"><span class="red mono">III</span><div><b>Mở hồ sơ 404</b><span>Câu 11–15 · cửa phòng</span></div></div></div></div></section>`;
    }

    function stageMarkup(compact=false) {
      const q = currentQuestion(); const winner = team(state.winnerTeamId); const chapter = chapterIndex();
      let content = '';
      if (state.phase === 'lobby') content = `<div class="stage-center"><div class="stage-kicker">TẤT CẢ ĐƯỜNG DÂY ĐANG CHỜ</div><div class="signal-copy gold">Mời 15 đội<br>vào sảnh</div><div class="subtle">Mã phiên <b class="gold mono">${state.joinCode}</b> · Mở QR tại bảng điều khiển MC</div>${SVG.key}</div>`;
      else if (state.phase === 'rules') content = `<div class="stage-center"><div class="stage-kicker">LUẬT CỦA KHÁCH SẠN</div><div class="signal-copy gold">Chờ 404 →<br>Bắt máy → Trả lời</div><div class="subtle">Một đợt giành quyền mỗi câu · không đấu phụ · không thưởng tốc độ trả lời</div></div>`;
      else if (state.phase === 'practice') content = `<div class="stage-center"><div class="stage-kicker">LƯỢT THỬ · KHÔNG TÍNH ĐIỂM</div><div class="signal-copy">Hãy thử bắt<br>một cuộc gọi</div><div class="stage-phone">${SVG.phone()}</div><div class="subtle">Điện thoại chỉ dùng để giành quyền. Câu trả lời luôn nói trực tiếp với MC.</div></div>`;
      else if (state.phase === 'ready') content = `<div class="stage-center"><div class="stage-kicker">${esc(q.cue)}</div><div class="signal-copy gold">Câu ${String(state.currentIndex+1).padStart(2,'0')}<br>đang được nạp</div><div class="stage-phone">${SVG.phone()}</div><div class="subtle">Các đội chuẩn bị · tín hiệu thật chưa mở</div></div>`;
      else if (state.phase === 'armed' || state.phase === 'waiting') content = `<div class="stage-center"><div class="stage-kicker">${state.phase === 'armed' ? 'ĐẾM NGƯỢC TÍN HIỆU' : 'TÍN HIỆU CÓ THỂ LÀ GIẢ'}</div><div class="signal-copy ${state.phase === 'waiting' ? 'red':''}">${state.phase === 'armed' ? '3 · 2 · 1' : esc(state.signalName)}</div><div class="stage-phone">${SVG.phone()}</div><div class="subtle">${state.phase === 'waiting' ? 'Chưa được bắt máy — chỉ nghe cuộc gọi từ phòng 404.' : 'Điện thoại ở các đội vẫn đang khóa.'}</div></div>`;
      else if (state.phase === 'buzz-open') content = `<div class="stage-center"><div class="stage-kicker">TÍN HIỆU THẬT ĐÃ ĐƯỢC XÁC NHẬN</div><div class="signal-copy mint">PHÒNG 404<br>— BẮT MÁY —</div><div class="stage-phone">${SVG.phone()}</div><div class="subtle">Một lần chạm hợp lệ · không đo tốc độ tuyệt đối · server nhận trước sẽ thắng</div></div>`;
      else if (state.phase === 'winner-locked') content = `<div class="stage-center"><div class="stage-kicker">ĐƯỜNG DÂY ĐÃ KHÓA</div><div class="winner-card"><div class="eyebrow">ĐỘI ĐÃ KẾT NỐI</div><b>Đội ${String(winner?.number || 0).padStart(2,'0')} · ${esc(winner?.name || '—')}</b><div class="subtle">Đội bạn được trả lời · các đội khác theo dõi câu hỏi</div></div><div class="stage-phone">${SVG.phone()}</div></div>`;
      else if (['preview','answering','recorded','resolved','no-winner'].includes(state.phase)) content = questionPublic(q, compact);
      else if (state.phase === 'scoreboard') content = `<div class="stage-center"><div class="signal-copy gold">BẢNG XẾP HẠNG<br>HỒ SƠ 404</div><div class="subtle">Đồng điểm vẫn đồng hạng · không bốc thăm phá hòa</div></div>`;
      else if (state.phase === 'finished') content = `<div class="stage-center"><div class="signal-copy gold">HỒ SƠ 404<br>ĐÃ ĐƯỢC MỞ</div><div class="subtle">Cửa chính đang mở khóa.</div></div>`;
      return `<div class="stage-screen chapter-${chapter+1}"><div class="stage-scene-art"><div class="scene-door"></div><div class="scene-file"></div><div class="stage-ambient"></div></div><div class="stage-top"><div><div class="eyebrow">${esc(chapterLabels[chapter])}</div><h2>Cuộc gọi từ phòng 404</h2></div><div style="text-align:right"><div class="round-no">CÂU ${String(state.currentIndex+1).padStart(2,'0')} / 15</div><span class="pill">${esc(phaseText())}</span></div></div><div class="stage-content">${content}</div>${!compact && !['lobby','rules','practice','finished'].includes(state.phase) ? `<div class="stage-bottom">${scoreStrip()}</div>` : ''}</div>`;
    }

    function questionPublic(q, compact=false) {
      const winner = team(state.winnerTeamId); const reveal = state.phase === 'resolved';
      let body = '';
      if (q.type === 'A' || q.type === 'G') body = `<div class="public-options">${q.options.map((option,i) => `<div class="public-option"><span class="option-key">${String.fromCharCode(65+i)}</span><span>${esc(option)}</span></div>`).join('')}</div>`;
      else if (q.type === 'B') body = `<div class="stack">${q.statements.map((s,i) => `<div class="public-option"><span class="option-key">${i+1}</span><span>${esc(s)}</span></div>`).join('')}</div>`;
      else if (q.type === 'C') body = `<div class="stack">${q.items.map((item,i) => `<div class="public-option"><span class="option-key">${i+1}</span><span>${esc(item)}</span></div>`).join('')}</div><div class="subtle" style="margin-top:10px">Nói thứ tự bằng số, ví dụ: 2 – 3 – 1.</div>`;
      else if (q.type === 'D') body = `<div class="public-options">${q.labels.map((label,i) => `<div class="public-option"><span class="option-key">${i+1}</span><span>${esc(label)}</span></div>`).join('')}</div><div class="subtle" style="margin-top:10px">Ghép với mô tả tương ứng ở phía MC.</div>`;
      else if (q.type === 'E' || q.type === 'H') body = `<div class="evidence-box">Câu trả lời mở · đội nói trực tiếp với MC. MC đánh dấu từng tiêu chí đạt sau khi bấm ghi nhận.</div>`;
      else if (q.type === 'F') body = `<div class="evidence-box">Đội nói một từ hoặc cụm từ ngắn. MC nhập lại sau khi đội chốt.</div>`;
      return `<div class="question-panel"><div class="question-top"><div style="display:flex;gap:7px;flex-wrap:wrap;align-items:center"><span class="question-type">${esc(q.typeName)} · ${q.duration}s</span><span class="pill"><i class="dot gold"></i>BẢN THỬ</span></div><span class="eyebrow">TỐI ĐA 10 ĐIỂM</span></div><h2>${esc(q.prompt)}</h2>${q.evidence ? `<div class="evidence-box" style="margin-bottom:14px"><b class="gold">BẰNG CHỨNG</b><br>${esc(q.evidence).replace(/\n/g,'<br>')}</div>` : ''}${body}<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin-top:17px"><span class="subtle">${winner ? `Đội ${String(winner.number).padStart(2,'0')} · ${esc(winner.name)} ${state.phase === 'answering' ? 'đang trả lời' : 'giữ quyền'}` : 'Không có đội giữ quyền · câu dùng để ôn tập'}</span>${reveal && state.lastResult ? `<strong class="${state.lastResult.points ? 'mint':'red'}">+${state.lastResult.points} điểm</strong>` : ''}</div></div>`;
    }

    function scoreStrip() {
      return `<div class="score-strip">${rankings().map(t => `<div class="score-chip ${t.id === state.winnerTeamId ? 'active':''}"><div class="chip-line"><b>${String(t.number).padStart(2,'0')}</b><small>#${t.rank}</small></div><strong title="${esc(t.name)}">${esc(t.name)}</strong><small>${t.score} điểm</small></div>`).join('')}</div>`;
    }

    function teamPage() {
      const t = team(selectedTeamId) || state.teams[0]; selectedTeamId = t.id;
      return `${pageHeading('Điện thoại đội chơi', 'Mỗi đội dùng một thiết bị để bắt máy. Câu trả lời luôn thực hiện trực tiếp với MC.', 'ĐỘI CHƠI / TEAM')}<div class="team-view"><div class="card pad"><div class="eyebrow">Chọn thiết bị demo</div><div class="team-selector">${state.teams.map(x => `<button class="team-select-chip ${x.id === t.id ? 'active':''}" data-action="select-team" data-team="${x.id}">Đội ${String(x.number).padStart(2,'0')}</button>`).join('')}</div><div class="subtle">Trong buổi thật, mỗi thiết bị nhận mã đội riêng sau khi MC duyệt.</div></div>${teamPhone(t)}</div>`;
    }
    function teamPhone(t) {
      const isCurrent = state.winnerTeamId === t.id; const early = state.earlyTeams.includes(t.id); let statusTitle = 'Chờ cuộc gọi từ phòng 404'; let statusText = 'Giữ màn hình này mở. Chỉ bấm khi nút chuyển sang BẮT MÁY.'; let button = {label:'CHỜ PHÒNG 404', cls:'', disabled:true};
      if (state.phase === 'rules') { statusTitle='Đọc kỹ luật'; statusText='Chờ 404 → bắt máy → trả lời trực tiếp.'; }
      else if (state.phase === 'practice') { statusTitle='Lượt thử không tính điểm'; statusText='Bấm để kiểm tra trạng thái thiết bị.'; button={label:'THỬ BẮT MÁY',cls:'ready',disabled:false}; }
      else if (state.phase === 'waiting') { statusTitle=early ? 'BẤM SỚM — CHỜ CÂU SAU' : 'Chưa được nghe'; statusText=early ? 'Đội bạn bị khóa ở câu này và sẽ trở lại ở câu sau.' : 'Tín hiệu hiện tại có thể là giả. Đợi dòng PHÒNG 404 — BẮT MÁY.'; button={label:early?'BẤM SỚM':'CHỜ TÍN HIỆU',cls:'wait',disabled:early}; }
      else if (state.phase === 'buzz-open') { statusTitle='PHÒNG 404 — BẮT MÁY'; statusText='Một lần chạm duy nhất. Server nhận trước sẽ xác nhận đội thắng.'; button={label:'BẮT MÁY',cls:'ready',disabled:early}; }
      else if (state.phase === 'winner-locked' || state.phase === 'preview' || state.phase === 'answering' || state.phase === 'recorded') { statusTitle=isCurrent ? 'ĐỘI BẠN ĐÃ KẾT NỐI' : `ĐỘI ${String(state.winnerTeamId).padStart(2,'0')} ĐÃ BẮT MÁY`; statusText=isCurrent ? 'Nhìn màn hình lớn để nhận câu hỏi. Trả lời trực tiếp với MC.' : 'Theo dõi câu hỏi trên màn hình lớn.'; button={label:isCurrent?'ĐÃ KẾT NỐI':'ĐÃ CÓ ĐỘI BẮT MÁY',cls:isCurrent?'ready':'',disabled:true}; }
      else if (state.phase === 'resolved') { statusTitle='Câu đã giải quyết'; statusText='Câu tiếp theo sắp bắt đầu.'; }
      else if (state.phase === 'finished') { statusTitle='Hồ sơ đã mở'; statusText='Cảm ơn đội điều tra.'; }
      return `<div class="phone-shell"><div class="phone-screen"><div class="phone-notch"></div><div class="phone-head"><div><div class="eyebrow">ĐIỆN THOẠI ĐỘI</div><h2>Đội ${String(t.number).padStart(2,'0')}</h2><div class="subtle">${esc(t.name)}</div></div><div style="text-align:right"><div class="eyebrow">HẠNG</div><strong class="gold" style="font:24px 'DM Mono'">#${scoreRank(t.id)}</strong></div></div><div class="phone-status"><b>${statusTitle}</b>${statusText}</div><div class="phone-stage"><div class="phone-signal ${state.phase === 'buzz-open' ? 'mint' : early ? 'red' : ''}">${state.phase === 'buzz-open' ? 'Đường dây thật<br>đã mở' : state.phase === 'practice' ? 'Sẵn sàng thử' : state.phase === 'finished' ? 'Cửa chính<br>đang mở' : 'Đang nghe...'}</div><button class="buzz-button ${button.cls}" data-action="team-buzz" data-team="${t.id}" ${button.disabled ? 'disabled':''}>${button.label}</button><div class="subtle">${state.phase === 'buzz-open' ? `Còn <b class="gold" data-live="deadline">${showTime()}</b>` : 'Không có popup che nút · không gửi lại lượt offline'}</div></div><div class="phone-score"><div class="phone-stat"><small>TỔNG ĐIỂM</small><b>${scoreFor(t.id)}</b></div><div class="phone-stat"><small>GIỮ QUYỀN</small><b>${t.holds}</b></div></div><div class="connection"><i class="dot ${t.online ? 'mint':'red'}"></i>${t.online ? 'Đã kết nối với phiên' : 'Mất kết nối · nút tạm khóa'}</div></div></div>`;
    }

    function rulesPage() {
      return `<section class="card pad" style="max-width:940px;margin:0 auto"><div class="eyebrow">LUẬT CHÍNH THỨC</div><h1 style="font:clamp(38px,6vw,72px) var(--serif);line-height:.95;margin:13px 0 17px">Chỉ một cuộc gọi<br>được xác nhận.</h1><p class="subtle">Mỗi câu có đúng một đợt giành quyền. Bấm sớm chỉ mất quyền ở câu đó; sai hoặc hết giờ không chuyển lượt. Mỗi câu tối đa 10 điểm. Đồng điểm vẫn đồng hạng.</p><div class="section-grid"><div class="feature"><span class="feature-num">01 · CHỜ 404</span><b>Không bấm khi chưa có tín hiệu thật</b><p>Tín hiệu giả có chữ và biểu tượng riêng. Bấm trong giai đoạn chờ sẽ khóa đội ở câu hiện tại.</p></div><div class="feature"><span class="feature-num">02 · BẮT MÁY</span><b>Một lần chạm hợp lệ</b><p>Server nhận và khóa winner nguyên tử. Không đấu phụ, không cộng thưởng tốc độ.</p></div><div class="feature"><span class="feature-num">03 · TRẢ LỜI</span><b>Nói trực tiếp với MC</b><p>Điện thoại chỉ để bắt máy. MC nhập câu trả lời hoặc đánh dấu rubric trên bảng điều khiển.</p></div></div><div class="divider"></div><div class="card-title"><div><div class="eyebrow">SỰ CỐ</div><h2 style="font-size:20px">Không có winner vẫn kết thúc có kiểm soát</h2></div></div><p class="subtle">Nếu không ai bấm hoặc tất cả bấm sớm, câu hỏi/lời giải vẫn mở để cùng ôn tập, nhận 0 điểm và sang câu mới. Mất mạng không phát lại lượt bấm cũ; tải lại không reset điểm.</p><div class="hero-actions"><button class="btn gold" data-action="home">Quay lại sảnh</button><button class="btn primary" data-action="create-room">Vào bảng MC</button></div></section>`;
    }

    function answerControls(q) {
      const locked = state.phase === 'recorded' || state.phase === 'resolved'; const d = state.draft;
      let body = '';
      if (q.type === 'A' || q.type === 'G') body = `<div class="choice-grid">${q.options.map((o,i) => `<button class="choice-btn ${d.selected === String.fromCharCode(65+i) ? 'selected':''}" data-action="pick-option" data-value="${String.fromCharCode(65+i)}" ${locked?'disabled':''}><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</button>`).join('')}</div>`;
      else if (q.type === 'B') body = `<div class="stack">${q.statements.map((s,i) => `<div class="toggle-line"><span>${i+1}. ${esc(s)}</span><span class="toggle-buttons">${[true,false].map(v => `<button class="mini-toggle ${d.statements[i] === v ? 'selected':''}" data-action="toggle-statement" data-index="${i}" data-value="${v}" ${locked?'disabled':''}>${v?'Đúng':'Sai'}</button>`).join('')}</span></div>`).join('')}</div>`;
      else if (q.type === 'C') body = `<div class="answer-help">Bấm từng thẻ theo thứ tự đội vừa nói. Số thứ tự sẽ hiện ở bên phải.</div><div class="order-list">${q.items.map((item,i) => { const pos=d.order.indexOf(i); return `<button class="order-btn ${pos >= 0 ? 'selected':''}" data-action="toggle-order" data-index="${i}" ${locked?'disabled':''}><span class="order-pos">${pos >= 0 ? pos + 1 : '—'}</span><span>${esc(item)}</span><small class="dim">${pos >= 0 ? 'đã chọn':'chưa chọn'}</small></button>`; }).join('')}</div>`;
      else if (q.type === 'D') body = `<div class="answer-help">Chọn mô tả A–E cho từng thuật ngữ. Không dùng kéo thả để tránh sai trên màn hình cảm ứng.</div><div class="pair-list">${q.labels.map((label,i) => `<label class="pair-row"><span>${i+1}. ${esc(label)}</span><select data-pair-index="${i}" ${locked?'disabled':''}><option value="">— chọn —</option>${['A','B','C','D','E'].map(x => `<option value="${x}" ${d.pairs[i] === x ? 'selected':''}>${x}</option>`).join('')}</select></label>`).join('')}</div>`;
      else if (q.type === 'E' || q.type === 'H') body = `<div class="answer-help">${q.type === 'H' ? 'Đánh dấu hai tiêu chí đạt theo câu trả lời trực tiếp.' : 'Đội phải chỉ ra lỗi và nêu cách sửa. Mỗi tiêu chí đạt 5 điểm.'}</div><div class="criteria">${q.criteria.map((c,i) => `<label class="criterion-line"><span>${i+1}. ${esc(c)}</span><input type="checkbox" data-criterion-index="${i}" ${d.criteria.includes(i) ? 'checked':''} ${locked?'disabled':''}></label>`).join('')}</div>`;
      else if (q.type === 'F') body = `<div class="form-row"><label>Nhập đúng cụm từ đội vừa nói</label><input class="input" data-answer-input value="${esc(d.text)}" placeholder="Ví dụ: chưa xác minh" ${locked?'disabled':''}></div>`;
      const response = draftSummary(q);
      return `<div class="answer-controls">${body}<div class="draft-response"><b>Bản nhập hiện tại:</b><br>${response}</div>${state.phase === 'recorded' ? '<div class="answer-help">Câu trả lời đã khóa. Điểm sẽ được ghi một lần khi MC xác nhận.</div>' : ''}</div>`;
    }
    function draftSummary(q) {
      const d=state.draft;
      if (q.type === 'A' || q.type === 'G') return d.selected ? `${d.selected}. ${esc(q.options['ABCD'.indexOf(d.selected)] || '')}` : 'Chưa chọn';
      if (q.type === 'B') return d.statements.map((v,i)=>`${i+1}: ${v === null ? '—' : v ? 'Đúng':'Sai'}`).join(' · ');
      if (q.type === 'C') return d.order.length ? d.order.map(i=>i+1).join(' – ') : 'Chưa xếp';
      if (q.type === 'D') return q.labels.map((_,i)=>`${i+1}${d.pairs[i] || '—'}`).join(' · ');
      if (q.type === 'E' || q.type === 'H') return d.criteria.length ? `Đạt tiêu chí: ${d.criteria.map(i=>i+1).join(', ')}` : 'Chưa đánh dấu tiêu chí';
      return d.text ? esc(d.text) : 'Chưa nhập';
    }

    function scoreboardOverlay() {
      const ranks = rankings();
      return `<div class="scoreboard"><div class="scoreboard-inner"><div class="scoreboard-title"><div><div class="eyebrow">HỒ SƠ 404 · BẢNG KẾT QUẢ</div><h2>Ai đang nghe<br>được sự thật?</h2></div><button class="btn ghost" data-action="close-scoreboard">Đóng ×</button></div><div class="rank-table">${ranks.map((t,i)=>`<div class="rank-row ${i < 3 ? 'top':''}"><span class="rank-no">${t.rank}</span><div><strong>Đội ${String(t.number).padStart(2,'0')} · ${esc(t.name)}</strong><br><small>${t.holds} lần giữ quyền · ${t.full} câu trọn điểm</small></div><span class="rank-points">${t.score}đ</span><span class="rank-cells">${t.answered} câu</span><span class="rank-cells">${t.online && t.approved ? '● online':'○ offline'}</span></div>`).join('')}</div><div class="podium-note">Đồng điểm được đồng hạng theo kiểu 1, 2, 2, 4. Vị trí ổn định theo số đội chỉ để bố trí; không dùng để phá hòa.</div><div class="finish-actions"><button class="btn gold" data-action="download-csv">Tải CSV</button><button class="btn ghost" data-action="download-json">Tải JSON</button></div></div></div>`;
