<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b18">
  <title>Nghịch lý · Bảo tàng không tồn tại</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap");
    :root {
      --bg: #080b18;
      --bg2: #111830;
      --ink: #f8f5ec;
      --muted: #9da8c4;
      --dim: #647091;
      --line: #ffffff1c;
      --line2: #ffffff34;
      --violet: #9575ff;
      --cyan: #69e7ff;
      --gold: #ffd166;
      --pink: #ff6b9d;
      --green: #69e0ad;
      --danger: #ff6d7c;
      --sans: "Be Vietnam Pro", system-ui, sans-serif;
      --display: "Space Grotesk", "Be Vietnam Pro", system-ui, sans-serif;
      --mono: "DM Mono", monospace;
    }
    * { box-sizing: border-box; }
    html, body { min-width: 320px; min-height: 100%; margin: 0; background: var(--bg); }
    body { color: var(--ink); font-family: var(--sans); overflow-x: hidden; }
    button, input { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, a:focus-visible { outline: 3px solid var(--cyan); outline-offset: 3px; }
    a { color: inherit; text-decoration: none; }
    .app { min-height: 100vh; position: relative; isolation: isolate; }
    .app::before { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: -2; background: radial-gradient(circle at 80% -10%, #7f68ff3b, transparent 35%), radial-gradient(circle at 0% 100%, #19d8ff13, transparent 32%), linear-gradient(145deg, #070a15, #0b1022 52%, #0a0c18); }
    .app::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: -1; opacity: .16; background-image: linear-gradient(#ffffff06 1px, transparent 1px), linear-gradient(90deg, #ffffff06 1px, transparent 1px); background-size: 42px 42px; mask-image: linear-gradient(180deg, #000, transparent 90%); }
    .mono { font-family: var(--mono); }
    .eyebrow { color: var(--gold); font: 11px var(--mono); letter-spacing: .18em; text-transform: uppercase; }
    .muted { color: var(--muted); }
    .dim { color: var(--dim); }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 9px; min-height: 42px; padding: 11px 16px; border: 1px solid var(--line2); border-radius: 13px; background: #ffffff0c; color: var(--ink); font-weight: 800; font-size: 12px; transition: transform .16s ease, filter .16s ease, border-color .16s ease; }
    .btn:hover { transform: translateY(-2px); filter: brightness(1.13); border-color: #ffffff76; }
    .btn.primary { background: var(--cyan); color: #06111a; border-color: var(--cyan); }
    .btn.gold { background: var(--gold); color: #21190a; border-color: var(--gold); }
    .btn.green { background: var(--green); color: #071912; border-color: var(--green); }
    .btn.danger { background: var(--danger); color: #250a10; border-color: var(--danger); }
    .btn.ghost { background: transparent; }
    .btn.large { min-height: 62px; padding: 16px 24px; font-size: 15px; border-radius: 17px; }
    .btn:disabled { opacity: .42; cursor: not-allowed; transform: none; filter: none; }

    /* Home */
    .home { min-height: 100vh; width: min(1240px, calc(100% - 40px)); margin: 0 auto; display: grid; place-items: center; padding: 44px 0; }
    .home-grid { width: 100%; display: grid; grid-template-columns: minmax(0, .9fr) minmax(360px, 1.1fr); gap: clamp(28px, 6vw, 86px); align-items: center; }
    .home-copy h1 { margin: 17px 0 22px; max-width: 720px; font: 800 clamp(54px, 8vw, 112px)/.88 var(--display); letter-spacing: -.065em; }
    .home-copy h1 em { color: var(--gold); font-style: normal; }
    .home-copy p { max-width: 520px; margin: 0; color: var(--muted); font-size: clamp(14px, 1.5vw, 18px); line-height: 1.65; }
    .home-actions { display: flex; flex-wrap: wrap; gap: 11px; margin-top: 30px; }
    .home-note { display: flex; gap: 26px; margin-top: 36px; }
    .home-note b { display: block; color: var(--gold); font: 800 26px var(--display); }
    .home-note span { display: block; margin-top: 3px; color: var(--dim); font-size: 10px; text-transform: uppercase; letter-spacing: .11em; }
    .museum-card { position: relative; min-height: 570px; overflow: hidden; border: 1px solid var(--line2); border-radius: 32px; background: radial-gradient(circle at 53% 31%, #a27aff36, transparent 27%), linear-gradient(150deg, #20234c, #101528 55%, #080b16); box-shadow: 0 35px 100px #0009; }
    .museum-card::before { content: "MUSEUM 00"; position: absolute; top: 22px; left: 28px; color: #ffffff7a; font: 11px var(--mono); letter-spacing: .2em; }
    .museum-card::after { content: ""; position: absolute; inset: 16px; border: 1px solid #ffffff14; border-radius: 23px; pointer-events: none; }
    .museum-word { position: absolute; left: 8%; bottom: 9%; z-index: 2; color: #ffffff28; font: 800 clamp(55px, 10vw, 125px)/.8 var(--display); letter-spacing: -.1em; transform: rotate(-8deg); }
    .home-orbit { position: absolute; left: 49%; top: 45%; width: 220px; height: 220px; transform: translate(-50%, -50%); border: 1px solid #ffffff58; border-radius: 50%; box-shadow: 0 0 0 22px #ffffff06, 0 0 0 45px #ffffff04; animation: orbit 15s linear infinite; }
    .home-orbit::before, .home-orbit::after { content: ""; position: absolute; width: 12px; height: 12px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 25px var(--cyan); }
    .home-orbit::before { left: 18px; top: 35px; } .home-orbit::after { right: 25px; bottom: 20px; background: var(--gold); box-shadow: 0 0 25px var(--gold); }
    @keyframes orbit { to { transform: translate(-50%, -50%) rotate(360deg); } }
    .home-door { position: absolute; left: 31%; top: 17%; width: 38%; height: 62%; border: 10px solid #050711; border-bottom-width: 16px; border-radius: 130px 130px 0 0; background: linear-gradient(135deg, #554a9f, #1d234b 62%, #0a0d1e); box-shadow: inset 0 0 38px #0009, 0 22px 36px #0007; transform: perspective(500px) rotateY(-11deg); }
    .home-door::before { content: "∅"; position: absolute; inset: 17%; display: grid; place-items: center; border: 1px solid #69e7ff70; color: var(--cyan); font: 100px var(--display); text-shadow: 0 0 25px var(--cyan); }
    .home-door::after { content: ""; position: absolute; right: 9%; top: 54%; width: 10px; height: 10px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 20px var(--gold); }
    .home-piece { position: absolute; width: 82px; aspect-ratio: 1; border: 1px solid #ffffff70; background: #ffffff0b; backdrop-filter: blur(5px); box-shadow: 0 15px 30px #0007; clip-path: polygon(0 14%, 20% 14%, 20% 0, 52% 0, 52% 15%, 100% 15%, 100% 75%, 82% 75%, 82% 100%, 39% 100%, 39% 84%, 0 84%); animation: drift 5s ease-in-out infinite alternate; }
    .home-piece::before { content: ""; position: absolute; inset: 22%; border: 2px solid var(--gold); border-radius: 50%; }
    .hp1 { left: 9%; top: 25%; } .hp2 { right: 8%; top: 15%; animation-delay: -1s; } .hp3 { right: 11%; bottom: 16%; animation-delay: -2.2s; } .hp4 { left: 14%; bottom: 15%; animation-delay: -3.5s; }
    @keyframes drift { to { transform: translateY(-16px) rotate(8deg); } }

    /* Shared header and cards */
    .simple-header { min-height: 66px; display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 14px clamp(18px, 4vw, 58px); border-bottom: 1px solid var(--line); background: #080b18b8; backdrop-filter: blur(14px); }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-mark { width: 36px; height: 36px; display: grid; place-items: center; border: 1px solid var(--gold); border-radius: 11px; color: var(--gold); font: 18px var(--display); }
    .brand-copy b { display: block; font: 800 12px var(--display); letter-spacing: .16em; }
    .brand-copy span { display: block; color: var(--dim); font: 9px var(--mono); letter-spacing: .12em; margin-top: 2px; }
    .header-actions { display: flex; gap: 8px; align-items: center; }
    .icon-btn { width: 38px; height: 38px; display: grid; place-items: center; border: 1px solid var(--line2); border-radius: 11px; background: #ffffff09; color: var(--ink); }
    .icon-btn:hover { border-color: var(--cyan); color: var(--cyan); }
    .panel { border: 1px solid var(--line); border-radius: 20px; background: linear-gradient(145deg, #171d36ee, #0d1225f0); box-shadow: 0 25px 70px #0003; overflow: hidden; }
    .panel-pad { padding: clamp(16px, 2.3vw, 27px); }
    .panel-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 17px 20px; border-bottom: 1px solid var(--line); }
    .panel-head h2, .panel-head h3 { margin: 0; font: 700 15px var(--display); }
    .tag { display: inline-flex; align-items: center; min-height: 25px; padding: 5px 9px; border: 1px solid var(--line2); border-radius: 999px; color: var(--muted); font: 10px var(--mono); letter-spacing: .08em; }

    /* Stage / PPT surface */
    .stage-root { min-height: 100vh; display: flex; flex-direction: column; background: #070a15; }
    .stage-header { position: relative; z-index: 5; min-height: 62px; display: flex; justify-content: space-between; align-items: center; padding: 14px clamp(18px, 4vw, 60px); border-bottom: 1px solid #ffffff1a; background: linear-gradient(180deg, #060914e8, transparent); }
    .stage-header .stage-code { color: var(--muted); font: 12px var(--mono); }
    .stage-main { flex: 1; min-height: 0; display: grid; place-items: center; padding: clamp(18px, 4vw, 54px); position: relative; overflow: hidden; }
    .stage-main::before { content: ""; position: absolute; width: 72vw; height: 72vw; max-width: 1000px; max-height: 1000px; border-radius: 50%; background: radial-gradient(circle, #7c69ff20, transparent 63%); filter: blur(4px); }
    .slide { width: min(1220px, 100%); min-height: min(720px, 80vh); position: relative; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
    .slide-kicker { color: var(--gold); font: 11px var(--mono); letter-spacing: .22em; text-transform: uppercase; }
    .slide h1 { margin: 15px 0 0; max-width: 980px; font: 800 clamp(42px, 7.3vw, 105px)/.9 var(--display); letter-spacing: -.07em; }
    .slide h1 em { color: var(--cyan); font-style: normal; }
    .slide-sub { max-width: 620px; margin: 19px auto 0; color: var(--muted); font-size: clamp(13px, 1.4vw, 18px); line-height: 1.55; }
    .slide-number { position: absolute; left: 0; top: 3px; color: #ffffff4f; font: 11px var(--mono); letter-spacing: .15em; }
    .slide-visual { width: min(710px, 86vw); aspect-ratio: 1.48; position: relative; margin: 20px auto 13px; }
    .scene { width: 100%; height: 100%; display: block; filter: drop-shadow(0 25px 32px #0008); }
    .scene-glow { position: absolute; inset: 14% 16%; border-radius: 50%; background: radial-gradient(circle, #69e7ff32, transparent 60%); filter: blur(20px); animation: pulse 3.5s ease-in-out infinite; pointer-events: none; }
    @keyframes pulse { 50% { opacity: .45; transform: scale(1.08); } }
    .slide-puzzle { width: min(850px, 94vw); display: grid; grid-template-columns: repeat(4, 1fr); gap: clamp(8px, 1.4vw, 17px); margin: 24px auto 0; }
    .stage-piece { min-height: 118px; display: grid; place-items: center; gap: 5px; padding: 10px; border: 1px solid #ffffff3d; border-radius: 18px; background: linear-gradient(145deg, #ffffff13, #ffffff04); box-shadow: inset 0 0 22px #ffffff06, 0 12px 30px #0004; position: relative; overflow: hidden; }
    .stage-piece::before { content: ""; position: absolute; inset: 0; background: linear-gradient(120deg, transparent, #ffffff18, transparent); transform: translateX(-120%); animation: shine 4.2s ease-in-out infinite; }
    .stage-piece:nth-child(2)::before { animation-delay: .7s; } .stage-piece:nth-child(3)::before { animation-delay: 1.4s; } .stage-piece:nth-child(4)::before { animation-delay: 2.1s; }
    @keyframes shine { 45%, 100% { transform: translateX(120%); } }
    .piece-icon { width: 68px; height: 68px; }
    .stage-piece small { color: #ffffff9a; font: 10px var(--mono); letter-spacing: .12em; }
    .timer { min-width: 104px; padding: 10px 17px; border: 1px solid var(--pink); border-radius: 14px; color: var(--pink); font: 800 clamp(25px, 4vw, 48px) var(--mono); box-shadow: 0 0 25px #ff6b9d21; }
    .timer.safe { border-color: var(--cyan); color: var(--cyan); box-shadow: 0 0 25px #69e7ff21; }
    .buzz-line { display: flex; justify-content: center; align-items: center; gap: 16px; margin-top: 13px; color: var(--muted); font-size: 12px; }
    .winner-card { display: inline-flex; align-items: center; gap: 12px; margin: 23px auto 0; padding: 13px 18px; border: 1px solid #69e7ff69; border-radius: 15px; background: #69e7ff0c; }
    .winner-dot { width: 13px; height: 13px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 16px var(--cyan); }
    .winner-card b { font: 800 18px var(--display); }
    .question-box { width: min(970px, 95vw); margin: 22px auto 0; padding: clamp(18px, 3vw, 31px); border: 1px solid #ffffff32; border-radius: 23px; background: linear-gradient(145deg, #ffffff0f, #ffffff03); }
    .question-box h2 { margin: 0; font: 700 clamp(24px, 4vw, 47px)/1.04 var(--display); letter-spacing: -.04em; }
    .options { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 18px; text-align: left; }
    .option { display: flex; align-items: center; gap: 11px; min-height: 48px; padding: 11px 13px; border: 1px solid var(--line); border-radius: 13px; background: #ffffff08; color: var(--muted); font-size: clamp(12px, 1.35vw, 15px); }
    .option b { width: 28px; height: 28px; display: grid; place-items: center; flex: 0 0 auto; border-radius: 9px; background: #ffffff12; color: var(--gold); font: 700 12px var(--mono); }
    .result-mark { width: 116px; height: 116px; display: grid; place-items: center; margin-bottom: 19px; border: 1px solid var(--green); border-radius: 50%; color: var(--green); font: 700 64px var(--display); box-shadow: 0 0 50px #69e0ad2a; animation: result-pop .5s ease-out; }
    .result-mark.wrong { border-color: var(--danger); color: var(--danger); box-shadow: 0 0 50px #ff6d7c25; }
    @keyframes result-pop { from { transform: scale(.45); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .award { color: var(--gold); font: 800 clamp(60px, 11vw, 150px)/.8 var(--display); letter-spacing: -.08em; text-shadow: 0 0 32px #ffd16635; }
    .scoreboard-slide { width: min(960px, 95vw); margin: 20px auto 0; }
    .score-row { display: grid; grid-template-columns: 46px minmax(0,1fr) 70px; align-items: center; gap: 12px; min-height: 54px; padding: 7px 11px; border-bottom: 1px solid var(--line); text-align: left; }
    .score-row:first-child { border: 1px solid #ffd16663; border-radius: 14px; background: #ffd1660b; }
    .score-rank { color: var(--gold); font: 700 18px var(--mono); }
    .score-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; }
    .score-bar { height: 5px; margin-top: 6px; border-radius: 99px; background: #ffffff12; overflow: hidden; }
    .score-bar i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--violet), var(--cyan)); }
    .score-points { color: var(--gold); text-align: right; font: 700 17px var(--mono); }
    .podium { display: flex; align-items: flex-end; justify-content: center; gap: 10px; height: 230px; margin: 26px auto; }
    .podium-col { width: min(22vw, 190px); min-width: 95px; display: grid; gap: 9px; justify-items: center; }
    .podium-col b { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
    .podium-block { width: 100%; display: grid; place-items: center; border: 1px solid #ffffff2e; border-bottom: 0; border-radius: 15px 15px 0 0; background: linear-gradient(180deg, #ffffff17, #ffffff05); color: var(--gold); font: 800 30px var(--display); }
    .p1 .podium-block { height: 165px; } .p2 .podium-block { height: 120px; } .p3 .podium-block { height: 90px; }
    .stage-footer { min-height: 38px; display: flex; justify-content: space-between; align-items: center; padding: 9px clamp(18px, 4vw, 60px); color: #ffffff54; font: 10px var(--mono); letter-spacing: .08em; }

    /* Host remote */
    .host-root { min-height: 100vh; }
    .host-wrap { width: min(1420px, calc(100% - 36px)); margin: 0 auto; padding: 24px 0 50px; }
    .host-grid { display: grid; grid-template-columns: minmax(0, 1.16fr) minmax(330px, .84fr); gap: 16px; align-items: start; }
    .preview-frame { min-height: 620px; display: grid; place-items: center; padding: 12px; border: 1px solid #ffffff1f; border-radius: 23px; background: #050813; overflow: hidden; }
    .preview-frame .stage-root { width: 100%; min-height: 590px; border-radius: 16px; transform-origin: top left; }
    .preview-frame .stage-header { min-height: 42px; padding: 8px 15px; }
    .preview-frame .stage-main { padding: 16px; }
    .preview-frame .slide { min-height: 0; height: 500px; }
    .preview-frame .slide h1 { font-size: clamp(27px, 4vw, 55px); }
    .preview-frame .slide-visual { width: 68%; margin: 10px auto; }
    .preview-frame .slide-puzzle { gap: 5px; margin-top: 9px; }
    .preview-frame .stage-piece { min-height: 60px; border-radius: 10px; }
    .preview-frame .piece-icon { width: 35px; height: 35px; }
    .preview-frame .stage-piece small { font-size: 7px; }
    .preview-frame .question-box { margin-top: 10px; padding: 13px; border-radius: 13px; }
    .preview-frame .question-box h2 { font-size: 23px; }
    .preview-frame .option { min-height: 29px; padding: 5px; font-size: 9px; border-radius: 7px; }
    .preview-frame .option b { width: 18px; height: 18px; border-radius: 5px; font-size: 8px; }
    .preview-frame .winner-card { margin-top: 9px; padding: 7px 10px; }
    .preview-frame .winner-card b { font-size: 11px; }
    .preview-frame .timer { min-width: 52px; padding: 4px 8px; font-size: 19px; }
    .remote { display: grid; gap: 13px; }
    .remote-status { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
    .status-tile { padding: 13px; border: 1px solid var(--line); border-radius: 14px; background: #ffffff07; }
    .status-tile small { display: block; color: var(--dim); font: 10px var(--mono); letter-spacing: .08em; }
    .status-tile b { display: block; margin-top: 5px; font: 700 20px var(--display); }
    .remote-actions { display: grid; gap: 9px; }
    .remote-actions .btn { width: 100%; min-height: 56px; font-size: 14px; }
    .auto-note { padding: 11px 13px; border: 1px solid #69e7ff32; border-radius: 13px; background: #69e7ff08; color: var(--muted); font-size: 11px; line-height: 1.5; }
    .remote-live { display: grid; gap: 5px; padding: 14px; border: 1px solid #ffffff20; border-radius: 14px; background: #ffffff08; text-align: center; }
    .remote-live b { font: 700 20px var(--display); }
    .remote-timer { color: var(--pink); font: 800 39px var(--mono) !important; }
    .remote-duo { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
    .mini-score { display: grid; gap: 4px; }
    .mini-score-row { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 11px; }
    .mini-score-row b:last-child { color: var(--gold); font-family: var(--mono); }
    .keyboard-note { color: var(--dim); text-align: center; font: 10px var(--mono); }

    /* Team phone */
    .team-root { min-height: 100vh; display: grid; place-items: center; padding: 17px; background: radial-gradient(circle at 50% 0%, #5b4ca72e, transparent 45%), #080b18; }
    .team-phone { width: min(470px, 100%); min-height: min(850px, calc(100vh - 34px)); display: flex; flex-direction: column; border: 1px solid #ffffff2b; border-radius: 31px; background: linear-gradient(155deg, #171d39, #0b1022); box-shadow: 0 28px 80px #0009; overflow: hidden; }
    .team-head { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px; border-bottom: 1px solid var(--line); }
    .team-head b { display: block; font: 700 16px var(--display); }
    .team-head small { display: block; margin-top: 3px; color: var(--dim); font: 10px var(--mono); }
    .team-score { color: var(--gold); font: 700 20px var(--mono); }
    .team-body { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 23px 20px 30px; text-align: center; }
    .team-round { color: var(--gold); font: 11px var(--mono); letter-spacing: .15em; }
    .team-body h1 { margin: 13px 0 9px; font: 800 clamp(31px, 8vw, 55px)/.93 var(--display); letter-spacing: -.06em; }
    .team-body p { margin: 0 auto; max-width: 360px; color: var(--muted); font-size: 13px; line-height: 1.5; }
    .team-pieces { display: grid; grid-template-columns: repeat(2, 1fr); gap: 13px; margin-top: 30px; }
    .team-piece { min-height: 135px; display: grid; place-items: center; border: 1px solid #ffffff38; border-radius: 21px; background: linear-gradient(145deg, #ffffff14, #ffffff04); color: var(--ink); transition: transform .15s ease, border-color .15s ease, background .15s ease; }
    .team-piece:hover { transform: translateY(-4px); border-color: var(--cyan); background: #69e7ff12; }
    .team-piece:disabled { opacity: .4; cursor: not-allowed; transform: none; }
    .team-piece.selected { border-color: var(--gold); background: #ffd16618; box-shadow: 0 0 30px #ffd16622; }
    .team-piece .piece-icon { width: 72px; height: 72px; }
    .team-wait-art { width: 170px; height: 130px; margin: 0 auto 16px; opacity: .85; }
    .team-message { margin-top: 22px; padding: 13px; border: 1px solid var(--line); border-radius: 14px; background: #ffffff07; color: var(--muted); font-size: 12px; }
    .team-foot { padding: 13px 20px; border-top: 1px solid var(--line); color: var(--dim); text-align: center; font: 10px var(--mono); }

    @media (max-width: 920px) {
      .home-grid, .host-grid { grid-template-columns: 1fr; }
      .museum-card { min-height: 420px; order: -1; }
      .home-copy { text-align: center; }
      .home-copy p { margin: 0 auto; }
      .home-actions, .home-note { justify-content: center; }
      .preview-frame { min-height: 450px; }
      .preview-frame .stage-root { min-height: 425px; }
      .preview-frame .slide { height: 355px; }
    }
    @media (max-width: 620px) {
      .home { width: min(100% - 26px, 500px); padding: 25px 0; }
      .museum-card { min-height: 315px; border-radius: 22px; }

      function miniScore() { return scoreList(3).map(function (t, i) { return '<div class="mini-score-row"><span>' + (i + 1) + ". " + esc(t.name) + '</span><b>' + t.score + "đ</b></div>"; }).join(""); }
      function hostView() {
        return '<main class="host-root"><header class="simple-header"><a href="#/" class="brand"><span class="brand-mark">∅</span><span class="brand-copy"><b>BẢO TÀNG KHÔNG TỒN TẠI</b><span>CHẾ ĐỘ PPT GAME · MC REMOTE</span></span></a><div class="header-actions"><a class="btn ghost" href="#/stage">Mở sân khấu ↗</a><button class="icon-btn" title="Bật/tắt âm thanh" data-action="sound">' + (state.sound ? "🔊" : "🔇") + '</button><button class="icon-btn" title="Đặt lại" data-action="reset">↻</button></div></header><div class="host-wrap"><div class="host-grid"><section class="preview-frame">' + stageView(true) + '</section><aside class="remote"><div class="panel panel-pad"><div class="eyebrow">MỘT NÚT / MỘT SLIDE</div><h1 style="font:800 clamp(28px,4vw,44px)/.95 var(--display);letter-spacing:-.05em;margin:10px 0 7px">MC chỉ cần<br><span style="color:var(--cyan)">bấm tiếp.</span></h1><p class="muted" style="font-size:12px;line-height:1.55;margin:0">Không nhập câu trả lời, không kéo thả, không mở nhiều bảng. Đội trả lời trực tiếp; MC chỉ chọn ĐÚNG hoặc SAI.</p></div><div class="remote-status"><div class="status-tile"><small>TRẠNG THÁI</small><b>' + phaseLabel() + '</b></div><div class="status-tile"><small>CÂU</small><b>' + String(Math.min(state.roundIndex + 1, rounds.length)).padStart(2, "0") + " / " + String(rounds.length).padStart(2, "0") + '</b></div></div><div class="panel panel-pad"><div class="remote-actions">' + hostControls() + '</div><div class="keyboard-note" style="margin-top:13px">SPACE = nút chính · 1 = đúng · 0 = sai</div></div><div class="panel"><div class="panel-head"><h3>Bảng điểm nhanh</h3>' + (state.phase === "result" ? '<button class="btn ghost" data-action="scoreboard">Mở BXH</button>' : '') + '</div><div class="panel-pad mini-score">' + miniScore() + '</div></div></aside></div></div></main>';
      }

      function stageCover() { return '<div class="slide"><div class="slide-kicker">EXHIBIT 00 · PPT GAME</div><h1>Bảo tàng<br><em>không tồn tại</em></h1><div class="slide-visual"><div class="scene-glow"></div>' + sceneSvg("orb") + '</div><p class="slide-sub">Mỗi câu chỉ có một mảnh ghép đúng. Chọn đúng — giành quyền — trả lời.</p></div>'; }
      function stageReady() { var q = currentRound(); return '<div class="slide"><span class="slide-number">/' + String(state.roundIndex + 1).padStart(2, "0") + '</span><div class="slide-kicker">PHÒNG TRƯNG BÀY ' + q.id + '</div><h1>' + esc(q.title) + '</h1><div class="slide-visual"><div class="scene-glow"></div>' + sceneSvg(q.visual) + '</div><p class="slide-sub">Chuẩn bị chọn mảnh ghép.</p></div>'; }
      function stageBuzz() {
        var q = currentRound(); var wrong = state.wrongTeams.length;
        return '<div class="slide"><span class="slide-number">/' + String(state.roundIndex + 1).padStart(2, "0") + '</span><div class="slide-kicker">CỬA SỔ GIÀNH QUYỀN</div><h1>Chọn <em>một mảnh</em></h1><div class="buzz-line"><div class="timer ' + (currentTime() > 5 ? "safe" : "") + '">' + currentTime() + 's</div><span>đội đang chọn · ' + wrong + ' mảnh sai</span></div><div class="slide-visual" style="width:min(520px,75vw);aspect-ratio:1.45;margin-top:10px"><div class="scene-glow"></div>' + sceneSvg(q.visual) + '</div><div class="slide-puzzle">' + [0,1,2,3].map(function (i) { return '<div class="stage-piece">' + pieceSvg(i, ["#69e7ff","#ffd166","#ff6b9d","#69e0ad"][i]) + '<small>MẢNH 0' + (i + 1) + '</small></div>'; }).join("") + '</div></div>';
      }
      function stageQuestion() {
        var q = currentRound(); var who = state.winnerTeam ? '<div class="winner-card"><i class="winner-dot"></i><b>Đội ' + String(state.winnerTeam).padStart(2, "0") + ' · ' + esc(teamName(state.winnerTeam)) + '</b></div>' : '<div class="winner-card"><i class="winner-dot" style="background:var(--gold);box-shadow:0 0 16px var(--gold)"></i><b>Cả lớp cùng suy luận</b></div>';
        return '<div class="slide"><span class="slide-number">/' + String(state.roundIndex + 1).padStart(2, "0") + '</span><div class="slide-kicker">CÂU HỎI · TRẢ LỜI TRỰC TIẾP</div>' + who + '<div class="question-box"><h2>' + esc(q.question) + '</h2><div class="options">' + q.options.map(function (o, i) { return '<div class="option"><b>' + String.fromCharCode(65 + i) + '</b><span>' + esc(o) + '</span></div>'; }).join("") + '</div></div><p class="slide-sub">' + esc(q.hint) + '</p></div>';
      }
      function stageResult() { var award = state.lastAward || { points: 0, teamId: null, noWinner: true }; var ok = !award.noWinner && award.points > 0; return '<div class="slide"><div class="result-mark ' + (ok ? "" : "wrong") + '">' + (ok ? "✓" : "×") + '</div><div class="slide-kicker">' + (award.noWinner ? "HẾT GIỜ" : "KẾT QUẢ CÂU " + String(state.roundIndex + 1).padStart(2, "0")) + '</div><div class="award">' + (award.noWinner ? "0" : "+" + award.points) + '</div><h1 style="font-size:clamp(28px,5vw,62px)">' + (award.noWinner ? "Cả lớp cùng nhớ đáp án" : esc(teamName(award.teamId))) + '</h1><p class="slide-sub">' + (award.noWinner ? "Không chuyển quyền. Sang slide tiếp theo." : (ok ? "Câu trả lời đã được xác nhận." : "Không cộng điểm — sang câu tiếp theo.")) + '</p></div>'; }
      function stageScoreboard() {
        var list = scoreList(5); var max = Math.max(10, list[0] ? list[0].score : 10);
        return '<div class="slide"><div class="slide-kicker">BẢNG ĐIỂM TẠM THỜI</div><h1 style="font-size:clamp(36px,6vw,80px)">Ai đang dẫn đầu?</h1><div class="scoreboard-slide">' + list.map(function (t, i) { return '<div class="score-row"><span class="score-rank">0' + (i + 1) + '</span><div><div class="score-name">' + esc(t.name) + '</div><div class="score-bar"><i style="width:' + Math.max(4, Math.round(t.score / max * 100)) + '%"></i></div></div><span class="score-points">' + t.score + 'đ</span></div>'; }).join("") + '</div></div>';
      }
      function stageFinish() {
        var list = scoreList(3);
        return '<div class="slide"><div class="slide-kicker">KẾT THÚC · HỒ SƠ ĐÃ MỞ</div><h1 style="font-size:clamp(37px,6.3vw,90px)">Ba đội<br><em>đi xa nhất</em></h1><div class="podium"><div class="podium-col p2"><b>' + esc(list[1] ? list[1].name : "—") + '</b><div class="podium-block">02</div></div><div class="podium-col p1"><b>' + esc(list[0] ? list[0].name : "—") + '</b><div class="podium-block">01</div></div><div class="podium-col p3"><b>' + esc(list[2] ? list[2].name : "—") + '</b><div class="podium-block">03</div></div></div><p class="slide-sub">Cảm ơn các nhà điều tra của bảo tàng.</p></div>';
      }
      function stageSlide() { if (state.phase === "cover") return stageCover(); if (state.phase === "ready") return stageReady(); if (state.phase === "buzz") return stageBuzz(); if (state.phase === "question") return stageQuestion(); if (state.phase === "result") return stageResult(); if (state.phase === "scoreboard") return stageScoreboard(); return stageFinish(); }
      function stageView(compact) { return '<main class="stage-root ' + (compact ? "stage-compact" : "") + '"><header class="stage-header"><a href="#/" class="brand"><span class="brand-mark">∅</span><span class="brand-copy"><b>BẢO TÀNG KHÔNG TỒN TẠI</b><span>TRÌNH CHIẾU · PPT MODE</span></span></a><div class="stage-code">' + phaseLabel() + ' · ' + String(Math.min(state.roundIndex + 1, rounds.length)).padStart(2, "0") + '/' + String(rounds.length).padStart(2, "0") + '</div></header><section class="stage-main">' + stageSlide() + '</section><footer class="stage-footer"><span>15 ĐỘI · 1 LẦN CHỌN · 10 ĐIỂM/CÂU</span><span>F11 = TOÀN MÀN HÌNH</span></footer></main>'; }

      function teamView() {
        var id = selectedTeamId; var t = team(id); var choice = teamLocalChoice(id); var q = currentRound(); var body = "";
        if (state.phase === "buzz") {
          body = '<div class="team-round">CÂU ' + String(state.roundIndex + 1).padStart(2, "0") + ' · CHỌN MẢNH</div><h1>Chạm một<br>mảnh ghép.</h1><p>Chỉ được chọn một lần.</p><div class="team-pieces">' + [0,1,2,3].map(function (i) { return '<button class="team-piece ' + (choice === String(i) ? "selected" : "") + '" data-action="piece" data-piece="' + i + '" ' + (choice || state.claims[id] ? "disabled" : "") + '>' + pieceSvg(i, ["#69e7ff","#ffd166","#ff6b9d","#69e0ad"][i]) + '</button>'; }).join("") + '</div>' + (choice ? '<div class="team-message">Đã gửi mảnh. Nhìn màn chiếu để biết kết quả.</div>' : "");
        } else if (state.phase === "question") {
          body = '<div class="team-round">CÂU ' + String(state.roundIndex + 1).padStart(2, "0") + '</div><h1>' + (state.winnerTeam === id ? "Đội bạn<br>đang trả lời." : "Đang nghe<br>đội thắng.") + '</h1><p>' + (state.winnerTeam === id ? "Trả lời trực tiếp với MC." : "Chờ kết quả trên màn chiếu.") + '</p><div class="team-message">' + esc(q.title) + '</div>';
        } else if (state.phase === "result") {
          body = '<div class="team-round">KẾT QUẢ CÂU ' + String(state.roundIndex + 1).padStart(2, "0") + '</div><h1>' + (state.lastAward && state.lastAward.teamId === id ? "+" + state.lastAward.points + " điểm" : "Chờ<br>câu tiếp") + '</h1><p>' + (state.lastAward && state.lastAward.teamId === id ? "Điểm đã được cộng tự động." : "Nhìn màn chiếu để theo dõi BXH.") + '</p><div class="team-message">' + esc(q.title) + '</div>';
        } else if (state.phase === "finish") {
          body = '<div class="team-round">PHIÊN ĐÃ KẾT THÚC</div><h1>' + t.score + '<small style="font-size:.42em;color:var(--gold)">điểm</small></h1><p>Xem bảng xếp hạng trên màn chiếu.</p><div class="team-message">Cảm ơn đội đã tham gia.</div>';
        } else {
          body = waitSvg() + '<div class="team-round">' + (state.phase === "ready" ? "SẮP MỞ CÂU " + String(state.roundIndex + 1).padStart(2, "0") : "ĐANG CHỜ") + '</div><h1>Nhìn<br>màn chiếu.</h1><p>Khi cửa sổ mở, bốn mảnh ghép sẽ xuất hiện tại đây.</p>';
        }
        return '<main class="team-root"><section class="team-phone"><header class="team-head"><div><b>' + esc(t.name) + '</b><small>ĐỘI ' + String(id).padStart(2, "0") + '</small></div><span class="team-score">' + t.score + 'đ</span></header><div class="team-body">' + body + '</div><footer class="team-foot">BẢO TÀNG KHÔNG TỒN TẠI · ĐỪNG ĐỔI TAB</footer></section></main>';
      }
      function homeView() { return '<main class="home"><div class="home-grid"><section class="home-copy"><div class="eyebrow">PPT GAME · 15 ĐỘI · 1 LẦN CHỌN</div><h1>Bảo tàng<br><em>không tồn tại</em></h1><p>Một trò chơi sau thuyết trình được thiết kế như một bộ slide tương tác: hình ảnh dẫn đường, MC chỉ bấm tiếp, hệ thống tự khóa đội thắng và tự cộng điểm.</p><div class="home-actions"><a class="btn primary large" href="#/host">Mở bảng MC</a><a class="btn ghost large" href="#/stage">Mở màn chiếu</a></div><div class="home-note"><div><b>06</b><span>câu hỏi</span></div><div><b>15</b><span>đội chơi</span></div><div><b>10</b><span>điểm/câu</span></div></div></section><section class="museum-card" aria-label="Minh họa bảo tàng hình học"><div class="home-orbit"></div><div class="home-door"></div><i class="home-piece hp1"></i><i class="home-piece hp2"></i><i class="home-piece hp3"></i><i class="home-piece hp4"></i><div class="museum-word">NULL</div><div class="eyebrow" style="position:absolute;right:27px;bottom:25px;color:#ffffff66">EXHIBIT 00 / 404</div></section></div></main>'; }
      function bind() { document.querySelectorAll("[data-action]").forEach(function (el) { el.addEventListener("click", handleAction); }); }
      function handleAction(event) {
        var el = event.currentTarget; var action = el.getAttribute("data-action");
        if (action === "start") return startGame();
        if (action === "open") return openRound();
        if (action === "close") return closeRound();
        if (action === "grade") return grade(Number(el.getAttribute("data-points") || 0));
        if (action === "next") return advanceRound();
        if (action === "scoreboard") return showScoreboard();
        if (action === "reset") return resetGame();
        if (action === "sound") { initAudio(); mutate(function (s) { s.sound = !s.sound; }, state.sound ? "Tắt âm thanh" : "Bật âm thanh"); return; }
        if (action === "piece") return teamChoose(selectedTeamId, Number(el.getAttribute("data-piece")));
      }
      function render() {
        parseRoute();
        document.getElementById("app").innerHTML = role === "host" ? hostView() : role === "stage" ? stageView(false) : role === "team" ? teamView() : homeView();
        bind();
      }
      document.addEventListener("keydown", function (event) {
        if (role !== "host" || event.target && /input|textarea/i.test(event.target.tagName)) return;
        if (event.code === "Space") {
          event.preventDefault();
          if (state.phase === "cover") startGame(); else if (state.phase === "ready") openRound(); else if (state.phase === "buzz") closeRound(); else if (state.phase === "question") grade(10); else if (state.phase === "result" || state.phase === "scoreboard") advanceRound(); else if (state.phase === "finish") resetGame();
        }
        if (event.key === "1" && state.phase === "question") grade(10);
        if (event.key === "0" && state.phase === "question") grade(0);
      });
      setInterval(function () {
        if (role === "host" && state.phase === "buzz") { scanClaims(); if (state.phase === "buzz" && currentTime() <= 0) closeRound(); }
        if (role === "host" && state.phase === "result" && state.autoAt && Date.now() >= state.autoAt) advanceRound();
        document.querySelectorAll(".remote-timer, .timer").forEach(function (el) { if (state.phase === "buzz") el.textContent = currentTime() + "s"; });
      }, 220);
      render();
    })();
  </script>
</body>
</html>
