  function esc(v){return String(v??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]) )}function current(){return rounds[state.roundIndex]||rounds[0]}function team(id){return state.teams.find(t=>t.id===Number(id))}function rankings(){return [...state.teams].sort((a,b)=>b.score-a.score||a.number-b.number).map((t,i,a)=>({...t,rank:i?(t.score===a[i-1].score?a[i-1].rank:i+1):1}))}function chapter(){return Math.max(0,Math.min(2,Math.floor(Math.max(0,state.roundIndex)/4)))}function timeLeft(){return state.deadline?Math.max(0,state.deadline-Date.now()):0}function fmt(ms){return (Math.max(0,ms)/1000).toFixed(1)}function log(text){state.audit=[{at:Date.now(),text},...(state.audit||[])].slice(0,80)}

  function sound(type){if(!state.sound)return;try{audioCtx ||= new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();const o=audioCtx.createOscillator(),g=audioCtx.createGain(),now=audioCtx.currentTime;const freq={click:180,ring:330,correct:660,wrong:120,open:520}[type]||220;o.type=type==='wrong'?'sawtooth':'sine';o.frequency.setValueAtTime(freq,now);o.frequency.exponentialRampToValueAtTime(freq*(type==='correct'?1.6:.8),now+.22);g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(type==='ring'?.12:.07,now+.02);g.gain.exponentialRampToValueAtTime(.0001,now+.32);o.connect(g).connect(audioCtx.destination);o.start(now);o.stop(now+.35)}catch(e){}}

  function openRules(){state.phase='rules';state.practice=false;persist('Mở luật chơi')}function openPractice(){state.phase='puzzle';state.practice=true;state.roundIndex=0;state.winnerTeamId=null;state.deadline=Date.now()+15000;state.puzzleAttempts={};clearClaims();persist('Bắt đầu lượt thử · không tính điểm')}function endPractice(){state.practice=false;state.phase='rules';state.roundIndex=-1;state.winnerTeamId=null;state.deadline=null;state.puzzleAttempts={};persist('Kết thúc lượt thử')}function startGame(){state.practice=false;state.roundIndex=0;state.phase='ready';state.winnerTeamId=null;state.deadline=null;state.lastResult=null;persist('Bắt đầu chương I')}
  function clearClaims(){for(let i=1;i<=15;i++)localStorage.removeItem(`${CLAIM_PREFIX}-${state.roundIndex}-${i}`)}function openPuzzle(){if(state.roundIndex<0)state.roundIndex=0;state.phase='puzzle';state.winnerTeamId=null;state.deadline=Date.now()+15000;state.puzzleAttempts={};state.answerDraft=null;state.lastAnswer=null;state.lastResult=null;clearClaims();sound('ring');persist(`Mở mảnh ghép câu ${state.roundIndex+1}`)}function closePuzzle(noWinner=false){if(state.phase!=='puzzle')return;if(!state.winnerTeamId){scanClaims();if(state.winnerTeamId)return}state.deadline=null;if(noWinner||!state.winnerTeamId){state.phase='noWinner';state.winnerTeamId=null;log('Đóng quyền: không có đội thắng');persist()}else{state.phase='winner';persist(`Đội ${String(state.winnerTeamId).padStart(2,'0')} giành quyền`)}}
  function claim(teamId,choice){if(state.phase!=='puzzle')return;const t=team(teamId);if(!t||!t.approved){toast('Chưa được duyệt','Đội này chưa được MC kích hoạt.');return}const key=`${CLAIM_PREFIX}-${state.roundIndex}-${teamId}`;if(state.puzzleAttempts?.[teamId]||localStorage.getItem(key))return;const attempt={teamId:Number(teamId),choice:String(choice),at:performance.timeOrigin+performance.now(),nonce:Math.random().toString(36).slice(2),phase:state.roundIndex};localStorage.setItem(key,JSON.stringify(attempt));state.puzzleAttempts={...(state.puzzleAttempts||{}),[teamId]:attempt};sound('click');persist(`Đội ${String(teamId).padStart(2,'0')} đã gửi một mảnh`);toast('Đã gửi mảnh ghép','Hệ thống đang kiểm tra đáp án.')}

  function hostTeams(){return `<section class="card"><div class="panel-head"><h3>15 đội</h3><span class="eyebrow">kết nối / điểm</span></div><div class="panel-body"><div class="team-list">${state.teams.map(t=>`<div class="team-row ${t.id===state.winnerTeamId?'active':''}"><span class="num">${String(t.number).padStart(2,'0')}</span><div><b>${esc(t.name)}</b><small><i class="dot ${t.approved&&t.online?'cyan':'pink'}"></i>${t.approved&&t.online?'đã duyệt · online':t.approved?'đã duyệt · offline':'chờ duyệt'}</small></div><span class="score">${t.score}đ</span></div>`).join('')}</div></div></section>`}
  function hostAction(){const q=current();let a={title:'Sảnh chờ',desc:'Duyệt đội rồi mở phần luật. Phím H mở luật ở mọi màn hình.',label:'Mở luật chơi',action:'rules',style:'gold'};if(state.phase==='rules')a={title:'Luật đã sẵn sàng',desc:'Cho lớp xem ba bước: nhìn → chọn → khôi phục.',label:'Chạy lượt thử',action:'practice',style:'primary'};else if(state.phase==='practice')a={title:'Lượt thử · không tính điểm',desc:'Mở #/team?team=1 để thử một mảnh ghép.',label:'Mở mảnh thử',action:'practice-open',style:'gold'};else if(state.phase==='puzzle'&&state.practice)a={title:'Lượt thử đang mở',desc:`Còn <strong data-time>${fmt(timeLeft())}</strong> giây. Đội có thể thử chọn một mảnh.`,label:'Kết thúc lượt thử',action:'end-practice',style:'gold'};else if(state.phase==='ready')a={title:`Câu ${String(state.roundIndex+1).padStart(2,'0')} · ${q.room}`,desc:'Nạp căn phòng và bắt đầu cửa sổ giải mảnh 15 giây.',label:'Mở căn phòng',action:'open-puzzle',style:'primary'};else if(state.phase==='puzzle')a={title:'Đang nhận mảnh ghép',desc:`Còn <strong data-time>${fmt(timeLeft())}</strong> giây. Mỗi đội chỉ gửi một lựa chọn.`,label:'Đóng quyền',action:'close-puzzle',style:'danger'};else if(state.phase==='winner'&&state.practice)a={title:'Lượt thử đã có đáp án',desc:'Cho lớp thấy animation, sau đó quay lại luật.',label:'Kết thúc lượt thử',action:'end-practice',style:'gold'};else if(state.phase==='noWinner'&&state.practice)a={title:'Lượt thử đã kết thúc',desc:'Không có đội chọn đúng trong thời gian thử. Quay lại luật.',label:'Kết thúc lượt thử',action:'end-practice',style:'gold'};else if(state.phase==='winner')a={title:`Đội ${String(state.winnerTeamId).padStart(2,'0')} đã mở khóa`,desc:'Hệ thống đã khóa lượt còn lại. Hiện câu hỏi học tập.',label:'Mở câu hỏi',action:'show-question',style:'primary'};else if(state.phase==='noWinner')a={title:'Không có mảnh đúng',desc:'Mở câu hỏi để cả lớp cùng xem. Vòng này không có điểm.',label:'Mở câu hỏi',action:'show-question',style:'gold'};else if(state.phase==='preview')a={title:state.winnerTeamId?`Đội ${String(state.winnerTeamId).padStart(2,'0')} chuẩn bị`:'Câu ôn tập',desc:state.winnerTeamId?`Thời gian trả lời: ${q.duration} giây · tối đa 10 điểm.`:'Không có đội giữ quyền · chỉ mở lời giải.',label:state.winnerTeamId?'Bắt đầu đồng hồ':'Mở lời giải',action:state.winnerTeamId?'start-answer':'resolve-no-winner',style:'primary'};else if(state.phase==='answering')a={title:'Đội đang trả lời',desc:`Còn <strong data-time>${fmt(timeLeft())}</strong> giây. Ghi nhận khi đội chốt bằng lời.`,label:'Ghi nhận câu trả lời',action:'record-answer',style:'primary'};else if(state.phase==='recorded')a={title:'Bản trả lời đã khóa',desc:'Kiểm tra phần nhập và chấm theo đáp án/rubric bên cạnh.',label:'Chấm và công bố',action:'grade',style:'gold'};else if(state.phase==='resolved')a={title:`Đã chốt · ${state.lastResult?.points||0}/10`,desc:'Giải thích đáp án, mở BXH nếu cần, rồi nạp câu tiếp theo.',label:state.roundIndex===rounds.length-1?'Kết thúc phiên':'Nạp câu tiếp',action:state.roundIndex===rounds.length-1?'finish':'next',style:'primary'};return `<section class="card"><div class="panel-head"><h3>Hành động chính</h3><span class="eyebrow">Enter</span></div><div class="panel-body"><div class="action-main"><b>${a.title}</b><p>${a.desc}</p><button class="btn ${a.style}" data-action="${a.action}">${a.label}</button></div>${['puzzle','answering'].includes(state.phase)?`<div class="progress"><i data-progress></i></div><div class="countdown" data-time>${fmt(timeLeft())}</div>`:''}<div class="divider"></div><div class="stack"><button class="btn sm ghost block" data-action="score">BXH hiện tại</button><button class="btn sm ghost block" data-action="show-rules">? Xem luật</button></div></div></section>`}
  function hostHistory(){return `<section class="card"><div class="panel-head"><h3>Lịch sử gần đây</h3><span class="eyebrow">audit</span></div><div class="panel-body"><div class="history">${state.audit?.length?state.audit.slice(0,8).map(x=>`<div class="log"><time>${new Date(x.at).toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}</time>${esc(x.text)}</div>`).join(''):'<div class="subtle">Chưa có thao tác.</div>'}</div></div></section>`}
  function hostAnswer(q){const active=['preview','answering','recorded','resolved'].includes(state.phase)&&state.winnerTeamId;return `<section class="card"><div class="panel-head"><h3>Nhập & chấm</h3><span class="pill">${esc(q.typeName)} · ${q.duration}s · 10đ</span></div><div class="panel-body">${active?answerControls(q):'<div class="subtle">Vùng chấm mở sau khi một đội giải đúng mảnh ghép.</div>'}</div></section>`}
  function answerControls(q){const a=state.answerDraft||state.lastAnswer||emptyAnswer(q);let body='';if(q.type==='choice'||q.type==='evidence')body=`<div class="answer-buttons">${q.optionsQ.map((x,i)=>`<button class="answer-btn ${Number(a.choice)===i?'selected':''}" data-draft="choice" data-value="${i}">${String.fromCharCode(65+i)} · ${esc(x)}</button>`).join('')}</div>`;if(q.type==='binary')body=`<div class="stack">${q.statements.map((s,i)=>`<div class="toggle-row"><span>${i+1}. ${esc(s)}</span><span class="toggle-set"><button class="mini ${a.values?.[i]===true?'selected':''}" data-draft="binary" data-index="${i}" data-value="true">Đ</button><button class="mini ${a.values?.[i]===false?'selected':''}" data-draft="binary" data-index="${i}" data-value="false">S</button></span></div>`).join('')}</div>`;if(q.type==='short')body=`<input class="short-input" data-draft="short" value="${esc(a.text||'')}" placeholder="Nhập lại từ/cụm từ đội vừa nói">`;if(q.type==='order')body=`<input class="order-input" data-draft="order" value="${esc(a.order||'')}" placeholder="Ví dụ: 3-2-1">`;if(q.type==='match')body=`<input class="order-input" data-draft="match" value="${esc(a.pairs||'')}" placeholder="Ví dụ: B-C-A">`;if(q.type==='error'||q.type==='open')body=`<div class="criteria">${q.criteria.map((c,i)=>`<label class="criterion"><input type="checkbox" data-draft="criteria" data-index="${i}" ${a.criteria?.[i]?'checked':''}><span>${esc(c)} <b class="gold">+5</b></span></label>`).join('')}</div>`;return `<div class="host-answer"><div class="draft"><b>Đội ${String(state.winnerTeamId).padStart(2,'0')} · ${esc(team(state.winnerTeamId)?.name||'')}</b><br><span>${state.phase==='resolved'?'Đã công bố kết quả.':state.phase==='recorded'?'Đã ghi nhận, đang chờ chấm.':'MC nhập lựa chọn hoặc tick tiêu chí theo câu trả lời trực tiếp.'}</span></div>${body}<button class="btn ${state.phase==='recorded'?'gold':'primary'} block" data-action="${state.phase==='answering'?'record-answer':state.phase==='recorded'?'grade':'noop'}" ${state.phase==='resolved'?'disabled':''}>${state.phase==='answering'?'Ghi nhận câu trả lời':state.phase==='recorded'?'Chấm và công bố':'Đã chấm'}</button><div class="answer-note">Web tự tính điểm từ lựa chọn/rubric MC đã xác nhận.</div></div>`}
  function stagePage(){if(state.phase==='finished')return shell(finished(false),{title:'Kết quả'});return shell(`<div class="layout-2"><section class="stack"><div class="card" style="padding:10px">${stageMarkup(false)}</div></section><aside class="stack"><section class="card"><div class="panel-head"><h3>Sân khấu</h3><span class="pill"><i class="dot ${state.sound?'cyan':'pink'}"></i>${state.sound?'âm thanh bật':'âm thanh tắt'}</span></div><div class="panel-body"><div class="status"><i class="dot cyan"></i><div><b>Đồng bộ phiên</b><span>snapshot v${state.version}</span></div></div><div class="divider"></div><button class="btn ${state.sound?'ghost':'primary'} block" data-action="toggle-sound">${state.sound?'Tắt âm thanh':'Bật âm thanh sân khấu'}</button><button class="btn ghost block" data-action="score" style="margin-top:8px">Mở BXH</button><p class="subtle" style="margin-bottom:0">Sân khấu ưu tiên hình ảnh; luật nằm trong nút “?”.</p></div></section><section class="card"><div class="panel-head"><h3>Hành trình</h3></div><div class="panel-body stack"><div class="status"><span class="gold mono">I</span><div><b>Nhìn thấy</b><span>Câu 01–04 · ánh sáng</span></div></div><div class="status"><span class="cyan mono">II</span><div><b>Đối chiếu</b><span>Câu 05–07 · hồ sơ</span></div></div><div class="status"><span class="pink mono">III</span><div><b>Suy luận</b><span>Câu 08–10 · cửa cuối</span></div></div></div></section></aside></div>`,{title:'Màn hình sân khấu'})}
  function stageMarkup(compact=false){const q=current();const chapterIdx=chapter();let content='';if(state.phase==='lobby')content=`<div class="stage-center"><div class="eyebrow">MUSEUM ENTRY</div><div class="signal-copy gold">Mời 15 đội<br>vào bảo tàng</div><div class="subtle">Mã phiên <b class="gold mono">${esc(state.joinCode)}</b> · MC mở phòng điều khiển</div></div>`;else if(state.phase==='rules')content=`<div class="stage-center"><div class="eyebrow">BA ĐỘNG TÁC</div><div class="signal-copy">NHÌN<br>→ CHỌN<br>→ KHÔI PHỤC</div><div class="subtle">Mỗi câu chỉ có một lần giành quyền. Không có đấu phụ.</div></div>`;else if(state.phase==='practice')content=`<div class="stage-center"><div class="eyebrow">LƯỢT THỬ · 0 ĐIỂM</div><div class="signal-copy cyan">Tìm mảnh<br>còn thiếu</div><div class="scene-orb" style="position:relative;left:auto;top:auto;margin:25px auto"></div><div class="subtle">Điện thoại chỉ chọn mảnh ghép. Câu hỏi được trả lời trực tiếp với MC.</div></div>`;else if(state.phase==='ready')content=`<div class="stage-center"><div class="eyebrow">${esc(q.room)}</div><div class="signal-copy gold">CĂN PHÒNG<br>ĐANG NẠP</div><div class="subtle">Các đội nhìn mô hình và chờ bốn mảnh xuất hiện.</div></div>`;else if(state.phase==='puzzle')content=puzzlePublic(q,compact);else if(state.phase==='winner')content=`<div class="stage-center"><div class="eyebrow">MẢNH GHÉP ĐÃ KHÓA</div><div class="scene-toast">Căn phòng đã nhận ra đội đúng</div><div class="signal-copy cyan">ĐỘI ${String(state.winnerTeamId).padStart(2,'0')}<br>ĐÃ MỞ CỬA</div><div class="subtle">${esc(team(state.winnerTeamId)?.name||'')} · MC chuẩn bị câu hỏi.</div></div>`;else if(['preview','answering','recorded','resolved','noWinner'].includes(state.phase))content=questionPublic(q);else if(state.phase==='scoreboard')content=`<div class="stage-center"><div class="eyebrow">LIVE RANKING</div><div class="signal-copy gold">BẢNG XẾP HẠNG<br>ĐANG SÁNG</div></div>`;else content=`<div class="stage-center"><div class="signal-copy gold">HỒ SƠ ĐÃ MỞ</div><div class="subtle">Cánh cửa cuối cùng đang mở.</div></div>`;return `<div class="stage chapter-${chapterIdx+1}"><div class="scene-floor"></div><div class="scene-grid"></div><div class="scene-orb"></div><div class="artifact"><div class="shadow"></div><div class="statue"></div><div class="base"></div></div><div class="scene-door"></div><div class="stage-top"><div><div class="eyebrow">${esc(chapters[chapterIdx])}</div><h2>Bảo tàng không tồn tại</h2></div><div style="text-align:right"><div class="round-no">CÂU ${String(Math.max(0,state.roundIndex)+1).padStart(2,'0')} / ${rounds.length}</div><span class="pill">${esc(phaseText[state.phase]||state.phase)}</span></div></div><div class="stage-content">${content}</div>${!compact&&!['lobby','rules','practice','finished'].includes(state.phase)?`<div class="stage-bottom">${scoreStrip()}</div>`:''}</div>`}
  function puzzlePublic(q,compact=false){return `<div class="puzzle-card"><div class="puzzle-top"><div><div class="eyebrow">${esc(q.room)} · MẢNH GHÉP</div><h3>Khôi phục căn phòng</h3></div><span class="pill"><i class="dot gold"></i><span data-time>${fmt(timeLeft())}</span>s</span></div><div class="puzzle-question">${esc(q.puzzlePrompt)}</div><div class="puzzle-options">${q.options.map((o,i)=>piece(q.kind,o,i,false)).join('')}</div><div class="puzzle-foot"><span class="puzzle-hint">Mỗi đội chỉ chọn một lần · đáp án sai sẽ khóa đội ở vòng này.</span><span class="eyebrow">${compact?'MÀN HÌNH MC':'CHỌN TRÊN ĐIỆN THOẠI'}</span></div></div>`}
  function piece(kind,o,i,selected=false){const colors=['#64e5d1','#ff7ab8','#9b8cff','#f2cf7a'];const c=colors[i%4];let art='';if(kind==='light'||kind==='bridge')art=`<svg viewBox="0 0 140 72"><path d="M18 58L60 14l62 33" fill="none" stroke="#ffffff30" stroke-width="5"/><path d="M18 58L${kind==='light'&&i===2?'60 14':'49 48'}" fill="none" stroke="${c}" stroke-width="8" stroke-linecap="round"/><circle cx="18" cy="58" r="7" fill="#f2cf7a"/><circle cx="122" cy="47" r="7" fill="#64e5d1"/></svg>`;else if(kind==='shadow')art=`<svg viewBox="0 0 140 72"><ellipse cx="70" cy="55" rx="48" ry="9" fill="#0008"/><path d="M53 53L61 20l20-7 14 15-12 25z" fill="${i===1?'#ff7ab8':'#9b8cff'}" stroke="#fff6" stroke-width="2"/><path d="M92 53h33" stroke="${c}" stroke-width="4" stroke-linecap="round"/></svg>`;else if(kind==='clock'||kind==='pattern')art=`<svg viewBox="0 0 140 72"><circle cx="70" cy="36" r="24" fill="#0b1730" stroke="${c}" stroke-width="4"/><path d="M70 36L70 20M70 36L84 43" stroke="#f2cf7a" stroke-width="4" stroke-linecap="round"/><path d="M23 36h20M97 36h20" stroke="#fff4" stroke-width="2"/></svg>`;else art=`<svg viewBox="0 0 140 72"><path d="M42 61V17h56v44" fill="${i===0?'#64e5d122':'#9b8cff16'}" stroke="${c}" stroke-width="3"/><path d="M52 29h36M52 39h23M52 49h31" stroke="#ffffff55" stroke-width="3"/><circle cx="88" cy="39" r="3" fill="#f2cf7a"/></svg>`;return `<div class="piece ${selected?'selected':''}"><div class="piece-art">${art}</div><b>${esc(o[0])} · ${esc(o[1])}</b><small>${esc(o[2])}</small></div>`}
  function questionPublic(q){const winner=team(state.winnerTeamId);const reveal=state.phase==='resolved';let body='';if(q.type==='choice'||q.type==='evidence')body=`<div class="public-options">${q.optionsQ.map((x,i)=>`<div class="public-option"><span class="option-key">${String.fromCharCode(65+i)}</span><span>${esc(x)}</span></div>`).join('')}</div>`;if(q.type==='binary')body=`<div class="stack">${q.statements.map((x,i)=>`<div class="public-option"><span class="option-key">${i+1}</span><span>${esc(x)}</span></div>`).join('')}</div>`;if(q.type==='order')body=`<div class="public-options">${q.items.map((x,i)=>`<div class="public-option"><span class="option-key">${i+1}</span><span>${esc(x)}</span></div>`).join('')}</div><div class="answer-note">Nói thứ tự bằng số, ví dụ 3 – 2 – 1.</div>`;if(q.type==='match')body=`<div class="public-options">${q.labels.map((x,i)=>`<div class="public-option"><span class="option-key">${i+1}</span><span>${esc(x)}</span></div>`).join('')}</div><div class="answer-note">Ghép theo dạng 1B, 2C, 3A.</div>`;if(q.type==='short')body='<div class="question-evidence">Đội nói một từ hoặc cụm từ ngắn. MC nhập lại sau khi đội chốt.</div>';if(q.type==='error'||q.type==='open')body='<div class="question-evidence">Câu trả lời mở · đội giải thích trực tiếp. MC đánh dấu hai tiêu chí sau khi ghi nhận.</div>';return `<div class="question-card"><div class="question-head"><span class="question-type">${esc(q.typeName)} · ${q.duration}s</span><span class="eyebrow">TỐI ĐA 10 ĐIỂM</span></div><h3>${esc(q.prompt)}</h3>${q.evidence?`<div class="question-evidence"><b class="violet">BẰNG CHỨNG</b><br>${esc(q.evidence)}</div>`:''}${body}<div class="answer-note"><span>${winner?`Đội ${String(winner.number).padStart(2,'0')} · ${esc(winner.name)} đang giữ quyền.`:'Không có đội giữ quyền · câu này dùng để ôn tập.'}</span>${reveal&&state.lastResult?`<strong class="${state.lastResult.points?'cyan':'pink'}" style="float:right">+${state.lastResult.points} điểm</strong>`:''}</div>${reveal?`<div class="divider"></div><div class="question-evidence"><b class="gold">LỜI GIẢI</b><br>${esc(q.explanation)}</div>`:''}</div>`}
  function scoreStrip(){return `<div class="score-strip">${rankings().map(t=>`<div class="score-chip ${t.id===state.winnerTeamId?'active':''}"><div style="display:flex;justify-content:space-between"><b>${String(t.number).padStart(2,'0')}</b><small>#${t.rank}</small></div><strong>${esc(t.name)}</strong><small>${t.score}đ</small></div>`).join('')}</div>`}
  function teamPage(id){id=Math.max(1,Math.min(15,id));ensureTeamOnline(id);const t=team(id);const claim=state.puzzleAttempts?.[id];const canClaim=state.phase==='puzzle'&&!claim&&!state.winnerTeamId&&t?.approved;let title='Chờ căn phòng',desc='Nhìn màn hình lớn. Mảnh ghép sẽ xuất hiện ở đây.',button='CHỜ',cls='';if(state.phase==='puzzle'){title='Mảnh ghép đã xuất hiện';desc=claim?'Đã gửi. Chờ hệ thống kiểm tra.':'Chọn mảnh đúng một lần.';button=claim?'ĐÃ GỬI':'CHỌN MẢNH';cls=claim?'':'ready'}else if(state.phase==='winner'&&state.winnerTeamId===id){title='Đội bạn đã mở cửa';desc='Nhìn màn hình lớn để nghe câu hỏi. Trả lời trực tiếp với MC.';button='ĐÃ GIÀNH QUYỀN';cls='ready'}else if(state.phase==='winner'){title='Đã có đội mở cửa';desc=`Đội ${String(state.winnerTeamId).padStart(2,'0')} đang trả lời.`;button='ĐÃ KHÓA'}else if(state.phase==='answering'||state.phase==='preview'){title='Theo dõi câu hỏi';desc=state.winnerTeamId===id?'Đội bạn đang trả lời trực tiếp.':'Đội khác đang trả lời.';button='NHÌN MÀN CHIẾU'}else if(state.phase==='resolved'){title=`+${state.lastResult?.points||0} điểm`;desc='Kết quả đã cập nhật. Cùng xem BXH.';button='ĐÃ KHÔI PHỤC';cls='ready'}else if(state.phase==='practice'){title='Lượt thử';desc='Khi nút sáng, chọn mảnh bất kỳ để thử.';button='LƯỢT THỬ';cls='ready'}return shell(`<div class="team-view"><div class="page-heading"><div><div class="eyebrow">ĐỘI CHƠI / ĐIỆN THOẠI</div><h1>${esc(t?.name||'Đội '+id)}</h1></div><p class="subtle">Điện thoại chỉ dùng giành quyền. Câu trả lời nói trực tiếp với MC.</p></div><div class="team-picker">${state.teams.map(x=>`<a class="team-chip ${x.id===id?'active':''}" href="#/team?team=${x.id}">Đội ${String(x.id).padStart(2,'0')}</a>`).join('')}</div><div class="phone-wrap"><div class="phone-screen"><div class="notch"></div><div class="phone-head"><div><div class="eyebrow">MUSEUM LINK</div><h2>Đội ${String(id).padStart(2,'0')}</h2></div><span class="pill"><i class="dot ${t?.online?'cyan':'pink'}"></i>${t?.online?'online':'offline'}</span></div><div class="phone-status"><b>${esc(title)}</b><span>${esc(desc)}</span></div><div class="phone-main"><div class="phone-sculpture"></div><h3>${esc(button)}</h3><p>${state.phase==='puzzle'?'Mảnh đúng đầu tiên sẽ mở quyền. Bấm nhầm sẽ khóa đội ở vòng này.':'Mở màn hình sân khấu để theo dõi hành trình.'}</p><button class="claim-btn ${cls}" data-team-claim="${id}" ${canClaim?'':'disabled'}>${canClaim?'CHỌN MẢNH':'ĐANG CHỜ'}</button>${state.phase==='puzzle'&&!claim?`<div class="subtle">Khi bấm, chọn A/B/C/D trong hộp xác nhận.</div>`:''}</div><div class="phone-score"><div class="stat"><small>Tổng điểm</small><b>${t?.score||0}</b></div><div class="stat"><small>Hạng hiện tại</small><b>#${rankings().find(x=>x.id===id)?.rank||'—'}</b></div></div></div></div></div>`,{title:`Điện thoại đội ${String(id).padStart(2,'0')}`})}
  function teamPickGrid(q,id,claim){
    if(state.phase!=='puzzle')return '';
    return `<div class="team-pick-grid">${q.options.map(o=>`<button class="team-pick" data-team-pick="${id}" data-choice="${esc(o[0])}" ${claim?'disabled':''}><div class="pick-art">${piece(q.kind,o,0).replace(/^<div[^>]*><div class="piece-art">/,'').replace(/<\/div><b>[\s\S]*$/,'')}</div><b>${esc(o[0])} · ${esc(o[1])}</b><small>${claim?'Đã khóa':'Chọn mảnh này'}</small></button>`).join('')}</div>`;
  }
  function teamPageVisual(id){
    id=Math.max(1,Math.min(15,id));ensureTeamOnline(id);const t=team(id),q=current();let claim=state.puzzleAttempts?.[id];if(!claim&&state.phase==='puzzle'){try{const raw=localStorage.getItem(`${CLAIM_PREFIX}-${state.roundIndex}-${id}`);if(raw)claim=JSON.parse(raw)}catch(e){}}
    const can=state.phase==='puzzle'&&!claim&&!state.winnerTeamId&&t?.approved;
    let title='Chờ căn phòng',desc='Nhìn màn hình lớn. Mảnh ghép sẽ xuất hiện ở đây.',status='CHỜ';
    if(state.phase==='puzzle'){title='Mảnh ghép đã xuất hiện';desc=claim?'Đã gửi. Chờ hệ thống kiểm tra.':'Chọn một mảnh đúng một lần.';status=claim?'ĐÃ GỬI':'CHỌN MẢNH'}
    else if(state.phase==='winner'&&state.winnerTeamId===id){title='Đội bạn đã mở cửa';desc='Nhìn màn hình lớn để nhận câu hỏi. Trả lời trực tiếp với MC.';status='ĐÃ GIÀNH QUYỀN'}
    else if(state.phase==='winner'){title='Đã có đội mở cửa';desc=`Đội ${String(state.winnerTeamId).padStart(2,'0')} đang trả lời.`;status='ĐÃ KHÓA'}
    else if(state.phase==='preview'||state.phase==='answering'){title='Theo dõi câu hỏi';desc=state.winnerTeamId===id?'Đội bạn đang trả lời trực tiếp.':'Đội khác đang trả lời.';status='NHÌN MÀN CHIẾU'}
    else if(state.phase==='resolved'){title=`+${state.lastResult?.points||0} điểm`;desc='Kết quả đã cập nhật. Cùng xem BXH.';status='ĐÃ KHÔI PHỤC'}
    else if(state.phase==='practice'){title='Lượt thử';desc='Chọn một mảnh bất kỳ để kiểm tra giao diện.';status='LƯỢT THỬ'}
    const picks=can||claim?teamPickGrid(q,id,!!claim):'';
    return shell(`<div class="team-view"><div class="page-heading"><div><div class="eyebrow">ĐỘI CHƠI / ĐIỆN THOẠI</div><h1>${esc(t?.name||'Đội '+id)}</h1></div><p class="subtle">Điện thoại chỉ dùng giành quyền. Câu trả lời nói trực tiếp với MC.</p></div><div class="team-picker">${state.teams.map(x=>`<a class="team-chip ${x.id===id?'active':''}" href="#/team?team=${x.id}">Đội ${String(x.id).padStart(2,'0')}</a>`).join('')}</div><div class="phone-wrap"><div class="phone-screen"><div class="notch"></div><div class="phone-head"><div><div class="eyebrow">MUSEUM LINK</div><h2>Đội ${String(id).padStart(2,'0')}</h2></div><span class="pill"><i class="dot ${t?.online?'cyan':'pink'}"></i>${t?.online?'online':'offline'}</span></div><div class="phone-status"><b>${esc(title)}</b><span>${esc(desc)}</span></div><div class="phone-main"><div class="phone-sculpture"></div><h3>${esc(status)}</h3><p>${state.phase==='puzzle'?'Bốn mảnh khác nhau. Chọn đúng mảnh trước các đội khác.':'Mở màn hình sân khấu để theo dõi hành trình.'}</p>${picks||'<div class="subtle">Nút chọn sẽ sáng khi căn phòng mở.</div>'}</div><div class="phone-score"><div class="stat"><small>Tổng điểm</small><b>${t?.score||0}</b></div><div class="stat"><small>Hạng hiện tại</small><b>#${rankings().find(x=>x.id===id)?.rank||'—'}</b></div></div></div></div></div>`,{title:`Điện thoại đội ${String(id).padStart(2,'0')}`});
  }
  function finished(isHost){return `<div class="card pad" style="max-width:1000px;margin:auto"><div class="eyebrow">FINAL EXHIBIT · SESSION CLOSED</div><h1 style="font:700 clamp(40px,6vw,82px)/.9 'Space Grotesk';letter-spacing:-.07em;margin:14px 0">Hồ sơ đã mở.</h1><p class="subtle" style="max-width:600px">Bảo tàng trở lại im lặng. Đây là bảng điểm cuối của ${rounds.length} căn phòng.</p><div class="museum-hero" style="min-height:245px;margin:22px 0 18px">${heroMuseum()}</div><div class="rank-table">${rankings().map((t,i)=>`<div class="rank-row ${i<3?'top':''}"><span class="rank-no">#${t.rank}</span><div><strong>${esc(t.name)}</strong><small> · ${t.answers} câu · ${t.perfect} trọn điểm</small></div><span class="rank-points">${t.score}đ</span><small>${t.online?'online':'offline'}</small><small>Đội ${String(t.number).padStart(2,'0')}</small></div>`).join('')}</div><div class="finish-actions"><a class="btn ghost" href="#/">Về trang đầu</a></div></div>`}
  function modalMarkup(){if(state.modal==='scoreboard')return `<div class="overlay" role="dialog"><div class="overlay-inner"><div class="overlay-head"><div><div class="eyebrow">LIVE SCOREBOARD · ${state.roundIndex+1}/${rounds.length} CĂN PHÒNG</div><h2>Ai đang nhìn thấy nhiều hơn?</h2></div><button class="btn ghost" data-action="close-modal">Đóng</button></div><div class="podium">${rankings().slice(0,3).map(t=>`<div class="podium-card"><b>#${t.rank}</b><span>${esc(t.name)}</span><small>${t.score} điểm</small></div>`).join('')}</div><div class="rank-table">${rankings().map(t=>`<div class="rank-row ${t.rank<=3?'top':''}"><span class="rank-no">#${t.rank}</span><div><strong>${esc(t.name)}</strong><small>Đội ${String(t.number).padStart(2,'0')} · ${t.answers} câu</small></div><span class="rank-points">${t.score}đ</span><small>${t.perfect} trọn điểm</small><small>${t.online?'● online':'○ offline'}</small></div>`).join('')}</div><div class="podium-note">Bằng điểm vẫn đồng hạng. BXH lấy từ tổng điểm đã chốt; không dùng tốc độ bấm để phá hòa.</div></div></div>`;if(state.modal==='rules')return `<div class="overlay" role="dialog"><div class="overlay-inner rule-modal"><div class="overlay-head"><div><div class="eyebrow">RULES / H</div><h2>Ba động tác.</h2></div><button class="btn ghost" data-action="close-modal">Đóng</button></div><p>Nhìn mô hình trên màn hình lớn. Chọn một mảnh trên điện thoại khi căn phòng mở. Hệ thống nhận lựa chọn đúng đầu tiên, khóa quyền và mở câu hỏi. Đội thắng trả lời trực tiếp với MC; MC chấm trên bảng điều khiển, web tự cộng điểm.</p><div class="rule-grid"><div class="rule-card"><b>1 · NHÌN</b><span>Cùng một câu đố hình ảnh, bốn mảnh lựa chọn. Mỗi đội chỉ gửi một mảnh.</span></div><div class="rule-card"><b>2 · CHỌN</b><span>Chọn đúng đầu tiên được quyền. Chọn sai mất quyền vòng đó. Không đấu phụ, không chuyển quyền.</span></div><div class="rule-card"><b>3 · KHÔI PHỤC</b><span>Trả lời tối đa 10 điểm. Sai/hết giờ: 0 và sang câu mới. Đồng điểm cuối: đồng hạng.</span></div></div></div></div>`;return `<div class="overlay" role="dialog"><div class="overlay-inner rule-modal"><div class="overlay-head"><div><div class="eyebrow">INTRO / LIVE</div><h2>Khách mời của bảo tàng</h2></div><button class="btn ghost" data-action="close-modal">Đóng</button></div><p style="font-size:16px;color:var(--ink)">“Có những căn phòng chỉ xuất hiện khi bạn nhìn đủ lâu. Mười lăm đội, mười căn phòng, một mảnh ghép đúng. Hãy nhìn trước khi trả lời — vì trong bảo tàng này, điều trống rỗng có thể là manh mối quan trọng nhất.”</p><button class="btn primary" data-action="close-modal">Bắt đầu khám phá</button></div></div>`}
  function bind(){document.querySelectorAll('[data-action]').forEach(el=>el.addEventListener('click',()=>{const a=el.dataset.action;if(a==='show-rules'){state.modal='rules';render();return}if(a==='close-modal'){closeModal();return}if(a==='approve'){approveAll();return}if(a==='intro'){state.modal='intro';render();sound('open');return}if(a==='toggle-sound'){state.sound=!state.sound;persist(state.sound?'Bật âm thanh sân khấu':'Tắt âm thanh sân khấu');sound('click');return}if(a==='reset'){reset();return}if(a==='score'){openScore();return}if(a==='noop')return;if(a==='practice-open'){openPractice();return}if(a==='end-practice'){endPractice();return}const map={rules:openRules,practice:openPractice,'start-game':startGame,'open-puzzle':openPuzzle,'close-puzzle':()=>closePuzzle(true),'show-question':showQuestion,'start-answer':startAnswer,'record-answer':recordAnswer,grade,resolveNoWinner,next:nextRound,finish:nextRound};if(map[a])map[a]() }));document.querySelectorAll('[data-draft]').forEach(el=>{const type=el.dataset.draft;if(el.tagName==='INPUT'&&(type==='short'||type==='order'||type==='match'))el.addEventListener('input',()=>chooseDraft(type,el.value));else if(type==='criteria')el.addEventListener('change',()=>chooseDraft(type,'',Number(el.dataset.index)));else el.addEventListener('click',()=>{chooseDraft(type,el.dataset.value,Number(el.dataset.index||0));render()})});document.querySelectorAll('[data-title]').forEach(el=>el.addEventListener('change',()=>{state.title=el.value.slice(0,80);persist('Đổi tên phiên')}));document.querySelectorAll('[data-team-pick]').forEach(el=>el.addEventListener('click',()=>claim(Number(el.dataset.teamPick),el.dataset.choice)));}
  function updateLive(){if(!['puzzle','answering'].includes(state.phase))return;const left=timeLeft();document.querySelectorAll('[data-time]').forEach(el=>el.textContent=fmt(left));document.querySelectorAll('[data-progress]').forEach(el=>{const total=state.phase==='puzzle'?15000:current().duration*1000;el.style.width=Math.max(0,Math.min(100,(left/total)*100))+'%'});if(state.phase==='puzzle')scanClaims();if(left<=0){if(state.phase==='puzzle')closePuzzle(true);else if(state.phase==='answering'){state.phase='recorded';state.deadline=null;state.lastAnswer=JSON.parse(JSON.stringify(state.answerDraft||{}));log('Hết giờ · MC xác nhận bản trả lời');persist('Hết giờ trả lời')}}}
  document.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='h'){state.modal=state.modal?'':'rules';render()}if(e.key==='Escape'&&state.modal){state.modal=null;render()}if(e.key==='Enter'&&route.path==='/host'&&!e.target.matches('input,textarea,select,button'))document.querySelector('[data-action]:not([data-action="show-rules"]):not([data-action="score"])')?.click()});
  ticker=setInterval(()=>{if(state.phase==='puzzle')scanClaims();if(['puzzle','answering'].includes(state.phase))updateLive()},120);render();
  </script>
</body>
</html>
