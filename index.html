    function finishedPage(isHost) {
      return `${pageHeading('Hồ sơ 404 đã mở', 'Phiên đã khóa. Kết quả hiện tại lấy từ cùng một nguồn chấm và các điều chỉnh có lịch sử.', 'KẾT THÚC / FINAL')}<section class="card pad"><div class="finish-art"><div class="finish-door"></div></div><div class="empty-state" style="min-height:260px"><div><div class="eyebrow">THE FRONT DOOR IS OPEN</div><h2>Không còn cuộc gọi nào.</h2><p class="subtle">Đây là kết quả của 15 đội. Bằng điểm vẫn đồng hạng; không có câu phụ phá hòa.</p><div class="finish-actions">${isHost ? '<button class="btn gold" data-action="show-scoreboard">Mở bảng kết quả</button><button class="btn ghost" data-action="download-csv">Xuất CSV</button><button class="btn ghost" data-action="download-json">Xuất JSON</button>' : '<button class="btn ghost" data-action="show-scoreboard">Xem BXH</button>'}</div></div></div></section>`;
    }

    function bind() {
      document.querySelectorAll('[data-action]').forEach(el => el.addEventListener('click', handleClick));
      document.querySelectorAll('[data-session-title]').forEach(el => el.addEventListener('input', e => { state.title = e.target.value; saveLocalOnly(); }));
      document.querySelectorAll('[data-answer-input]').forEach(el => el.addEventListener('input', e => { state.draft.text = e.target.value; saveLocalOnly(); }));
      document.querySelectorAll('[data-pair-index]').forEach(el => el.addEventListener('change', e => { state.draft.pairs[e.target.dataset.pairIndex] = e.target.value; saveState(); render(); }));
      document.querySelectorAll('[data-criterion-index]').forEach(el => el.addEventListener('change', e => { const i=Number(e.target.dataset.criterionIndex); if(e.target.checked&&!state.draft.criteria.includes(i)) state.draft.criteria.push(i); if(!e.target.checked) state.draft.criteria=state.draft.criteria.filter(x=>x!==i); saveState(); render(); }));
    }

    function handleClick(e) {
      const el = e.currentTarget; const action = el.dataset.action; const id = Number(el.dataset.team || selectedTeamId); const q = currentQuestion();
      if (action === 'home') return navigate('#/');
      if (action === 'rules-home') { currentRole='home'; renderRulesInHome(); return; }
      if (action === 'create-room') return navigate('#/host');
      if (action === 'join-room') return navigate(`#/team?team=${selectedTeamId}`);
      if (action === 'toggle-motion') return mutate(s => { s.reducedMotion = !s.reducedMotion; }, state.reducedMotion ? 'Bật lại chuyển động' : 'Bật chế độ giảm chuyển động');
      if (action === 'toggle-sound' || action === 'stage-sound') { if (!state.soundEnabled) initAudio(); return mutate(s => { s.soundEnabled = !s.soundEnabled; }, state.soundEnabled ? 'Tắt âm thanh sân khấu' : 'Bật âm thanh sân khấu'); }
      if (action === 'run-intro') { initAudio(); if (currentRole === 'host' && 'speechSynthesis' in window && !state.introPlayed) { window.speechSynthesis.cancel(); const utterance = new SpeechSynthesisUtterance(INTRO_TEXT); utterance.lang='vi-VN'; utterance.rate=.92; window.speechSynthesis.speak(utterance); } return mutate(s => { s.introPlayed=true; }, 'Chạy lời mở đầu · âm thanh chỉ ở cửa sổ sân khấu'); }
      if (action === 'copy-code') { navigator.clipboard?.writeText(state.joinCode); return toast('Đã sao chép', 'Mã phiên 404404 đã nằm trong clipboard.'); }
      if (action === 'reset-demo') { if (!window.confirm('Khởi tạo lại demo sẽ xóa điểm và lịch sử trong trình duyệt này. Tiếp tục?')) return; state=initialState(); saveState(); render(); return toast('Đã khởi tạo lại', 'Phiên demo quay về sảnh chờ.'); }
      if (action === 'approve-all') return mutate(s => { s.teams.forEach(t => { t.approved=true; t.online=true; }); }, 'Duyệt 15 đội demo');
      if (action === 'go-rules') return mutate(s => { s.phase='rules'; }, 'Mở màn luật chơi');
      if (action === 'go-practice') return mutate(s => { s.phase='practice'; }, 'Mở lượt thử không điểm');
      if (action === 'start-game') return beginRound(0);
      if (action === 'start-round') return beginRound(state.currentIndex);
      if (action === 'arm-round') return armRound();
      if (action === 'skip-armed') return openWaiting();
      if (action === 'open-buzz') return openBuzz();
      if (action === 'close-buzz') return noWinner();
      if (action === 'show-question') return showQuestion();
      if (action === 'start-answering') return startAnswering();
      if (action === 'record-answer') return recordAnswer();
      if (action === 'grade-answer') return gradeAnswer();
      if (action === 'resolve-no-winner') return mutate(s => { s.phase='resolved'; s.noWinner=true; s.deadline=null; }, 'Đóng câu không có winner · 0 điểm');
      if (action === 'next-question') return beginRound(state.currentIndex + 1);
      if (action === 'finish-game') return finishGame();
      if (action === 'void-round') return voidRound();
      if (action === 'show-scoreboard') return mutate(s => { s.previousPhase=s.phase; s.phase='scoreboard'; }, 'Mở bảng xếp hạng');
      if (action === 'close-scoreboard') return mutate(s => { s.phase=s.previousPhase || 'resolved'; s.previousPhase=null; }, 'Đóng bảng xếp hạng');
      if (action === 'download-csv') return exportCSV();
      if (action === 'download-json') return exportJSON();
      if (action === 'select-team') { selectedTeamId=id; return navigate(`#/team?team=${id}`); }
      if (action === 'team-buzz') return teamBuzz(id);
      if (action === 'pick-option') return mutate(s => { s.draft.selected=el.dataset.value; }, `MC chọn đáp án ${el.dataset.value}`);
      if (action === 'toggle-statement') return mutate(s => { s.draft.statements[Number(el.dataset.index)] = el.dataset.value === 'true'; }, `MC ghi nhận nhận định ${Number(el.dataset.index)+1}`);
      if (action === 'toggle-order') return mutate(s => { const i=Number(el.dataset.index); const pos=s.draft.order.indexOf(i); if(pos>=0)s.draft.order.splice(pos,1); else s.draft.order.push(i); }, 'MC cập nhật thứ tự thẻ');
      if (action === 'adjust-score') return adjustScore();
    }

    function renderRulesInHome() {
      document.getElementById('app').innerHTML = `${topbar()}<main class="page wrap">${rulesPage()}</main>`; bind();
    }
    function beginRound(index) {
      if (index >= questions.length) return finishGame();
      mutate(s => { s.currentIndex=index; s.phase='ready'; s.winnerTeamId=null; s.earlyTeams=[]; s.deadline=null; s.noWinner=false; s.draft=emptyDraft(); s.signalName=['BÓNG NGƯỜI ĐI NGANG','TIẾNG GÕ KHÔNG NGƯỜI','ĐƯỜNG DÂY LỖI'][index % 3]; }, `Nạp câu ${String(index+1).padStart(2,'0')} · ${questions[index].typeName}`);
    }
    function armRound() { cue('countdown'); mutate(s => { s.phase='armed'; s.deadline=Date.now()+3000; }, 'Phát đếm ngược 3–2–1'); }
    function openWaiting() { mutate(s => { s.phase='waiting'; s.deadline=Date.now()+5000; }, 'Mở giai đoạn chờ tín hiệu'); cue('fake'); }
    function openBuzz() { cue('ring'); mutate(s => { s.phase='buzz-open'; s.deadline=Date.now()+8000; }, 'Xác nhận tín hiệu thật · mở quyền bắt máy'); }
    function noWinner() { cue('timeout'); mutate(s => { s.phase='no-winner'; s.deadline=null; s.winnerTeamId=null; s.noWinner=true; }, 'Đóng quyền · không có kết nối hợp lệ'); }
    function showQuestion() { cue('pickup'); mutate(s => { s.phase='preview'; s.deadline=null; }, state.noWinner ? 'Mở câu ôn tập không điểm' : `Mở đề cho đội ${String(state.winnerTeamId).padStart(2,'0')}`); }
    function startAnswering() { if (!state.winnerTeamId) return; cue('question'); mutate(s => { s.phase='answering'; s.deadline=Date.now()+currentQuestion().duration*1000; }, 'Bắt đầu đồng hồ trả lời'); }
    function recordAnswer() { cue('record'); mutate(s => { s.phase='recorded'; s.deadline=null; s.recordedAt=Date.now(); }, 'Khóa câu trả lời đội vừa chốt'); }
    function gradeAnswer() {
      if (!state.winnerTeamId) return;
      const q=currentQuestion(), d=state.draft; let points=0; let parts=[];
      if (q.type === 'A' || q.type === 'G') { const ok=d.selected===q.correct; points=ok?10:0; parts=[{label:'Đáp án',points:points,max:10,ok}]; }
      if (q.type === 'B') { q.correct.forEach((correct,i)=>{ const ok=d.statements[i]===correct; const p=ok?5:0; points+=p; parts.push({label:`Nhận định ${i+1}`,points:p,max:5,ok}); }); }
      if (q.type === 'C') { const ok=JSON.stringify(d.order)===JSON.stringify(q.correctOrder); points=ok?10:0; parts=[{label:'Thứ tự',points,max:10,ok}]; }
      if (q.type === 'D') { q.correctPairs.forEach((correct,i)=>{ const ok=d.pairs[i]===correct; const p=ok?2:0; points+=p; parts.push({label:`Cặp ${i+1}`,points:p,max:2,ok}); }); }
      if (q.type === 'E' || q.type === 'H') { q.criteria.forEach((_,i)=>{ const ok=d.criteria.includes(i); const p=ok?5:0; points+=p; parts.push({label:`Tiêu chí ${i+1}`,points:p,max:5,ok}); }); }
      if (q.type === 'F') { const normalized=normalize(d.text); const ok=q.accepted.some(a=>normalize(a)===normalized); points=ok?10:0; parts=[{label:'Cụm từ',points,max:10,ok}]; }
      const existing=state.results.findIndex(r=>r.questionId===q.id);
      const result={ id:`${q.id}-${state.winnerTeamId}`, questionId:q.id, questionNumber:state.currentIndex+1, teamId:state.winnerTeamId, points, max:10, parts, response:structuredClone(d), at:Date.now(), revision:existing>=0 ? state.results[existing].revision+1 : 1 };
      mutate(s => { if(existing>=0) s.results[existing]=result; else s.results.push(result); s.phase='resolved'; s.deadline=null; s.lastResult=result; const t=s.teams.find(x=>x.id===s.winnerTeamId); if(t){t.answered++; if(points===10)t.full++;} }, `Chốt câu ${String(state.currentIndex+1).padStart(2,'0')} · ${points}/10 điểm`); cue(points >= 10 ? 'correct' : points > 0 ? 'partial' : 'wrong');
    }
    function normalize(text) { return String(text || '').normalize('NFC').trim().toLocaleLowerCase('vi-VN').replace(/\s+/g,' '); }
    function finishGame() { cue('outro'); mutate(s => { s.phase='finished'; s.deadline=null; s.winnerTeamId=null; }, 'Khóa phiên · mở cửa khách sạn'); }
    function voidRound() { mutate(s => { s.phase='resolved'; s.noWinner=true; s.deadline=null; s.results=s.results.filter(r=>r.questionId!==currentQuestion().id); }, `Hủy câu ${String(state.currentIndex+1).padStart(2,'0')} do sự cố kỹ thuật`); }
    function adjustScore() {
      const amount=Number(document.querySelector('[data-adjustment]')?.value); const reason=document.querySelector('[data-adjustment-reason]')?.value.trim();
      if(!Number.isFinite(amount)||!reason) return toast('Chưa lưu điều chỉnh','Nhập số điểm chênh lệch và lý do.');
      mutate(s => { s.adjustments.push({id:`adj-${Date.now()}`,teamId:s.winnerTeamId,amount,reason,questionId:currentQuestion().id,at:Date.now()}); }, `Điều chỉnh ${amount > 0 ? '+' : ''}${amount} điểm · ${reason}`);
    }
    function teamBuzz(id) {
      const t=team(id); if(!t || !t.approved || !t.online) return toast('Thiết bị chưa sẵn sàng','Đội này chưa được MC duyệt hoặc đang offline.');
      if(state.phase === 'practice') { cue('pickup'); return toast('Lượt thử thành công',`Đội ${String(id).padStart(2,'0')} đã thử nút. Không tính vào thống kê.`); }
      if(state.phase === 'waiting') return mutate(s => { if(!s.earlyTeams.includes(id)) s.earlyTeams.push(id); const x=s.teams.find(t=>t.id===id); if(x)x.early=true; }, `Đội ${String(id).padStart(2,'0')} bấm sớm · khóa câu hiện tại`);
      if(state.phase !== 'buzz-open') return;
      if(state.earlyTeams.includes(id) || state.winnerTeamId) return;
      cue('pickup'); mutate(s => { if(s.winnerTeamId) return; s.winnerTeamId=id; s.phase='winner-locked'; s.deadline=null; const x=s.teams.find(t=>t.id===id); if(x){x.holds++;x.early=false;} }, `Đội ${String(id).padStart(2,'0')} đã bắt máy · winner nguyên tử`);
    }

    function tick() {
      if(!state.deadline) { updateLiveBits(); return; }
      if(Date.now() < state.deadline) { updateLiveBits(); return; }
      if(currentRole !== 'host') { updateLiveBits(); return; }
      if(state.phase === 'armed') return openWaiting();
      if(state.phase === 'waiting') return openBuzz();
      if(state.phase === 'buzz-open') return noWinner();
      if(state.phase === 'answering') return mutate(s => { s.phase='recorded'; s.deadline=null; s.timedOut=true; }, 'Hết giờ · chuyển sang kiểm tra câu trả lời');
    }
    function updateLiveBits() {
      document.querySelectorAll('[data-live="deadline"]').forEach(el => el.textContent=showTime());
      document.querySelectorAll('[data-progress]').forEach(el => { const duration=state.phase==='answering' ? currentQuestion().duration*1000 : state.phase==='buzz-open' ? 8000 : state.phase==='waiting' ? 5000 : 3000; const remaining=state.deadline ? Math.max(0,state.deadline-Date.now()) : 0; el.style.width=`${Math.max(0,Math.min(100,(1-remaining/duration)*100))}%`; });
    }

    function initAudio() { try { if(!window.__audioCtx) window.__audioCtx=new (window.AudioContext||window.webkitAudioContext)(); if(window.__audioCtx.state==='suspended')window.__audioCtx.resume(); } catch (_) {} }
    function cue(kind) {
      if(currentRole !== 'stage' || !state.soundEnabled) return;
      initAudio(); const ctx=window.__audioCtx; if(!ctx)return; activeAudio.forEach(n=>{try{n.stop()}catch(_){}}); activeAudio=[];
      const now=ctx.currentTime; const notes={ring:[440,550,440,660],pickup:[330,495],correct:[523,659,784],partial:[392,523],wrong:[220,174],timeout:[220,160],countdown:[220,220,220],fake:[170],question:[550],record:[440],outro:[330,440,554]}; const values=notes[kind]||[440];
      values.forEach((freq,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type=kind==='wrong'?'sine':'triangle';o.frequency.value=freq;g.gain.setValueAtTime(.0001,now+i*.13);g.gain.exponentialRampToValueAtTime(.1,now+i*.13+.02);g.gain.exponentialRampToValueAtTime(.0001,now+i*.13+.12);o.connect(g).connect(ctx.destination);o.start(now+i*.13);o.stop(now+i*.13+.14);activeAudio.push(o);});
    }
    function playTransitionCue(previous, next) {
      if (currentRole !== 'stage' || previous.phase === next.phase) return;
      const byPhase = { armed:'countdown', waiting:'fake', 'buzz-open':'ring', 'winner-locked':'pickup', preview:'question', answering:'question', recorded:'record', 'no-winner':'timeout', finished:'outro' };
      if (next.phase === 'resolved' && next.lastResult) return cue(next.lastResult.points >= 10 ? 'correct' : next.lastResult.points > 0 ? 'partial' : 'wrong');
      if (byPhase[next.phase]) cue(byPhase[next.phase]);
    }

    function exportCSV() {
      const rows=[['Đội','Tên đội','Tổng điểm','Hạng','Số lần giữ quyền','Câu trọn điểm','Điểm từng câu'],...rankings().map(t=>[t.number,t.name,t.score,t.rank,t.holds,t.full,state.results.filter(r=>r.teamId===t.id).map(r=>`${r.questionNumber}:${r.points}`).join(' | ')])]; download('room404-results.csv','\uFEFF'+rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n'),'text/csv;charset=utf-8'); toast('Đã xuất CSV','Bảng điểm lấy từ kết quả hiện hành và lịch sử điều chỉnh.');
    }
    function exportJSON() { download('room404-results.json',JSON.stringify({session:{id:state.sessionId,title:state.title,joinCode:state.joinCode,status:state.phase},teams:rankings(),results:state.results,adjustments:state.adjustments,audit:state.audit},null,2),'application/json'); toast('Đã xuất JSON','Tệp kết quả đã sẵn sàng.'); }
    function download(name, content, type) { const blob=new Blob([content],{type}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(url),500); }
    function toast(title, text='') { const region=document.getElementById('toastRegion'); if(!region)return; const el=document.createElement('div'); el.className='toast'; el.innerHTML=`<b>${esc(title)}</b>${esc(text)}`; region.appendChild(el); setTimeout(()=>el.remove(),3200); }

    render();
  </script>
</body>
