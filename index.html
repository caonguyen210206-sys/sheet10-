<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070a10"><title>Cuộc gọi từ phòng 404</title><style>
@import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&family=DM+Mono:wght@500&display=swap');
:root{--ink:#f6f1e6;--muted:#aeb6c6;--gold:#f3c978;--mint:#72e3c4;--red:#ff727c;--panel:#111722e8;--line:#ffffff1a}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#070a10;color:var(--ink);font-family:'Be Vietnam Pro',sans-serif}button,input,select{font:inherit}button{color:inherit}.hidden{display:none!important}body:before{content:"";position:fixed;inset:0;background:linear-gradient(90deg,#06090fe8,#070a1080 55%,#070a1030),url('assets/room404-hotel.webp') center/cover no-repeat;z-index:-3}body:after{content:"";position:fixed;inset:0;background:radial-gradient(circle at 78% 35%,transparent,#0007 72%);z-index:-2;pointer-events:none}.host{display:grid;grid-template-rows:auto 1fr auto;min-height:100vh}.top{height:68px;padding:0 26px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:#080b12dc;backdrop-filter:blur(16px)}.brand{display:flex;align-items:center;gap:13px}.mark{width:42px;height:42px;border:1px solid #f3c97866;display:grid;place-items:center;color:var(--gold);font:800 15px 'DM Mono';transform:rotate(-3deg)}.brand b{display:block;letter-spacing:.08em;font-size:13px}.brand small{color:var(--muted)}.actions{display:flex;gap:8px;align-items:center}.btn{border:1px solid var(--line);background:#171d29e8;border-radius:11px;padding:10px 14px;font-weight:700;cursor:pointer;transition:.18s}.btn:hover{transform:translateY(-1px);border-color:#f3c97888;background:#202737}.btn.gold{background:var(--gold);color:#15100a}.btn.mint{background:var(--mint);color:#07130f}.btn.red{border-color:#ff727c88;color:#ffbbc0}.btn:disabled{opacity:.4;cursor:not-allowed}.kbd{border:1px solid #ffffff26;background:#ffffff0b;border-radius:6px;padding:2px 6px;font:11px 'DM Mono';color:var(--muted)}

.question{width:min(980px,100%);background:#0b1019eb;border:1px solid #f3c97844;border-radius:20px;padding:24px 26px;box-shadow:0 24px 60px #0008;backdrop-filter:blur(10px)}.q-meta{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.question h2{font-size:clamp(24px,3vw,38px);line-height:1.25;margin:16px 0 20px}.options{display:grid;grid-template-columns:1fr 1fr;gap:10px}.option{display:flex;align-items:center;gap:12px;min-height:62px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#202838df}.option i{font-style:normal;width:34px;height:34px;border:1px solid #f3c97877;border-radius:9px;display:grid;place-items:center;color:var(--gold);font:800 14px 'DM Mono';flex:0 0 auto}.evidence{padding:13px 16px;border-left:3px solid var(--gold);background:#f3c9780c;line-height:1.65;margin-bottom:14px}.solution{margin-top:16px;padding:14px 17px;border-radius:12px;background:#72e3c415;border:1px solid #72e3c444}.solution b{color:var(--mint)}.result{display:inline-flex;gap:9px;align-items:center;margin-top:15px;padding:9px 14px;border-radius:99px;background:#0007;font-weight:800}.result strong{font:800 21px 'DM Mono';color:var(--gold)}
.side{display:flex;flex-direction:column;gap:11px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;backdrop-filter:blur(15px)}.panel-title{padding:13px 15px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.panel-title b{font-size:13px}.score-list{padding:7px;max-height:calc(100vh - 245px);overflow:auto}.score-row{display:grid;grid-template-columns:27px 1fr auto;gap:8px;align-items:center;padding:7px;border-radius:9px}.score-row.active{background:#f3c97815}.score-row .rank{font:800 12px 'DM Mono';color:var(--gold)}.score-row span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}.score-row strong{font:800 14px 'DM Mono'}.progress{padding:14px}.bar{height:7px;background:#ffffff10;border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--mint));transition:.4s}.progress small{display:flex;justify-content:space-between;margin-top:8px;color:var(--muted)}
.dock{min-height:94px;border-top:1px solid var(--line);background:#080b12ef;backdrop-filter:blur(18px);padding:13px 24px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:17px}.dock b{display:block;font-size:15px}.dock span{color:var(--muted);font-size:12px}.timer{font:800 33px 'DM Mono';color:var(--gold);min-width:68px;text-align:center}.timer.danger{color:var(--red)}.team-picker{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:22px;max-width:620px}.team-btn{padding:13px 8px;background:#151c29df;border:1px solid #ffffff25;border-radius:11px;cursor:pointer;font:800 21px 'DM Mono'}.team-btn:hover{background:var(--mint);color:#07130f}.editor{margin-top:14px}.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.choice{padding:11px;text-align:left;border:1px solid var(--line);background:#151c29;border-radius:9px;cursor:pointer}.choice.selected{border-color:var(--gold);background:#f3c97818}.toggle-row,.criterion{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px;border-bottom:1px solid var(--line)}.tiny{padding:6px 9px}.input,select{width:100%;background:#0a0e15;color:var(--ink);border:1px solid #ffffff25;border-radius:9px;padding:10px}.order-grid{display:grid;gap:7px}.order-item{display:grid;grid-template-columns:32px 1fr;gap:8px;text-align:left}.order-item .pos{color:var(--gold)}
.modal{position:fixed;inset:0;z-index:50;background:#03050add;display:grid;place-items:center;padding:20px;backdrop-filter:blur(15px)}.modal-card{width:min(850px,100%);max-height:88vh;overflow:auto;background:#111722;border:1px solid #f3c97855;border-radius:22px;padding:26px;box-shadow:0 30px 100px #000}.modal-head{display:flex;justify-content:space-between;align-items:center}.rules-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin:21px 0}.rule{padding:17px;border:1px solid var(--line);border-radius:13px;background:#ffffff05}.rule strong{font:800 34px 'DM Mono';color:var(--gold);display:block;margin-bottom:12px}.rule b{display:block}.rule p{font-size:13px;color:var(--muted);line-height:1.6}.shortcuts{display:grid;grid-template-columns:1fr 1fr;gap:8px}.shortcuts div{display:flex;justify-content:space-between;padding:9px 11px;background:#ffffff05;border-radius:9px;color:var(--muted)}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.board-row{padding:13px;border:1px solid var(--line);border-radius:11px;background:#ffffff06;display:grid;grid-template-columns:36px 1fr auto;align-items:center;gap:9px}.board-row.top{border-color:#f3c97855}.board-row strong:last-child{color:var(--gold);font:800 19px 'DM Mono'}
.stage{min-height:100vh;padding:10px}.stage .scene{min-height:calc(100vh - 20px)}.stage .scene-body{min-height:calc(100vh - 105px)}.stage .question{width:min(1150px,100%)}.score-strip{position:absolute;z-index:3;left:18px;right:18px;bottom:13px;display:grid;grid-template-columns:repeat(15,1fr);gap:4px}.chip{background:#080c13e8;border:1px solid #ffffff15;border-radius:7px;text-align:center;padding:5px 2px}.chip b{font:800 12px 'DM Mono';display:block}.chip small{color:var(--gold);font:10px 'DM Mono'}.stage-tools{position:fixed;right:18px;top:18px;z-index:20;display:flex;gap:7px}.toast{position:fixed;right:20px;bottom:105px;z-index:80;background:#171e2b;border:1px solid #f3c97855;border-radius:11px;padding:11px 15px;box-shadow:0 15px 50px #000;animation:toast .25s}@keyframes ring{to{transform:rotate(5deg) translateY(-4px)}}@keyframes toast{from{transform:translateY(10px);opacity:0}}
@media(max-width:1000px){.main{grid-template-columns:1fr}.side{display:none}.options,.choice-grid{grid-template-columns:1fr}.brand small,.desktop{display:none}.rules-grid,.board{grid-template-columns:1fr}.team-picker{grid-template-columns:repeat(3,1fr)}}@media(max-width:600px){.main{padding:7px}.scene-body{padding:20px}.hero h1{font-size:51px}.dock{grid-template-columns:1fr;padding:11px 14px}.question{padding:16px}.stage{padding:0}.stage .scene{border-radius:0;min-height:100vh}.score-strip{display:none}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head><body><div id="app"><div class="host"><header class="top"><div class="brand"><div class="mark">404</div><div><b>CUỘC GỌI TỪ PHÒNG 404</b><small>Đang mở bảng điều khiển…</small></div></div></header><main class="main" style="grid-template-columns:1fr"><section class="scene"><div class="scene-body"><div class="hero"><div class="eyebrow">Đêm trực · 23:04</div><h1>Cuộc gọi từ<br><em>phòng 404</em></h1><p>Đang tải trò chơi. Nếu màn hình không xuất hiện sau vài giây, hãy tải lại trang.</p></div></div></section></main></div></div><div id="overlay"></div><div id="toast"></div><script>
const KEY='room404-v3',CHANNEL='room404-live-v3';
    const questions = [
      { id:'D01', type:'A', typeName:'Chìa khóa đúng', duration:20, prompt:'Sau bước Ghi nhận, nhóm điều tra phải làm gì?', options:['Kết luận ngay.','Đối chiếu một nguồn độc lập.','Xóa hồ sơ gốc.','Chọn lời kể gây chú ý nhất.'], correct:'B', explanation:'Quy trình yêu cầu đối chiếu với một nguồn độc lập trước khi kết luận.', cue:'Tờ giấy đầu tiên trong hồ sơ đang tự lật.' },
      { id:'D02', type:'B', typeName:'Hai dòng camera', duration:25, prompt:'Đánh giá hai nhận định sau về nguyên tắc Ghi nhận.', statements:['“Tôi nghe thấy ba tiếng gõ cửa” là ghi nhận trực tiếp.','Khi hai nguồn mâu thuẫn, nên bỏ ngay nguồn khác với dự đoán ban đầu.'], correct:[true,false], explanation:'Nhận định đầu mô tả điều nghe trực tiếp. Khi mâu thuẫn, phải giữ cả hai nguồn và đánh dấu chưa xác minh.', cue:'Camera hành lang vừa bật sáng.' },
      { id:'D03', type:'F', typeName:'Mã khóa bị thiếu', duration:20, prompt:'Khi nguồn tin mâu thuẫn và chưa kiểm tra được, hồ sơ mang trạng thái ______.', accepted:['chưa xác minh','chưa được xác minh'], explanation:'“Chưa xác minh” là trạng thái đúng khi chưa đủ căn cứ kết luận.', cue:'Một con dấu đỏ hiện trên mép hồ sơ.' },
      { id:'D04', type:'A', typeName:'Ví dụ phù hợp', duration:20, prompt:'Ví dụ nào phù hợp nhất với bước Ghi nhận?', options:['Có lẽ ai đó đã đi qua hành lang.','Tôi nghe thấy ba tiếng gõ lúc 23 giờ.','Chắc chắn người gõ là khách phòng 404.','Nguồn kể này đáng tin hơn camera.'], correct:'B', explanation:'Ghi nhận chỉ mô tả dữ kiện trực tiếp nhìn hoặc nghe thấy, không thêm suy đoán.', cue:'Bản ghi âm cũ phát ra một tiếng click.' },
      { id:'D05', type:'E', typeName:'Nhật ký có lỗi', duration:30, prompt:'“Hai nhân chứng kể khác nhau, vì vậy nhóm xóa một lời kể để hồ sơ thống nhất.” Hãy chỉ ra lỗi và cách sửa.', criteria:['Chỉ ra việc xóa một lời kể để loại mâu thuẫn là sai.','Giữ cả hai, đánh dấu chưa xác minh và tiếp tục kiểm tra.'], explanation:'Mâu thuẫn không phải lý do để xóa nguồn. Hai thông tin phải được giữ lại để đối chiếu tiếp.', cue:'Mực trên trang giấy bắt đầu nhòe.' },
      { id:'D06', type:'C', typeName:'Băng ghi âm', duration:30, prompt:'Sắp xếp ba bước của quy trình điều tra theo thứ tự đúng.', items:['Kết luận','Ghi nhận','Đối chiếu'], correctOrder:[1,2,0], explanation:'Cần ghi nhận dữ kiện, đối chiếu nguồn độc lập, rồi mới kết luận.', cue:'Ba thẻ hồ sơ rơi xuống bàn.' },
      { id:'D07', type:'D', typeName:'Ghép hồ sơ', duration:40, prompt:'Ghép mỗi thuật ngữ với mô tả phù hợp.', labels:['Ghi nhận','Đối chiếu','Kết luận','Chưa xác minh','Hồ sơ gốc'], matches:['Trạng thái cần kiểm tra tiếp','Kiểm tra với nguồn độc lập','Tài liệu để truy lại thông tin ban đầu','Mô tả trực tiếp điều nhìn/nghe','Nhận định sau khi kiểm tra'], correctPairs:['D','B','E','A','C'], explanation:'Mỗi thuật ngữ có một chức năng riêng trong quá trình điều tra.', cue:'Năm chiếc chìa khóa va vào nhau.' },
      { id:'D08', type:'G', typeName:'Quan sát bằng chứng', duration:25, prompt:'Từ bản ghi âm sau, điều nào được xác nhận trực tiếp?', evidence:'Nhật ký trực đêm: “Lúc 23 giờ, tôi nghe ba tiếng gõ ở cửa phòng 404. Tôi chưa nhìn thấy ai ngoài hành lang.”', options:['Có một người đứng ngoài cửa.','Có ba tiếng gõ được nghe thấy.','Phòng 404 có khách lưu trú.','Người gõ cửa đã rời khách sạn.'], correct:'B', explanation:'Lời ghi âm chỉ xác nhận điều người trực đã nghe; người đó chưa nhìn thấy ai.', cue:'Băng cassette tự dừng ở đúng giây thứ chín.' },
      { id:'D09', type:'B', typeName:'Ứng dụng nguyên tắc', duration:25, prompt:'Hai phát biểu sau đúng hay sai?', statements:['Có thể ghi “camera cho thấy cửa đóng” nếu hình ảnh thật sự cho thấy cửa đóng.','Có thể đổi “tôi đoán có người” thành “có người” để hồ sơ ngắn hơn.'], correct:[true,false], explanation:'Phát biểu đầu là mô tả bằng chứng. Phát biểu sau biến suy đoán thành sự thật nên không được chấp nhận.', cue:'Đèn camera chuyển sang màu đỏ.' },
      { id:'D10', type:'E', typeName:'Sửa hồ sơ', duration:30, prompt:'Một nhóm viết: “Vì lời kể và camera mâu thuẫn, camera chắc chắn sai.” Hãy chấm hai tiêu chí.', criteria:['Chỉ ra lỗi: kết luận một nguồn sai chỉ vì hai nguồn mâu thuẫn.','Sửa thành: giữ cả hai nguồn, đánh dấu chưa xác minh và đối chiếu thêm.'], explanation:'Mâu thuẫn là tín hiệu cần kiểm tra, không phải bằng chứng đủ để loại một nguồn.', cue:'Một dòng chữ bị gạch đỏ trong hồ sơ.' },
      { id:'D11', type:'A', typeName:'Tình huống ngắn', duration:20, prompt:'Một lời kể nói cửa mở, camera cho thấy cửa đóng. Lựa chọn nào phù hợp nhất?', options:['Xóa lời kể.','Xóa video.','Giữ cả hai và đánh dấu chưa xác minh.','Chọn nguồn nghe có vẻ hợp lý hơn.'], correct:'C', explanation:'Giữ cả hai nguồn giúp nhóm truy lại mâu thuẫn và kiểm tra thêm.', cue:'Khóa cửa phòng 404 rung nhẹ.' },
      { id:'D12', type:'C', typeName:'Xử lý tình huống', duration:30, prompt:'Sắp xếp các hành động để xử lý hai nguồn mâu thuẫn.', items:['Kết luận nguồn nào đúng.','Giữ cả hai thông tin.','Đối chiếu thêm nguồn độc lập.','Đánh dấu trạng thái chưa xác minh.'], correctOrder:[1,3,2,0], explanation:'Không được kết luận trước khi giữ dữ liệu, đánh dấu trạng thái và đối chiếu thêm.', cue:'Hồ sơ thứ hai xuất hiện dưới ngăn kéo.' },
      { id:'D13', type:'G', typeName:'Bằng chứng camera', duration:25, prompt:'Bảng camera ghi 23:00 — cửa đóng; 23:02 — cửa vẫn đóng. Kết luận nào có căn cứ?', evidence:'CAM-04 / 23:00: CỬA ĐÓNG\nCAM-04 / 23:02: CỬA ĐÓNG', options:['Cửa chắc chắn không từng mở trước 23:00.','Trong hai thời điểm ghi nhận, camera cho thấy cửa đóng.','Có người đã khóa cửa từ bên trong.','Người kể đã nói dối.'], correct:'B', explanation:'Chỉ được kết luận trong phạm vi hai thời điểm mà camera ghi nhận.', cue:'Màn hình camera lóe lên hai khung hình.' },
      { id:'D14', type:'H', typeName:'Hai lời khai', duration:40, prompt:'Camera ghi cửa đóng lúc 23 giờ nhưng một người kể rằng cửa mở. Bạn xử lý hồ sơ thế nào và vì sao?', criteria:['Giữ cả hai thông tin, đánh dấu chưa xác minh và đối chiếu thêm.','Giải thích rằng mâu thuẫn chưa đủ để kết luận một nguồn sai.'], explanation:'Đáp án tốt phải vừa nêu cách giữ và kiểm tra thông tin, vừa giải thích giới hạn của bằng chứng hiện có.', cue:'Hai chiếc bóng đứng ở hai đầu hành lang.' },
      { id:'D15', type:'H', typeName:'Mở hồ sơ 404', duration:40, prompt:'Đề xuất một cách xử lý khi nhân chứng và camera cho thông tin khác nhau, rồi giải thích.', criteria:['Đưa ra hành động phù hợp: giữ nguồn, đánh dấu chưa xác minh, hoặc đối chiếu thêm.','Giải thích được vì sao chưa thể biến suy đoán thành sự thật.'], explanation:'Câu trả lời vận dụng cần có hành động kiểm chứng và lý do dựa trên giới hạn của dữ liệu.', cue:'Ổ khóa cuối cùng đang chờ người giải mã.' }
    ];

const names=['Mực Tím','Bóng Đèn','Mắt Mèo','Chìa Khóa','Gió Hành Lang','Đèn Đỏ','Kẻ Gõ Cửa','Hồ Sơ Mật','Tiếng Rè','Đồng Hồ Câm','Bậc Thang','Bóng Dài','Người Trực Đêm','Gương Mờ','Phòng Cuối'];
const labels={setup:'Sảnh khách sạn',ready:'Sẵn sàng',countdown:'Chuẩn bị tín hiệu',claim:'Giành quyền',question:'Đã mở hồ sơ',answering:'Đang trả lời',review:'Kiểm tra câu trả lời',result:'Kết quả',finished:'Kết thúc'};
const empty=()=>({selected:'',truth:[null,null],order:[],pairs:{},criteria:[],text:''});
const fresh=()=>({version:1,phase:'setup',index:0,winner:null,deadline:null,results:[],answer:empty(),sound:false,last:null,returnPhase:null});
let state=load(),role=location.hash==='#stage'?'stage':'host',channel;
try{channel=new BroadcastChannel(CHANNEL);channel.onmessage=e=>receive(e.data)}catch(_){channel=null}
addEventListener('storage',e=>{if(e.key===KEY&&e.newValue)receive(JSON.parse(e.newValue))});
addEventListener('hashchange',()=>{role=location.hash==='#stage'?'stage':'host';render()});
addEventListener('keydown',e=>{
  if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement?.tagName))return;
  if(e.key.toLowerCase()==='r')toggleRules();
  if(e.key.toLowerCase()==='s')toggleScores();
  if(e.key.toLowerCase()==='m')toggleSound();
  if(e.key.toLowerCase()==='f')toggleFullscreen();
  if(e.key.toLowerCase()==='v'&&role==='host')openStage();
  if(e.key==='Escape')closeOverlay();
  if(e.key==='Enter'&&role==='host')document.querySelector('[data-primary]')?.click();
});
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(!s||!labels[s.phase]||!Array.isArray(s.results)||!s.answer||s.index<0||s.index>14)return fresh();return s}catch(_){return fresh()}}
function save(message=''){state.version++;localStorage.setItem(KEY,JSON.stringify(state));channel?.postMessage(state);render();if(message)toast(message)}
function receive(next){if(!next||next.version<state.version)return;state=next;localStorage.setItem(KEY,JSON.stringify(state));render()}
function q(){return questions[state.index]}
function score(id){return state.results.filter(r=>r.teamId===id).reduce((n,r)=>n+r.points,0)}
function rankings(){return names.map((name,i)=>({id:i+1,name,score:score(i+1)})).sort((a,b)=>b.score-a.score||a.id-b.id).map((t,i,a)=>({...t,rank:i&&t.score===a[i-1].score?a[i-1].rank:i+1}))}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function time(){return state.deadline?Math.max(0,Math.ceil((state.deadline-Date.now())/1000)):0}
function chapter(){return Math.min(3,Math.floor(state.index/5)+1)}
function render(){document.body.className=state.phase==='claim'?'claim':'';document.getElementById('app').innerHTML=role==='stage'?stageView():hostView();bind()}
function top(){return `<header class="top"><div class="brand"><div class="mark">404</div><div><b>CUỘC GỌI TỪ PHÒNG 404</b><small>${labels[state.phase]} · Hồi ${chapter()}</small></div></div><div class="actions"><span class="desktop"><span class="kbd">R</span> Luật &nbsp; <span class="kbd">S</span> BXH</span><button class="btn" data-action="stage">Mở màn chiếu ↗</button><button class="btn" data-action="sound">${state.sound?'Âm thanh: Bật':'Âm thanh: Tắt'}</button></div></header>`}
function hostView(){return `<div class="host">${top()}<main class="main"><section>${scene(true)}</section><aside class="side">${progressPanel()}${scorePanel()}</aside></main>${dock()}</div>`}
function stageView(){return `<div class="stage"><div class="stage-tools"><button class="btn" data-action="host">Bảng MC</button><button class="btn" data-action="fullscreen">Toàn màn hình</button></div>${scene(false)}</div>`}
function scene(host){let body='';const question=q(),winner=state.winner?names[state.winner-1]:'';
  if(state.phase==='setup')body=`<div class="hero"><div class="eyebrow">Đêm trực · 23:04</div><h1>Cuộc gọi từ<br><em>phòng 404</em></h1><p>15 đội điều tra. Một đường dây bí ẩn. Mỗi câu trả lời đúng sẽ khôi phục một phần hồ sơ.</p></div>`;
  if(state.phase==='ready')body=`<div class="hero"><div class="eyebrow">${esc(question.cue)}</div><div class="big">Hồ sơ ${String(state.index+1).padStart(2,'0')}<br>đang chờ</div><div class="phone"></div></div>`;
  if(state.phase==='countdown')body=`<div class="hero"><div class="eyebrow">Tất cả đội chuẩn bị</div><div class="count" data-time>${time()}</div><p>Chỉ chọn đội sau khi tín hiệu 404 xuất hiện.</p></div>`;
  if(state.phase==='claim')body=`<div class="hero"><div class="eyebrow">Tín hiệu thật</div><div class="big mint">PHÒNG 404<br>— BẮT MÁY —</div><div class="phone"></div>${host?teamPicker():`<p>MC đang xác nhận đội giành quyền.</p>`}</div>`;
  if(['question','answering','review','result'].includes(state.phase))body=questionView(question,host,winner);
  if(state.phase==='finished')body=`<div class="hero"><div class="eyebrow">Hồ sơ cuối cùng đã được mở</div><div class="big mint">CỬA CHÍNH<br>ĐÃ MỞ</div><p>Nhấn <span class="kbd">S</span> để xem bảng xếp hạng chung cuộc.</p></div>`;
  const strip=role==='stage'&&!['setup','finished'].includes(state.phase)?scoreStrip():'';
  return `<div class="scene"><div class="scene-head"><div class="eyebrow">Hồi ${chapter()} · ${['Nhận tín hiệu','Lần theo dấu vết','Mở hồ sơ 404'][chapter()-1]}</div><div class="round">${state.phase==='setup'?'15 ĐỘI':`CÂU ${String(state.index+1).padStart(2,'0')} / 15`}</div></div><div class="scene-body">${body}</div>${strip}</div>`}
function questionView(x,host,winner){let body='';
  if(['A','G'].includes(x.type))body=`<div class="options">${x.options.map((v,i)=>`<div class="option"><i>${'ABCD'[i]}</i><span>${esc(v)}</span></div>`).join('')}</div>`;
  if(x.type==='B')body=`<div class="options">${x.statements.map((v,i)=>`<div class="option"><i>${i+1}</i><span>${esc(v)}</span></div>`).join('')}</div>`;
  if(x.type==='C')body=`<div class="options">${x.items.map((v,i)=>`<div class="option"><i>${i+1}</i><span>${esc(v)}</span></div>`).join('')}</div>`;
  if(x.type==='D')body=`<div class="options">${x.labels.map((v,i)=>`<div class="option"><i>${i+1}</i><span>${esc(v)}</span></div>`).join('')}${x.matches.map((v,i)=>`<div class="option"><i>${'ABCDE'[i]}</i><span>${esc(v)}</span></div>`).join('')}</div>`;
  if(['E','F','H'].includes(x.type))body=`<div class="evidence">Đội trả lời trực tiếp với MC. MC ghi nhận câu trả lời ở màn điều khiển.</div>`;
  const reveal=state.phase==='result';
  return `<div class="question"><div class="q-meta"><span>${esc(x.typeName)} · ${x.duration} giây</span><span>${state.winner?`Đội ${String(state.winner).padStart(2,'0')} · ${esc(winner)}`:'Không có đội giành quyền'}</span></div><h2>${esc(x.prompt)}</h2>${x.evidence?`<div class="evidence">${esc(x.evidence).replace(/\n/g,'<br>')}</div>`:''}${body}${host&&['answering','review'].includes(state.phase)?editor(x):''}${reveal?`<div class="solution"><b>LỜI GIẢI</b><br>${esc(x.explanation)}</div><div class="result">Kết quả <strong>${state.last?.points||0}/10</strong></div>`:''}</div>`}
function editor(x){const a=state.answer;let html='';
  if(['A','G'].includes(x.type))html=`<div class="choice-grid">${x.options.map((v,i)=>{const k='ABCD'[i];return `<button class="choice ${a.selected===k?'selected':''}" data-action="pick" data-value="${k}"><b>${k}.</b> ${esc(v)}</button>`}).join('')}</div>`;
  if(x.type==='B')html=x.statements.map((v,i)=>`<div class="toggle-row"><span>${i+1}. ${esc(v)}</span><span><button class="btn tiny ${a.truth[i]===true?'gold':''}" data-action="truth" data-index="${i}" data-value="true">Đúng</button> <button class="btn tiny ${a.truth[i]===false?'gold':''}" data-action="truth" data-index="${i}" data-value="false">Sai</button></span></div>`).join('');
  if(x.type==='C')html=`<div class="order-grid">${x.items.map((v,i)=>{const pos=a.order.indexOf(i);return `<button class="choice order-item ${pos>=0?'selected':''}" data-action="order" data-index="${i}"><span class="pos">${pos>=0?pos+1:'—'}</span><span>${esc(v)}</span></button>`}).join('')}</div>`;
  if(x.type==='D')html=x.labels.map((v,i)=>`<div class="toggle-row"><span>${i+1}. ${esc(v)}</span><select data-pair="${i}"><option value="">—</option>${'ABCDE'.split('').map(k=>`<option ${a.pairs[i]===k?'selected':''}>${k}</option>`).join('')}</select></div>`).join('');
  if(['E','H'].includes(x.type))html=x.criteria.map((v,i)=>`<label class="criterion"><span>${esc(v)}</span><input type="checkbox" data-criterion="${i}" ${a.criteria.includes(i)?'checked':''}></label>`).join('');
  if(x.type==='F')html=`<input class="input" data-text value="${esc(a.text)}" placeholder="Nhập từ/cụm từ đội vừa nói">`;
  return `<div class="editor"><div class="eyebrow">MC ghi nhận câu trả lời</div>${html}</div>`}
function teamPicker(){return `<div class="team-picker">${names.map((_,i)=>`<button class="team-btn" data-action="winner" data-team="${i+1}">${String(i+1).padStart(2,'0')}</button>`).join('')}</div>`}
function progressPanel(){return `<section class="panel progress"><div class="eyebrow">Tiến độ hồ sơ</div><div class="bar"><i style="width:${state.phase==='finished'?100:(state.index/15*100)}%"></i></div><small><span>${state.results.length} câu đã chấm</span><span>${Math.round(state.index/15*100)}%</span></small></section>`}
function scorePanel(){return `<section class="panel"><div class="panel-title"><b>BẢNG ĐIỂM</b><span class="kbd">S</span></div><div class="score-list">${rankings().map(t=>`<div class="score-row ${state.winner===t.id?'active':''}"><span class="rank">#${t.rank}</span><span>${String(t.id).padStart(2,'0')} · ${esc(t.name)}</span><strong>${t.score}</strong></div>`).join('')}</div></section>`}
function scoreStrip(){return `<div class="score-strip">${rankings().sort((a,b)=>a.id-b.id).map(t=>`<div class="chip"><b>${String(t.id).padStart(2,'0')}</b><small>${t.score}</small></div>`).join('')}</div>`}
function dock(){let title='',sub='',button='',timer='';
  if(state.phase==='setup'){title='Sẵn sàng bắt đầu đêm trực?';sub='Mở màn chiếu trước, sau đó bắt đầu câu 01.';button=`<button class="btn gold" data-action="start" data-primary>Bắt đầu trò chơi →</button>`}
  if(state.phase==='ready'){title=`Câu ${String(state.index+1).padStart(2,'0')} đã sẵn sàng`;sub='Nhấn Enter để phát đếm ngược và mở quyền.';button=`<button class="btn gold" data-action="signal" data-primary>Phát tín hiệu 404</button>`}
  if(state.phase==='countdown'){title='Đang đếm ngược';sub='Hệ thống sẽ tự mở quyền sau 3 giây.';timer=`<div class="timer" data-time>${time()}</div>`}
  if(state.phase==='claim'){title='Chọn đội giành quyền';sub='Nhấn số đội ngay trên màn hình. Hết 8 giây sẽ đóng lượt.';timer=`<div class="timer ${time()<=3?'danger':''}" data-time>${time()}</div>`}
  if(state.phase==='question'){title=`Đội ${String(state.winner).padStart(2,'0')} đã nhận câu hỏi`;sub=`Cho đội đọc đề, rồi bắt đầu ${q().duration} giây trả lời.`;button=`<button class="btn mint" data-action="answer" data-primary>Bắt đầu trả lời</button>`}
  if(state.phase==='answering'){title='Đội đang trả lời';sub='MC có thể nhập đáp án trong lúc đội nói.';timer=`<div class="timer ${time()<=5?'danger':''}" data-time>${time()}</div>`;button=`<button class="btn gold" data-action="review" data-primary>Dừng thời gian</button>`}
  if(state.phase==='review'){title='Kiểm tra câu trả lời';sub='Có thể sửa bản nhập trước khi chấm.';button=`<button class="btn gold" data-action="grade" data-primary>Chốt điểm & hiện lời giải</button>`}
  if(state.phase==='result'){title=`Đã chốt ${state.last?.points||0}/10 điểm`;sub='Điểm đã cộng một lần. Sang câu tiếp theo khi giải thích xong.';button=`<button class="btn mint" data-action="next" data-primary>${state.index===14?'Kết thúc trò chơi':'Câu tiếp theo →'}</button>`}
  if(state.phase==='finished'){title='Phiên chơi đã khóa';sub='Nhấn S để mở bảng xếp hạng chung cuộc.';button=`<button class="btn red" data-action="reset">Chơi lại</button>`}
  return `<footer class="dock"><div><b>${title}</b><span>${sub} &nbsp; · &nbsp; <span class="kbd">R</span> Luật &nbsp; <span class="kbd">S</span> BXH</span></div><div class="actions">${timer}${button}</div></footer>`}
function bind(){document.querySelectorAll('[data-action]').forEach(el=>el.onclick=()=>act(el));document.querySelectorAll('[data-pair]').forEach(el=>el.onchange=()=>{state.answer.pairs[el.dataset.pair]=el.value;save()});document.querySelectorAll('[data-criterion]').forEach(el=>el.onchange=()=>{const i=+el.dataset.criterion;state.answer.criteria=el.checked?[...new Set([...state.answer.criteria,i])]:state.answer.criteria.filter(x=>x!==i);save()});const input=document.querySelector('[data-text]');if(input)input.oninput=()=>{state.answer.text=input.value;localStorage.setItem(KEY,JSON.stringify(state))}}
function act(el){const a=el.dataset.action;
  if(a==='stage')return openStage();if(a==='host'){location.hash='';return}if(a==='sound')return toggleSound();if(a==='fullscreen')return toggleFullscreen();
  if(a==='start'){state.phase='ready';state.index=0;state.results=[];state.last=null;state.answer=empty();return save('Đã mở hồ sơ 01')}
  if(a==='signal'){state.phase='countdown';state.deadline=Date.now()+3000;cue('count');return save()}
  if(a==='winner'){if(state.phase!=='claim'||state.winner)return;state.winner=+el.dataset.team;state.phase='question';state.deadline=null;cue('pickup');return save(`Đội ${String(state.winner).padStart(2,'0')} giành quyền`)}
  if(a==='answer'){state.phase='answering';state.deadline=Date.now()+q().duration*1000;cue('start');return save()}
  if(a==='review'){state.phase='review';state.deadline=null;return save('Đã dừng thời gian')}
  if(a==='pick'){state.answer.selected=el.dataset.value;return save()}
  if(a==='truth'){state.answer.truth[+el.dataset.index]=el.dataset.value==='true';return save()}
  if(a==='order'){const i=+el.dataset.index,p=state.answer.order.indexOf(i);p>=0?state.answer.order.splice(p,1):state.answer.order.push(i);return save()}
  if(a==='grade')return grade();
  if(a==='next'){if(state.index===14){state.phase='finished';state.deadline=null;cue('finish')}else{state.index++;state.phase='ready';state.winner=null;state.answer=empty();state.last=null}return save()}
  if(a==='reset'){if(confirm('Xóa toàn bộ điểm và chơi lại từ đầu?')){state=fresh();save('Đã tạo phiên mới')}}
}
function valid(){const x=q(),a=state.answer;if(['A','G'].includes(x.type))return !!a.selected;if(x.type==='B')return a.truth.every(v=>v!==null);if(x.type==='C')return a.order.length===x.items.length;if(x.type==='D')return x.labels.every((_,i)=>a.pairs[i]);if(x.type==='F')return !!a.text.trim();return true}
function grade(){if(state.phase!=='review')return;if(!valid())return toast('Chưa nhập đủ câu trả lời');const x=q(),a=state.answer;let points=0;if(['A','G'].includes(x.type))points=a.selected===x.correct?10:0;if(x.type==='B')points=x.correct.reduce((n,v,i)=>n+(a.truth[i]===v?5:0),0);if(x.type==='C')points=JSON.stringify(a.order)===JSON.stringify(x.correctOrder)?10:0;if(x.type==='D')points=x.correctPairs.reduce((n,v,i)=>n+(a.pairs[i]===v?2:0),0);if(['E','H'].includes(x.type))points=a.criteria.length*5;if(x.type==='F')points=x.accepted.some(v=>norm(v)===norm(a.text))?10:0;state.results=state.results.filter(r=>r.qid!==x.id);state.results.push({qid:x.id,teamId:state.winner,points});state.last={points};state.phase='result';state.deadline=null;cue(points===10?'good':'bad');save('Điểm đã được chốt')}
function norm(v){return String(v).normalize('NFC').trim().toLocaleLowerCase('vi-VN').replace(/\s+/g,' ')}
function tick(){document.querySelectorAll('[data-time]').forEach(el=>el.textContent=time());if(role!=='host'||!state.deadline||Date.now()<state.deadline)return;if(state.phase==='countdown'){state.phase='claim';state.deadline=Date.now()+8000;cue('ring');save()}else if(state.phase==='claim'){state.phase='result';state.deadline=null;state.winner=null;state.last={points:0};save('Không có đội giành quyền')}else if(state.phase==='answering'){state.phase='review';state.deadline=null;save('Hết giờ — kiểm tra câu trả lời')}}
function rules(){return `<div class="modal" data-close><div class="modal-card"><div class="modal-head"><div><div class="eyebrow">Phím R · Luật chơi</div><h2>Ba bước duy nhất</h2></div><button class="btn" data-action="close">Đóng Esc</button></div><div class="rules-grid"><div class="rule"><strong>01</strong><b>Chờ tín hiệu 404</b><p>Chỉ giành quyền khi màn hình hiện “PHÒNG 404 — BẮT MÁY”.</p></div><div class="rule"><strong>02</strong><b>Một đội trả lời</b><p>MC xác nhận một đội. Sai hoặc hết giờ không chuyển lượt.</p></div><div class="rule"><strong>03</strong><b>Tối đa 10 điểm</b><p>Hệ thống tự cộng điểm sau khi MC chốt. Bằng điểm được đồng hạng.</p></div></div><div class="shortcuts"><div><span>Mở/đóng luật</span><span class="kbd">R</span></div><div><span>Bảng xếp hạng</span><span class="kbd">S</span></div><div><span>Bật/tắt âm thanh</span><span class="kbd">M</span></div><div><span>Toàn màn hình</span><span class="kbd">F</span></div></div></div></div>`}
function board(){return `<div class="modal"><div class="modal-card"><div class="modal-head"><div><div class="eyebrow">Bảng xếp hạng</div><h2>Hồ sơ 404</h2></div><button class="btn" data-action="close">Đóng Esc</button></div><div class="board">${rankings().map((t,i)=>`<div class="board-row ${i<3?'top':''}"><span class="eyebrow">#${t.rank}</span><span>Đội ${String(t.id).padStart(2,'0')}<br><small>${esc(t.name)}</small></span><strong>${t.score}</strong></div>`).join('')}</div></div></div>`}
function toggleRules(){const o=document.getElementById('overlay');o.innerHTML=o.innerHTML?'':rules();bindOverlay()}
function toggleScores(){const o=document.getElementById('overlay');o.innerHTML=o.innerHTML?'':board();bindOverlay()}
function closeOverlay(){document.getElementById('overlay').innerHTML=''}function bindOverlay(){document.querySelectorAll('[data-action="close"]').forEach(x=>x.onclick=closeOverlay)}
function openStage(){window.open(location.href.split('#')[0]+'#stage','room404-stage')}
function toggleFullscreen(){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.()}
function toggleSound(){state.sound=!state.sound;if(state.sound)audio();save(state.sound?'Đã bật âm thanh':'Đã tắt âm thanh')}
let ctx;function audio(){try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();ctx.resume()}catch(_){}}
function cue(kind){if(!state.sound)return;audio();const f={count:430,ring:760,pickup:520,start:620,good:880,bad:180,finish:990}[kind]||440;const o=ctx.createOscillator(),g=ctx.createGain();o.type=kind==='bad'?'sawtooth':'sine';o.frequency.setValueAtTime(f,ctx.currentTime);g.gain.setValueAtTime(.001,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.12,ctx.currentTime+.02);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.35);o.connect(g).connect(ctx.destination);o.start();o.stop(ctx.currentTime+.38)}
function toast(text){const el=document.getElementById('toast');el.innerHTML=`<div class="toast">${esc(text)}</div>`;setTimeout(()=>el.innerHTML='',2200)}
try{setInterval(tick,200);render()}catch(error){console.error(error);try{localStorage.removeItem(KEY);state=fresh();render()}catch(second){console.error(second);document.getElementById('app').innerHTML=`<main class="main" style="grid-template-columns:1fr"><section class="scene"><div class="scene-body"><div class="hero"><div class="eyebrow">ROOM 404</div><h1>Không thể mở<br><em>bảng điều khiển</em></h1><p>Nhấn Ctrl + F5 để tải lại toàn bộ phiên bản mới.</p><button class="btn gold" onclick="location.reload()">Tải lại trang</button></div></div></section></main>`}}
</script></body></html>
