<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b18">
  <title>VAULT 25 · Mật kho không tồn tại</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&family=DM+Mono:wght@400;500&family=Grenze+Gotisch:wght@400;500;600;700;800&family=UnifrakturCook:wght@700&display=swap");
    :root {
      --bg: #080b18;
      --bg2: #111830;
      --ink: #f8f5ec;
      --muted: #9da8c4;
      --dim: #647091;
      --line: #ffffff1c;
      --line2: #ffffff34;
      --violet: #9575ff;
      --cyan: #69e7ff;
      --gold: #ffd166;
      --pink: #ff6b9d;
      --green: #69e0ad;
      --danger: #ff6d7c;
      --sans: "Be Vietnam Pro", system-ui, sans-serif;
      --display: "Grenze Gotisch", "Be Vietnam Pro", Georgia, serif;
      --gothic: "UnifrakturCook", "Grenze Gotisch", Georgia, serif;
      --mono: "DM Mono", monospace;
    }
    * { box-sizing: border-box; }
    html, body { min-width: 320px; min-height: 100%; margin: 0; background: var(--bg); }
    body { color: var(--ink); font-family: var(--sans); overflow-x: hidden; }
    button, input { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, a:focus-visible { outline: 3px solid var(--cyan); outline-offset: 3px; }
    a { color: inherit; text-decoration: none; }
    .app { min-height: 100vh; position: relative; isolation: isolate; }
    .app::before { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: -2; background: radial-gradient(circle at 80% -10%, #7f68ff3b, transparent 35%), radial-gradient(circle at 0% 100%, #19d8ff13, transparent 32%), linear-gradient(145deg, #070a15, #0b1022 52%, #0a0c18); }
    .app::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: -1; opacity: .16; background-image: linear-gradient(#ffffff06 1px, transparent 1px), linear-gradient(90deg, #ffffff06 1px, transparent 1px); background-size: 42px 42px; mask-image: linear-gradient(180deg, #000, transparent 90%); }
    .mono { font-family: var(--mono); }
    .eyebrow { color: var(--gold); font: 11px var(--mono); letter-spacing: .18em; text-transform: uppercase; }
    .muted { color: var(--muted); }
    .dim { color: var(--dim); }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 9px; min-height: 42px; padding: 11px 16px; border: 1px solid var(--line2); border-radius: 13px; background: #ffffff0c; color: var(--ink); font-weight: 800; font-size: 12px; transition: transform .16s ease, filter .16s ease, border-color .16s ease; }
    .btn:hover { transform: translateY(-2px); filter: brightness(1.13); border-color: #ffffff76; }
    .btn.primary { background: var(--cyan); color: #06111a; border-color: var(--cyan); }
    .btn.gold { background: var(--gold); color: #21190a; border-color: var(--gold); }
    .btn.green { background: var(--green); color: #071912; border-color: var(--green); }
    .btn.danger { background: var(--danger); color: #250a10; border-color: var(--danger); }
    .btn.ghost { background: transparent; }
    .btn.large { min-height: 62px; padding: 16px 24px; font-size: 15px; border-radius: 17px; }
    .btn:disabled { opacity: .42; cursor: not-allowed; transform: none; filter: none; }

    /* Home */
    .home { min-height: 100vh; width: min(1240px, calc(100% - 40px)); margin: 0 auto; display: grid; place-items: center; padding: 44px 0; }
    .home-grid { width: 100%; display: grid; grid-template-columns: minmax(0, .9fr) minmax(360px, 1.1fr); gap: clamp(28px, 6vw, 86px); align-items: center; }
    .home-copy h1 { margin: 17px 0 22px; max-width: 720px; font: 800 clamp(54px, 8vw, 112px)/.88 var(--display); letter-spacing: -.065em; }
    .home-copy h1 em { color: var(--gold); font-style: normal; }
    .home-copy p { max-width: 520px; margin: 0; color: var(--muted); font-size: clamp(14px, 1.5vw, 18px); line-height: 1.65; }
    .home-actions { display: flex; flex-wrap: wrap; gap: 11px; margin-top: 30px; }
    .home-note { display: flex; gap: 26px; margin-top: 36px; }
    .home-note b { display: block; color: var(--gold); font: 800 26px var(--display); }
    .home-note span { display: block; margin-top: 3px; color: var(--dim); font-size: 10px; text-transform: uppercase; letter-spacing: .11em; }
    .museum-card { position: relative; min-height: 570px; overflow: hidden; border: 1px solid var(--line2); border-radius: 32px; background-image: linear-gradient(90deg, #060914c9, #06091422 55%, #06091455), url("assets/vault-hall.jpg"); background-position: center; background-size: cover; box-shadow: 0 35px 100px #0009; }
    .museum-card::before { content: "MUSEUM 00"; position: absolute; top: 22px; left: 28px; color: #ffffff7a; font: 11px var(--mono); letter-spacing: .2em; }
    .museum-card::after { content: ""; position: absolute; inset: 0; border: 1px solid #ffffff14; border-radius: 23px; pointer-events: none; background: linear-gradient(180deg, transparent 45%, #050711a8); }
    .museum-card > .home-door, .museum-card > .home-orbit, .museum-card > .home-piece, .museum-card > .museum-word { display: none; }
    .home-orbit { position: absolute; left: 49%; top: 45%; width: 220px; height: 220px; transform: translate(-50%, -50%); border: 1px solid #ffffff58; border-radius: 50%; box-shadow: 0 0 0 22px #ffffff06, 0 0 0 45px #ffffff04; animation: orbit 15s linear infinite; }
    .home-orbit::before, .home-orbit::after { content: ""; position: absolute; width: 12px; height: 12px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 25px var(--cyan); }
    .home-orbit::before { left: 18px; top: 35px; } .home-orbit::after { right: 25px; bottom: 20px; background: var(--gold); box-shadow: 0 0 25px var(--gold); }
    @keyframes orbit { to { transform: translate(-50%, -50%) rotate(360deg); } }
    .home-door { position: absolute; left: 31%; top: 17%; width: 38%; height: 62%; border: 10px solid #050711; border-bottom-width: 16px; border-radius: 130px 130px 0 0; background: linear-gradient(135deg, #554a9f, #1d234b 62%, #0a0d1e); box-shadow: inset 0 0 38px #0009, 0 22px 36px #0007; transform: perspective(500px) rotateY(-11deg); }
    .home-door::before { content: "∅"; position: absolute; inset: 17%; display: grid; place-items: center; border: 1px solid #69e7ff70; color: var(--cyan); font: 100px var(--display); text-shadow: 0 0 25px var(--cyan); }
    .home-door::after { content: ""; position: absolute; right: 9%; top: 54%; width: 10px; height: 10px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 20px var(--gold); }
    .home-piece { position: absolute; width: 82px; aspect-ratio: 1; border: 1px solid #ffffff70; background: #ffffff0b; backdrop-filter: blur(5px); box-shadow: 0 15px 30px #0007; clip-path: polygon(0 14%, 20% 14%, 20% 0, 52% 0, 52% 15%, 100% 15%, 100% 75%, 82% 75%, 82% 100%, 39% 100%, 39% 84%, 0 84%); animation: drift 5s ease-in-out infinite alternate; }
    .home-piece::before { content: ""; position: absolute; inset: 22%; border: 2px solid var(--gold); border-radius: 50%; }
    .hp1 { left: 9%; top: 25%; } .hp2 { right: 8%; top: 15%; animation-delay: -1s; } .hp3 { right: 11%; bottom: 16%; animation-delay: -2.2s; } .hp4 { left: 14%; bottom: 15%; animation-delay: -3.5s; }
    @keyframes drift { to { transform: translateY(-16px) rotate(8deg); } }

    /* Shared header and cards */
    .simple-header { min-height: 66px; display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 14px clamp(18px, 4vw, 58px); border-bottom: 1px solid var(--line); background: #080b18b8; backdrop-filter: blur(14px); }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-mark { width: 36px; height: 36px; display: grid; place-items: center; border: 1px solid var(--gold); border-radius: 11px; color: var(--gold); font: 18px var(--display); }
    .brand-copy b { display: block; font: 800 12px var(--display); letter-spacing: .16em; }
    .brand-copy span { display: block; color: var(--dim); font: 9px var(--mono); letter-spacing: .12em; margin-top: 2px; }
    .header-actions { display: flex; gap: 8px; align-items: center; }
    .connection-badge { display: inline-flex; align-items: center; gap: 6px; min-height: 28px; padding: 5px 9px; border: 1px solid #ffffff24; border-radius: 999px; color: var(--muted); font: 9px var(--mono); letter-spacing: .08em; white-space: nowrap; }
    .connection-badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 10px var(--gold); }
    .connection-badge.live { border-color: #69e0ad66; color: var(--green); }
    .connection-badge.live::before { background: var(--green); box-shadow: 0 0 10px var(--green); }
    .connection-badge.error { border-color: #ff6d7c66; color: var(--danger); }
    .connection-badge.error::before { background: var(--danger); box-shadow: 0 0 10px var(--danger); }
    .icon-btn { width: 38px; height: 38px; display: grid; place-items: center; border: 1px solid var(--line2); border-radius: 11px; background: #ffffff09; color: var(--ink); }
    .icon-btn:hover { border-color: var(--cyan); color: var(--cyan); }
    .panel { border: 1px solid var(--line); border-radius: 20px; background: linear-gradient(145deg, #171d36ee, #0d1225f0); box-shadow: 0 25px 70px #0003; overflow: hidden; }
    .panel-pad { padding: clamp(16px, 2.3vw, 27px); }
    .panel-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 17px 20px; border-bottom: 1px solid var(--line); }
    .panel-head h2, .panel-head h3 { margin: 0; font: 700 15px var(--display); }
    .tag { display: inline-flex; align-items: center; min-height: 25px; padding: 5px 9px; border: 1px solid var(--line2); border-radius: 999px; color: var(--muted); font: 10px var(--mono); letter-spacing: .08em; }

    /* Stage / PPT surface */
    .stage-root { min-height: 100vh; display: flex; flex-direction: column; background: #070a15; }
    .stage-header { position: relative; z-index: 5; min-height: 62px; display: flex; justify-content: space-between; align-items: center; padding: 14px clamp(18px, 4vw, 60px); border-bottom: 1px solid #ffffff1a; background: linear-gradient(180deg, #060914e8, transparent); }
    .stage-root:not(.stage-compact) .stage-header { position: absolute; inset: 0 0 auto; border-bottom: 0; background: transparent; }
    .stage-root:not(.stage-compact) .stage-header .brand-copy { display: none; }
    .stage-root:not(.stage-compact) .stage-header .brand-mark { opacity: .5; }
    .stage-root:not(.stage-compact) .stage-header .stage-code { opacity: .55; }
    .stage-header .stage-code { color: var(--muted); font: 12px var(--mono); }
    .stage-main { flex: 1; min-height: 0; display: grid; place-items: center; padding: clamp(18px, 4vw, 54px); position: relative; overflow: hidden; }
    .stage-main::before { content: ""; position: absolute; width: 72vw; height: 72vw; max-width: 1000px; max-height: 1000px; border-radius: 50%; background: radial-gradient(circle, #7c69ff20, transparent 63%); filter: blur(4px); }
    .slide { width: min(1220px, 100%); min-height: min(720px, 80vh); position: relative; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
    .slide-kicker { color: var(--gold); font: 11px var(--mono); letter-spacing: .22em; text-transform: uppercase; }
    .slide h1 { margin: 15px 0 0; max-width: 980px; font: 800 clamp(42px, 7.3vw, 105px)/.9 var(--display); letter-spacing: -.07em; }
    .slide h1 em { color: var(--cyan); font-style: normal; }
    .slide-sub { max-width: 620px; margin: 19px auto 0; color: var(--muted); font-size: clamp(13px, 1.4vw, 18px); line-height: 1.55; }
    .slide-number { position: absolute; left: 0; top: 3px; color: #ffffff4f; font: 11px var(--mono); letter-spacing: .15em; }
    .slide-visual { width: min(710px, 86vw); aspect-ratio: 1.48; position: relative; margin: 20px auto 13px; }
    .slide-visual.has-image { overflow: hidden; border: 1px solid #ffffff38; border-radius: 26px; box-shadow: 0 24px 50px #0008; background: #090c1a; }
    .slide-visual.has-image::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(180deg, #070a151c, #070a157a); }
    .slide-art-image { width: 100%; height: 100%; display: block; object-fit: cover; }
    .slide-visual.square-art { width: min(470px, 70vw); aspect-ratio: 1; }
    .slide-visual.square-art::after { background: linear-gradient(180deg, #070a1510, #070a1590); }
    .slide-visual.hero-art { width: min(940px, 92vw); aspect-ratio: 16 / 9; margin: 25px auto 15px; }
    .slide-visual.hero-art::after { background: linear-gradient(180deg, #070a1510 25%, #070a158e 100%); }
    .question-box.has-art { background-image: linear-gradient(90deg, #111830f7 0 63%, #111830bb 100%), url("assets/paradox-exhibit-shard.jpg"); background-repeat: no-repeat; background-position: center, right center; background-size: 100% 100%, auto 125%; }
    .question-box.has-art h2, .question-box.has-art .options { max-width: 69%; }
    .result-slide { position: relative; overflow: hidden; }
    .result-slide::before { content: ""; position: absolute; inset: 12% 23%; border-radius: 50%; background: url("assets/paradox-exhibit-shard.jpg") center / cover no-repeat; opacity: .18; filter: blur(1px) saturate(.8); }
    .result-slide > * { position: relative; z-index: 1; }
    .horror-script { font-family: var(--gothic); letter-spacing: .02em; text-shadow: 2px 0 #ff6b9d27, -2px 0 #69e7ff1c, 0 0 18px #ff6b9d2b; }
    .scene { width: 100%; height: 100%; display: block; filter: drop-shadow(0 25px 32px #0008); }
    .scene-glow { position: absolute; inset: 14% 16%; border-radius: 50%; background: radial-gradient(circle, #69e7ff32, transparent 60%); filter: blur(20px); animation: pulse 3.5s ease-in-out infinite; pointer-events: none; }
    @keyframes pulse { 50% { opacity: .45; transform: scale(1.08); } }
    .slide-puzzle { width: min(850px, 94vw); display: grid; grid-template-columns: repeat(4, 1fr); gap: clamp(8px, 1.4vw, 17px); margin: 24px auto 0; }
    .stage-piece { min-height: 118px; display: grid; place-items: center; gap: 5px; padding: 10px; border: 1px solid #ffffff3d; border-radius: 18px; background: linear-gradient(145deg, #ffffff13, #ffffff04); box-shadow: inset 0 0 22px #ffffff06, 0 12px 30px #0004; position: relative; overflow: hidden; }
    .stage-piece::before { content: ""; position: absolute; inset: 0; background: linear-gradient(120deg, transparent, #ffffff18, transparent); transform: translateX(-120%); animation: shine 4.2s ease-in-out infinite; }
    .stage-piece:nth-child(2)::before { animation-delay: .7s; } .stage-piece:nth-child(3)::before { animation-delay: 1.4s; } .stage-piece:nth-child(4)::before { animation-delay: 2.1s; }
    @keyframes shine { 45%, 100% { transform: translateX(120%); } }
    .piece-icon { width: 68px; height: 68px; }
    .stage-piece small { color: #ffffff9a; font: 10px var(--mono); letter-spacing: .12em; }
    .timer { min-width: 104px; padding: 10px 17px; border: 1px solid var(--pink); border-radius: 14px; color: var(--pink); font: 800 clamp(25px, 4vw, 48px) var(--mono); box-shadow: 0 0 25px #ff6b9d21; }
    .timer.safe { border-color: var(--cyan); color: var(--cyan); box-shadow: 0 0 25px #69e7ff21; }
    .buzz-line { display: flex; justify-content: center; align-items: center; gap: 16px; margin-top: 13px; color: var(--muted); font-size: 12px; }
    .winner-card { display: inline-flex; align-items: center; gap: 12px; margin: 23px auto 0; padding: 13px 18px; border: 1px solid #69e7ff69; border-radius: 15px; background: #69e7ff0c; }
    .winner-card .mascot-art { width: 42px; aspect-ratio: 1; flex: 0 0 auto; border-radius: 10px; }
    .winner-dot { width: 13px; height: 13px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 16px var(--cyan); }
    .winner-card b { font: 800 18px var(--display); }
    .question-box { width: min(970px, 95vw); margin: 22px auto 0; padding: clamp(18px, 3vw, 31px); border: 1px solid #ffffff32; border-radius: 23px; background: linear-gradient(145deg, #ffffff0f, #ffffff03); }
    .question-box h2 { margin: 0; font: 700 clamp(24px, 4vw, 47px)/1.04 var(--display); letter-spacing: -.04em; }
    .options { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 18px; text-align: left; }
    .option { display: flex; align-items: center; gap: 11px; min-height: 48px; padding: 11px 13px; border: 1px solid var(--line); border-radius: 13px; background: #ffffff08; color: var(--muted); font-size: clamp(12px, 1.35vw, 15px); }
    .option b { width: 28px; height: 28px; display: grid; place-items: center; flex: 0 0 auto; border-radius: 9px; background: #ffffff12; color: var(--gold); font: 700 12px var(--mono); }
    .result-mark { width: 116px; height: 116px; display: grid; place-items: center; margin-bottom: 19px; border: 1px solid var(--green); border-radius: 50%; color: var(--green); font: 700 64px var(--display); box-shadow: 0 0 50px #69e0ad2a; animation: result-pop .5s ease-out; }
    .result-mark.wrong { border-color: var(--danger); color: var(--danger); box-shadow: 0 0 50px #ff6d7c25; }
    @keyframes result-pop { from { transform: scale(.45); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .award { color: var(--gold); font: 800 clamp(60px, 11vw, 150px)/.8 var(--display); letter-spacing: -.08em; text-shadow: 0 0 32px #ffd16635; }
    .scoreboard-slide { width: min(960px, 95vw); margin: 20px auto 0; }
    .score-row { display: grid; grid-template-columns: 46px minmax(0,1fr) 70px; align-items: center; gap: 12px; min-height: 54px; padding: 7px 11px; border-bottom: 1px solid var(--line); text-align: left; }
    .score-row:first-child { border: 1px solid #ffd16663; border-radius: 14px; background: #ffd1660b; }
    .score-rank { color: var(--gold); font: 700 18px var(--mono); }
    .score-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; }
    .score-bar { height: 5px; margin-top: 6px; border-radius: 99px; background: #ffffff12; overflow: hidden; }
    .score-bar i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--violet), var(--cyan)); }
    .score-points { color: var(--gold); text-align: right; font: 700 17px var(--mono); }
    .podium { display: flex; align-items: flex-end; justify-content: center; gap: 10px; height: 230px; margin: 26px auto; }
    .podium-col { width: min(22vw, 190px); min-width: 95px; display: grid; gap: 9px; justify-items: center; }
    .podium-col b { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
    .podium-block { width: 100%; display: grid; place-items: center; border: 1px solid #ffffff2e; border-bottom: 0; border-radius: 15px 15px 0 0; background: linear-gradient(180deg, #ffffff17, #ffffff05); color: var(--gold); font: 800 30px var(--display); }
    .p1 .podium-block { height: 165px; } .p2 .podium-block { height: 120px; } .p3 .podium-block { height: 90px; }
    .stage-footer { min-height: 38px; display: flex; justify-content: space-between; align-items: center; padding: 9px clamp(18px, 4vw, 60px); color: #ffffff54; font: 10px var(--mono); letter-spacing: .08em; }

    /* Host remote */
    .host-root { min-height: 100vh; }
    .host-wrap { width: min(1420px, calc(100% - 36px)); margin: 0 auto; padding: 24px 0 50px; }
    .host-grid { display: grid; grid-template-columns: minmax(0, 1.16fr) minmax(330px, .84fr); gap: 16px; align-items: start; }
    .preview-frame { min-height: 620px; display: grid; place-items: center; padding: 12px; border: 1px solid #ffffff1f; border-radius: 23px; background: #050813; overflow: hidden; }
    .preview-frame .stage-root { width: 100%; min-height: 590px; border-radius: 16px; transform-origin: top left; }
    .preview-frame .stage-header { min-height: 42px; padding: 8px 15px; }
    .preview-frame .stage-main { padding: 16px; }
    .preview-frame .slide { min-height: 0; height: 500px; }
    .preview-frame .slide h1 { font-size: clamp(27px, 4vw, 55px); }
    .preview-frame .slide-visual { width: 68%; margin: 10px auto; }
    .preview-frame .slide-puzzle { gap: 5px; margin-top: 9px; }
    .preview-frame .stage-piece { min-height: 60px; border-radius: 10px; }
    .preview-frame .piece-icon { width: 35px; height: 35px; }
    .preview-frame .stage-piece small { font-size: 7px; }
    .preview-frame .question-box { margin-top: 10px; padding: 13px; border-radius: 13px; }
    .preview-frame .question-box h2 { font-size: 23px; }
    .preview-frame .option { min-height: 29px; padding: 5px; font-size: 9px; border-radius: 7px; }
    .preview-frame .option b { width: 18px; height: 18px; border-radius: 5px; font-size: 8px; }
    .preview-frame .winner-card { margin-top: 9px; padding: 7px 10px; }
    .preview-frame .winner-card b { font-size: 11px; }
    .preview-frame .timer { min-width: 52px; padding: 4px 8px; font-size: 19px; }
    .remote { display: grid; gap: 13px; }
    .remote-status { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
    .status-tile { padding: 13px; border: 1px solid var(--line); border-radius: 14px; background: #ffffff07; }
    .status-tile small { display: block; color: var(--dim); font: 10px var(--mono); letter-spacing: .08em; }
    .status-tile b { display: block; margin-top: 5px; font: 700 20px var(--display); }
    .remote-actions { display: grid; gap: 9px; }
    .remote-actions .btn { width: 100%; min-height: 56px; font-size: 14px; }
    .auto-note { padding: 11px 13px; border: 1px solid #69e7ff32; border-radius: 13px; background: #69e7ff08; color: var(--muted); font-size: 11px; line-height: 1.5; }
    .remote-live { display: grid; gap: 5px; padding: 14px; border: 1px solid #ffffff20; border-radius: 14px; background: #ffffff08; text-align: center; }
    .remote-live b { font: 700 20px var(--display); }
    .remote-timer { color: var(--pink); font: 800 39px var(--mono) !important; }
    .remote-duo { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
    .mini-score { display: grid; gap: 4px; }
    .mini-score-row { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 11px; }
    .mini-score-row b:last-child { color: var(--gold); font-family: var(--mono); }
    .keyboard-note { color: var(--dim); text-align: center; font: 10px var(--mono); }

    /* Team phone */

    /* Betting / mascot layer */

    .vault-chip b { color: var(--gold); font-size: 16px; }

    .bid-rail { width: min(620px, 88vw); display: grid; gap: 5px; margin: 15px auto 0; }
    .bid-row { display: grid; grid-template-columns: 34px minmax(0,1fr) 54px; align-items: center; gap: 8px; min-height: 25px; padding: 4px 8px; border: 1px solid #ffffff16; border-radius: 9px; background: #ffffff06; text-align: left; }
    .bid-row b { color: var(--gold); font: 700 12px var(--mono); }

    .bid-row strong { color: var(--cyan); text-align: right; font: 700 13px var(--mono); }
    .bid-meter { height: 4px; margin-top: 3px; border-radius: 99px; background: #ffffff12; overflow: hidden; }
    .bid-meter i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--violet), var(--cyan)); }
    .reveal-badge { display: inline-flex; align-items: center; gap: 9px; margin-top: 12px; padding: 9px 15px; border: 1px solid #69e7ff66; border-radius: 999px; background: #69e7ff12; color: var(--cyan); font: 800 13px var(--mono); }
    .reveal-badge b { color: var(--gold); font-size: 20px; }
    .stage-score-strip { width: min(680px, 88vw); display: grid; gap: 4px; margin: 18px auto 0; }

    /* Vault 25 visual layer */
    .stage-root { position: relative; isolation: isolate; overflow: hidden; background: #050712 url("assets/vault-chamber.jpg") center / cover fixed no-repeat; }
    .stage-root::before { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(90deg, #050712f2 0%, #0507129c 42%, #050712c8 100%), radial-gradient(circle at 61% 48%, #69e7ff22, transparent 33%); z-index: 0; }
    .stage-main { z-index: 1; padding-right: clamp(220px, 20vw, 310px); }
    .stage-main::before { background: radial-gradient(circle at 52% 46%, #69e7ff22, transparent 48%), radial-gradient(circle at 58% 82%, #ffd16616, transparent 31%); }
    .stage-header, .stage-footer { z-index: 4; }
    .vault-backdrop { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
    .vault-backdrop::before, .vault-backdrop::after { content: ""; position: absolute; border-radius: 50%; border: 1px solid #69e7ff28; transform: translate(-50%, -50%); left: 52%; top: 51%; animation: vault-spin 28s linear infinite; }
    .vault-backdrop::before { width: min(72vw, 920px); aspect-ratio: 1; box-shadow: 0 0 0 28px #69e7ff05, 0 0 90px #69e7ff15; }
    .vault-backdrop::after { width: min(47vw, 590px); aspect-ratio: 1; border-color: #ffd16638; animation-duration: 19s; animation-direction: reverse; }
    @keyframes vault-spin { to { transform: translate(-50%, -50%) rotate(360deg); } }
    .floating-core { position: absolute; z-index: 1; left: 51%; top: 53%; width: min(265px, 25vw); max-height: 48vh; object-fit: contain; transform: translate(-50%, -50%); filter: drop-shadow(0 0 28px #69e7ff75) drop-shadow(0 24px 32px #000b); animation: core-float 4.8s ease-in-out infinite; pointer-events: none; }
    @keyframes core-float { 0%, 100% { transform: translate(-50%, -50%) rotate(-2deg); } 50% { transform: translate(-50%, calc(-50% - 14px)) rotate(2deg); } }
    .spark { position: absolute; z-index: 2; width: 5px; height: 5px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 18px var(--cyan); animation: spark-drift 5s ease-in-out infinite; pointer-events: none; }
    .spark-a { left: 43%; top: 29%; } .spark-b { left: 63%; top: 69%; background: var(--gold); box-shadow: 0 0 18px var(--gold); animation-delay: -1.8s; } .spark-c { left: 68%; top: 37%; animation-delay: -3s; }
    @keyframes spark-drift { 50% { transform: translate(18px, -23px) scale(1.5); opacity: .45; } }
    .slide { z-index: 2; }
    .slide h1 { text-shadow: 0 8px 34px #000b; }
    .slide-kicker { text-shadow: 0 0 16px #ffd16644; }
    .vault-title-mark { width: min(250px, 34vw); aspect-ratio: 1; position: relative; margin: 20px auto 7px; display: grid; place-items: center; }
    .vault-title-mark::before { content: ""; position: absolute; inset: 0; border: 1px solid #69e7ff70; border-radius: 50%; box-shadow: 0 0 0 14px #69e7ff08, 0 0 50px #69e7ff22; animation: mark-pulse 3s ease-in-out infinite; }
    .vault-title-mark img { width: 72%; height: 72%; object-fit: contain; filter: drop-shadow(0 0 22px #69e7ffcc); animation: core-float 4s ease-in-out infinite; }
    @keyframes mark-pulse { 50% { transform: scale(1.06); opacity: .62; } }
    .difficulty-badge { display: inline-flex; align-items: center; gap: 11px; min-height: 42px; margin-top: 13px; padding: 7px 13px; border: 1px solid #ffd16670; border-radius: 999px; background: #080b18b8; box-shadow: 0 9px 24px #0006; }
    .difficulty-stars { color: var(--gold); font: 20px/1 var(--sans); letter-spacing: 2px; text-shadow: 0 0 14px #ffd16670; }
    .difficulty-points { color: var(--ink); font: 800 15px var(--mono); }
    .difficulty-mode { color: var(--muted); font: 9px var(--mono); letter-spacing: .12em; text-transform: uppercase; }
    .vault-card-scene { width: min(430px, 62vw); aspect-ratio: 1.15; position: relative; margin: 17px auto 3px; overflow: hidden; border: 1px solid #ffffff25; border-radius: 28px; background: linear-gradient(145deg, #0c1832d9, #050712d9), url("assets/vault-shard.jpg") center / cover; box-shadow: 0 25px 55px #0009, inset 0 0 40px #69e7ff1a; }
    .vault-card-scene::after { content: ""; position: absolute; inset: 0; background: linear-gradient(115deg, transparent 28%, #69e7ff25 50%, transparent 70%); transform: translateX(-120%); animation: shine 5s ease-in-out infinite; }
    .vault-card-scene img { position: absolute; inset: 8%; z-index: 1; width: 84%; height: 84%; object-fit: contain; filter: drop-shadow(0 0 25px #69e7ff99); }
    .loot-value { color: var(--gold); font: 800 clamp(35px, 5vw, 60px)/.9 var(--display); text-shadow: 0 0 24px #ffd16655; }
    .card-grid { width: min(420px, 100%); display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; margin: 21px auto 0; }
    .card-token { min-height: 56px; position: relative; display: grid; place-items: center; border: 1px solid #69e7ff40; border-radius: 12px; background: linear-gradient(145deg, #162b48, #0a1327); color: var(--cyan); font: 800 18px var(--mono); box-shadow: inset 0 0 14px #69e7ff0b, 0 7px 18px #0005; transition: transform .15s ease, border-color .15s ease, background .15s ease, opacity .15s ease; }
    .card-token::after { content: ""; position: absolute; inset: 4px; border: 1px solid #ffffff10; border-radius: 8px; pointer-events: none; }
    .card-token:hover { transform: translateY(-4px) scale(1.03); border-color: var(--gold); background: #ffd16618; color: var(--gold); }
    .card-token.used, .card-token:disabled { opacity: .2; filter: grayscale(.8); cursor: not-allowed; transform: none; }
    .card-token.selected { border-color: var(--gold); background: #ffd16625; color: var(--gold); box-shadow: 0 0 22px #ffd1662c; opacity: 1; }
    .card-grid-note { display: flex; justify-content: space-between; gap: 8px; margin-top: 10px; color: var(--dim); font: 9px var(--mono); letter-spacing: .08em; text-transform: uppercase; }
    .stage-token-grid { width: min(470px, 60vw); grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 22px auto 0; }

    @keyframes media-pulse { 50% { box-shadow: 0 0 24px #69e7ff25; transform: translateY(-2px); } }
    .open-answer { width: min(650px, 88vw); min-height: 112px; display: grid; place-items: center; margin: 18px auto 0; border: 1px dashed #ffd16670; border-radius: 18px; background: #ffd1660a; color: var(--gold); font: 800 19px var(--mono); letter-spacing: .15em; }
    .rapid-cue { width: min(650px, 88vw); display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin: 15px auto 2px; opacity: .86; }
    .rapid-cue span { min-height: 39px; display: grid; place-items: center; border: 1px solid #69e7ff4d; border-radius: 9px; background: linear-gradient(145deg, #69e7ff27, #9575ff12); color: var(--cyan); font: 700 10px var(--mono); animation: rapid-flash 1.15s steps(2, end) infinite; }
    .rapid-cue span:nth-child(2) { animation-delay: .12s; } .rapid-cue span:nth-child(3) { animation-delay: .24s; } .rapid-cue span:nth-child(4) { animation-delay: .36s; } .rapid-cue span:nth-child(5) { animation-delay: .48s; }
    @keyframes rapid-flash { 50% { transform: scale(1.07); border-color: var(--gold); background: #ffd1662c; color: var(--gold); } }
    .stage-score-rail { position: absolute; z-index: 5; top: 50%; right: clamp(14px, 2.6vw, 42px); width: min(225px, 18vw); transform: translateY(-50%); padding: 12px 12px 9px; border: 1px solid #ffffff2c; border-radius: 20px; background: linear-gradient(160deg, #111a31d9, #070b18e6); box-shadow: 0 20px 55px #0009, inset 0 0 24px #69e7ff08; backdrop-filter: blur(13px); }
    .stage-mascot { overflow: hidden; }
    .stage-mascot::before { content: ""; position: absolute; inset: 7% 4% 10%; border-radius: 30px; background: linear-gradient(180deg, #070a1540, #070a15c8), url("assets/vault-mascots.jpg") center / cover; opacity: .24; filter: saturate(.85) contrast(1.1); box-shadow: inset 0 0 90px #050712; }
